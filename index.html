<script>
'use strict';
/* =====================================================================
   Mode « Mise au point » : la même descente répétée, un réglage changé entre deux runs.
   Les runs d'une série portent cfg.ses = { m: 'mise', id, nom } (réglages de la page, gardés dans chaque run).
   Pour le run analysé, on retrouve les runs précédents de la série (résumés gardés sur l'appareil, sinon
   fichier relu), puis :
   1. ce qui a changé entre le run précédent et celui-ci (un réglage, plusieurs, aucun) ;
   2. si c'est le conseil précédent qui a été suivi, l'effet mesuré sur la grandeur visée, comparé au bruit
      (écart entre deux runs identiques de la série, sinon incertitude de la mesure) ;
   3. le conseil suivant, par encadrement (pas francs, ~1/4 de la plage) : continuer dans le même sens (ampleur
      ajustée à l'effet mesuré), revenir de la moitié du pas si le symptôme inverse est apparu (le bon réglage
      est entre les deux), revenir en arrière si c'est pire, doubler le pas si l'effet n'est pas mesurable (puis
      passer au levier suivant), ou confirmer / douter du conseil quand deux runs identiques se suivent ;
   4. ce que la série a appris : effet mesuré par clic, psi ou token (sensibilité).
   Les fonctions sessionEvaluate / sessionCompare sont pures (testées dans tools/tests).
   ===================================================================== */

const SES = { keep: 40, maxBack: 5, noise: { sag: 1.5, rate: 0.6, shift: 1.5, maxPct: 4, dive: 1.0 } };
const SES_FIELDS = {
  fork: ['pressure', 'pressure_plus', 'pressure_plusplus', 'tokens', 'lsc', 'hsc', 'lsr', 'hsr'],
  shock: ['pressure', 'spring_rate', 'hbc', 'lsc', 'hsc', 'lsr', 'hsr'],
};
const FIELD_KNOB = { pressure: 'spring', pressure_plus: 'spring', spring_rate: 'spring', pressure_plusplus: 'prog', tokens: 'prog', hbc: 'prog', lsc: 'lsc', hsc: 'hsc', lsr: 'lsr', hsr: 'hsr' };
const CLICK_FIELDS = new Set(['lsc', 'hsc', 'lsr', 'hsr', 'hbc']);

/* ---------------------------------------------------------------- résumé d'un run */
/** Ce qu'il faut garder d'un run pour le comparer aux suivants (quelques centaines d'octets). */
function runSummary(P, M, name) {
  const A = M.advice || { findings: [] }, cfg = P.cfg || {}, D = Math.max(1, M.dur) / 60, h = P.hdr || {};
  const air = typeof airMaskPot === 'function' ? airMaskPot(P) : null, sh = M.adviceShift || [];
  const set = { fork: {}, shock: {} };
  ['fork', 'shock'].forEach(k => SES_FIELDS[k].forEach(f => { const v = cfg[k] && cfg[k][f]; if (v !== undefined && v !== null) set[k][f] = v; }));
  const per = f => [0, 1].map(c => P.has[c] && M.ch[c] ? f(M.ch[c], c) : null);
  const tgt = [0, 1].map(c => { const t = sagTarget(cfg, c); return t ? t.range : null; });
  return {
    name, run: h.run != null ? +h.run : parseRunName(String(name).replace(/^local:/, '')).run, epoch: h.epoch || null,
    bike: (h.bike && (h.bike.id || h.bike.name)) || cfg.bike || '', ses: cfg.ses || null, set, units: { p: cfg.pressure_unit || 'psi', s: cfg.spring_unit || 'lb/in' },
    rng: { fork: (cfg.fork && cfg.fork.rng) || {}, shock: (cfg.shock && cfg.shock.rng) || {} }, dur: M.dur, tgt,
    m: {
      sag: per(m => m.rest ? m.staticPct : null),
      bottom: per(m => m.nBottom / D), nBottom: per(m => m.nBottom),
      top: per((m, c) => harshTopouts(P, M, c, air).length / D), nTop: per((m, c) => harshTopouts(P, M, c, air).length),
      shift: [0, 1].map(c => sh[c] ? sh[c].shift : null), shiftSd: [0, 1].map(c => sh[c] ? sh[c].sd : null),
      maxPct: per(m => m.maxPct), dive: M.adviceDive ? M.adviceDive.dive : null,
    },
    main: A.main ? { id: A.main.f.id, c: A.main.f.c, key: A.main.lever.key, dir: A.main.lever.dir, conf: A.main.f.conf, from: A.main.amt.from, to: A.main.amt.to, text: A.main.amt.text } : null,
    findings: (A.findings || []).map(f => ({ id: f.id, c: f.c, key: f.levers[0].key, dir: f.levers[0].dir, conf: f.conf })),
  };
}

/* ---------------------------------------------------------------- comparaison de deux runs */
/** Réglages qui ont changé entre deux runs : [{ c, field, key, from, to, dir }] (dir +1 = plus de pression,
 *  de progressivité ou d'amortissement ; clics comptés depuis fermé : moins de clics = plus d'amortissement). */
function settingsDiff(a, b) {
  const out = [];
  ['fork', 'shock'].forEach((k, c) => SES_FIELDS[k].forEach(f => {
    const x = a.set[k][f], y = b.set[k][f];
    if (x === undefined || y === undefined || x === y) return;
    const d = Math.sign(y - x);
    out.push({ c, field: f, key: FIELD_KNOB[f], from: x, to: y, dir: CLICK_FIELDS.has(f) ? -d : d, units: CLICK_FIELDS.has(f) ? Math.abs(y - x) : Math.abs(y - x) });
  }));
  return out;
}

/** Grandeur visée par un constat, son sens d'amélioration et son bruit propre. */
function targetOf(id, c, s) {
  const m = s.m;
  if (id === 'sag') {
    const v = m.sag[c], t = s.tgt[c];
    if (v == null || !t) return null;
    return { label: 'sag statique', v, unit: '%', want: v > t[1] ? -1 : v < t[0] ? 1 : 0, thr: v > t[1] ? t[1] : t[0], ok: v >= t[0] && v <= t[1], noise: SES.noise.sag };
  }
  if (id === 'bottom') return { label: 'fins de course par minute', v: m.bottom[c], unit: '/min', want: -1, thr: ADV.rate.bottom, ok: m.bottom[c] <= ADV.rate.bottom, noise: Math.max(SES.noise.rate, Math.sqrt(Math.max(1, m.nBottom[c])) / (s.dur / 60)) };
  if (id === 'rebound-fast') return { label: 'butées hautes rapides au sol par minute', v: m.top[c], unit: '/min', want: -1, thr: ADV.rate.top, ok: m.top[c] <= ADV.rate.top, noise: Math.max(SES.noise.rate, Math.sqrt(Math.max(1, m.nTop[c])) / (s.dur / 60)) };
  if (id === 'rebound-slow' || id === 'bottom-packing') return m.shift[c] == null ? null : { label: 'enfoncement dans les passages cassants', v: m.shift[c], unit: 'pts', want: -1, thr: 4, ok: m.shift[c] <= 4, noise: m.shiftSd[c] || SES.noise.shift };
  if (id === 'underuse') return { label: 'course max', v: m.maxPct[c], unit: '%', want: 1, thr: ADV.maxUse[c], ok: m.maxPct[c] >= ADV.maxUse[c], noise: SES.noise.maxPct };
  if (id === 'brake-dive') return m.dive == null ? null : { label: 'plongée au freinage', v: m.dive, unit: 'pts/0,1 g', want: -1, thr: null, ok: false, noise: SES.noise.dive };
  return null;
}

/**
 * Évalue le passage du run « a » (précédent) au run « b » (analysé) : ce qui a changé, si le conseil de « a » a été
 * suivi, et l'effet mesuré sur la grandeur visée (rapporté au bruit : noiseOf(id) si connu, sinon bruit propre).
 */
function sessionCompare(a, b, noiseOf) {
  const diff = settingsDiff(a, b), r = { from: a.name, to: b.name, diff, kind: diff.length === 0 ? 'same' : diff.length === 1 ? 'one' : 'multi' };
  if (r.kind !== 'one') return r;
  const ch = diff[0];
  r.followed = !!(a.main && a.main.c === ch.c && a.main.key === ch.key && a.main.dir === ch.dir);
  r.against = !!(a.main && a.main.c === ch.c && a.main.key === ch.key && a.main.dir === -ch.dir);
  const id = a.main && a.main.c === ch.c && a.main.key === ch.key ? a.main.id : (a.findings.find(f => f.c === ch.c && f.key === ch.key) || {}).id;
  if (!id) { r.outcome = 'info'; return r; }
  const ta = targetOf(id, ch.c, a), tb = targetOf(id, ch.c, b);
  if (!ta || !tb || ta.v == null || tb.v == null) { r.outcome = 'info'; return r; }
  const noise = Math.max(noiseOf ? noiseOf(id, ch.c) || 0 : 0, Math.hypot(ta.noise, tb.noise));
  const want = ta.want || (a.main ? a.main.dir * -1 : -1), delta = tb.v - ta.v, z = delta * want / noise;
  // conseil suivi : le sens de l'effet est prévu d'avance, seuil unilatéral de 1,5 écart-type pour l'amélioration ;
  // aggravation (ou changement non conseillé) : 2 écarts-types
  const up = r.followed ? 1.5 : 2;
  Object.assign(r, { id, metric: ta.label, unit: ta.unit, before: ta.v, after: tb.v, delta, noise, z, resolved: tb.ok,
    outcome: z >= up ? 'better' : z <= -2 ? 'worse' : 'flat', perUnit: ch.units ? delta / ch.units : null });
  return r;
}

/**
 * Conseil de la série : part du conseil propre au run (b.advice), corrigé par ce qu'ont montré les runs précédents.
 * hist : résumés des runs précédents de la série, du plus récent au plus ancien. Retourne { evals, advice, learned, notes }.
 */
function sessionEvaluate(cur, hist, A, cfg) {
  const out = { evals: [], learned: [], notes: [], advice: A };
  if (!hist.length) { out.notes.push('Premier run de la série : il sert de référence pour les suivants.'); return out; }
  const chain = [cur, ...hist], noisePairs = {};
  for (let i = 0; i < chain.length - 1; i++) {                 // bruit : écart entre deux runs identiques consécutifs
    const b = chain[i], a = chain[i + 1];
    if (settingsDiff(a, b).length) continue;
    (a.findings.concat(b.findings)).forEach(f => {
      const ta = targetOf(f.id, f.c, a), tb = targetOf(f.id, f.c, b);
      if (ta && tb && ta.v != null && tb.v != null) (noisePairs[f.id + f.c] = noisePairs[f.id + f.c] || []).push(Math.abs(tb.v - ta.v));
    });
  }
  const noiseOf = (id, c) => { const l = noisePairs[id + c]; return l && l.length ? l.reduce((s, x) => s + x, 0) / l.length : 0; };
  for (let i = 0; i < chain.length - 1; i++) out.evals.push(sessionCompare(chain[i + 1], chain[i], noiseOf));
  out.evals.filter(e => e.kind === 'one' && e.perUnit != null && e.outcome !== 'info').forEach(e => {
    const ch = e.diff[0];
    out.learned.push({ c: ch.c, key: ch.key, field: ch.field, units: ch.units, metric: e.metric, unit: e.unit, delta: e.delta, perUnit: e.perUnit, outcome: e.outcome, from: e.from, to: e.to, runs: [runNo(e.from), runNo(e.to)] });
  });
  let last = out.evals[0];
  // pas successifs dans le même sens sur le même réglage, chacun trop petit pour être mesuré seul : effet cumulé
  if (last.kind === 'one' && last.followed && last.outcome === 'flat') {
    const d0 = last.diff[0];
    let L = 1;
    while (L < out.evals.length && out.evals[L].kind === 'one' && out.evals[L].followed && out.evals[L].diff[0].field === d0.field && out.evals[L].diff[0].c === d0.c && out.evals[L].diff[0].dir === d0.dir) L++;
    if (L >= 2) {
      const cum = sessionCompare(chain[L], cur, noiseOf);
      if (cum.kind === 'one' && (cum.outcome === 'better' || cum.outcome === 'worse')) { cum.cumul = L; cum.step = last; last = cum; }
    }
  }
  out.last = last;
  if (!A) return out;
  const adv = Object.assign({}, A, { notes: (A.notes || []).slice() });
  out.advice = adv;
  const mk = (c, key, dir, f, conf, title, why, steps = 1) => {
    let amt = adviceAmount(cfg, c, key, dir, f || {});
    if (amt.ok && steps > 1) {                                  // ampleur ajustée à l'effet mesuré : jusqu'à 2 pas
      const amt2 = adviceAmount(Object.assign({}, cfg, { [c ? 'shock' : 'fork']: Object.assign({}, cfg[c ? 'shock' : 'fork'], { [amt.field || knobMeta(cfg, c, key).field]: amt.to }) }), c, key, dir, f || {});
      if (amt2.ok && amt2.to != null) amt = Object.assign({}, amt, { to: amt2.to, text: amt.verb + ' ' + describeSteps(amt, amt2, knobMeta(cfg, c, key)) });
    }
    if (!amt.ok) return null;
    const base = f || { id: 'session', c, levers: [{ key, dir }], stage: ADV.stage[key], z: 2, n: null, metric: {}, src: '' };
    return { f: Object.assign({}, base, { conf, title, why, levers: [{ key, dir }] }), lever: { key, dir }, amt };
  };
  if (last.kind === 'same') {
    const p = hist[0], same = p.main && A.main && p.main.c === A.main.f.c && p.main.key === A.main.lever.key && p.main.dir === A.main.lever.dir;
    if (A.main && same) { adv.main = Object.assign({}, A.main, { f: Object.assign({}, A.main.f, { conf: Math.min(3, A.main.f.conf + 1) }) }); adv.notes.push('Conseil confirmé : même conclusion sur deux runs identiques.'); }
    else if (A.main && p.main) {
      adv.notes.push('Deux runs identiques ne donnent pas le même conseil : il reste incertain.');
      if (A.main.f.conf <= 2) { adv.watch = { f: A.main.f, lever: A.main.lever }; adv.main = null; adv.abstain = true; adv.why = ['conseil différent sur deux runs aux réglages identiques : refaire un run pour trancher']; }
    }
    return out;
  }
  if (last.kind === 'multi') { adv.notes.push('Plusieurs réglages changés depuis le run précédent : leurs effets ne peuvent pas être séparés. Ne changer qu\'un réglage à la fois.'); if (adv.main) adv.main = Object.assign({}, adv.main, { f: Object.assign({}, adv.main.f, { conf: Math.min(2, adv.main.f.conf) }) }); return out; }
  if (!last.followed && !last.against) { adv.notes.push('Le réglage changé n\'est pas celui conseillé au run précédent : son effet est noté, le conseil repart de ce run.'); return out; }
  const ch = last.diff[0], prevF = A.findings.find(f => f.id === last.id && f.c === ch.c);
  // symptôme inverse sur le même réglage (ex. détente trop rapide → trop lente) : le pas est allé trop loin, le bon
  // réglage est entre les deux valeurs (encadrement) → revenir de la moitié du dernier pas
  const opp = last.followed && A.findings.find(f => f.c === ch.c && f.conf >= 2 && f.levers[0].key === ch.key && f.levers[0].dir === -ch.dir);
  if (opp) {
    const amt = halfBack(ch, cfg), lv = { key: ch.key, dir: -ch.dir };
    adv.main = { f: Object.assign({}, opp, { conf: 2, levers: [lv], title: CH_LABEL[ch.c] + ' : le dernier changement est allé trop loin',
      why: 'Après ' + describeChange(ch, cfg) + ', le symptôme inverse apparaît (« ' + opp.title + ' ») : le bon réglage est entre ' + fmtV(ch.from) + ' et ' + fmtV(ch.to) + ' ' + unitOf(ch, cfg) + '. Revenir de la moitié du dernier pas (méthode par encadrement).' }), lever: lv, amt };
    adv.abstain = false;
    adv.notes.push('Encadrement : le bon réglage de ' + knobMeta(cfg, ch.c, ch.key).name.toLowerCase() + ' est entre ' + fmtV(ch.from) + ' et ' + fmtV(ch.to) + ' ' + unitOf(ch, cfg) + '.');
    out.bracket = { c: ch.c, field: ch.field, lo: Math.min(ch.from, ch.to), hi: Math.max(ch.from, ch.to) };
    return out;
  }
  if (last.outcome === 'worse') {
    const back = mk(ch.c, ch.key, -ch.dir, prevF, 2, CH_LABEL[ch.c] + ' : le dernier changement a aggravé « ' + last.metric + ' »',
      'Après ' + describeChange(ch, cfg) + ', « ' + last.metric + ' » est passé de ' + fmt(last.before, 1) + ' à ' + fmt(last.after, 1) + ' ' + last.unit + ' (écart au-delà du bruit de ±' + fmt(last.noise, 1) + ') : revenir au réglage précédent.');
    if (back) { back.amt = Object.assign({}, back.amt, { to: ch.from, text: 'Revenir à ' + fmt(ch.from, Number.isInteger(ch.from) ? 0 : 1) + (CLICK_FIELDS.has(ch.field) ? ' clics depuis fermé' : ' ' + unitOf(ch, cfg)) }); adv.main = back; adv.abstain = false; }
    return out;
  }
  if (last.outcome === 'better' && last.resolved) { adv.notes.push('Objectif atteint pour « ' + last.metric + ' » : ' + fmt(last.before, 1) + ' → ' + fmt(last.after, 1) + ' ' + last.unit + ', dans le repère.'); return out; }
  if (last.outcome === 'better' && prevF) {
    const tc = targetOf(last.id, ch.c, cur), gap = tc && tc.thr != null ? Math.abs(last.after - tc.thr) : NaN;
    const steps = isFinite(gap) && Math.abs(last.delta) < gap * 0.6 ? 2 : 1;     // le dernier pas a fait moins de 60 % du chemin restant
    const cont = mk(ch.c, ch.key, ch.dir, prevF, Math.max(2, prevF.conf), prevF.title,
      'Le dernier changement (' + describeChange(ch, cfg) + ') a amélioré « ' + last.metric + ' » (' + fmt(last.before, 1) + ' → ' + fmt(last.after, 1) + ' ' + last.unit + ') sans atteindre le repère : continuer dans le même sens.', steps);
    if (cont) { adv.main = cont; adv.abstain = false; }
    return out;
  }
  if (last.outcome === 'flat' && prevF) {
    const prevFlat = out.evals[1] && out.evals[1].kind === 'one' && out.evals[1].followed && out.evals[1].outcome === 'flat' && out.evals[1].diff[0].key === ch.key;
    if (!prevFlat) {
      const again = mk(ch.c, ch.key, ch.dir, prevF, 2, prevF.title, 'L\'effet du dernier changement (' + describeChange(ch, cfg) + ') n\'est pas mesurable (écart de ' + fmt(last.delta, 1) + ' ' + last.unit + ' pour un bruit de ±' + fmt(last.noise, 1) + ') : un pas double dans le même sens, quitte à revenir en arrière au run suivant.', 2);
      if (again) { adv.main = again; adv.abstain = false; }
    } else {
      const next = prevF.levers.find(l => l.key !== ch.key && adviceAmount(cfg, prevF.c, l.key, l.dir, prevF).ok);
      adv.notes.push('Deux changements de ' + knobMeta(cfg, ch.c, ch.key).name.toLowerCase() + ' sans effet mesurable : ce levier semble peu efficace sur ce symptôme' + (next ? ', passage au levier suivant.' : '.'));
      const nx = next && mk(prevF.c, next.key, next.dir, prevF, 2, prevF.title, 'Le levier précédent n\'a pas eu d\'effet mesurable sur deux pas : levier suivant pour le même symptôme.');
      adv.main = nx || null;
      if (!nx) { adv.abstain = true; adv.why = ['aucun levier efficace trouvé pour ce symptôme sur cette série']; }
    }
  }
  return out;
}

const fmtV = v => fmt(v, Number.isInteger(v) ? 0 : 1);

/** Retour de la moitié du dernier changement ch (encadrement) ; pas d'un seul cran : retour à la valeur précédente. */
function halfBack(ch, cfg) {
  const k = knobMeta(cfg, ch.c, ch.key), clicks = CLICK_FIELDS.has(ch.field);
  const q = clicks || ch.field === 'tokens' ? 1 : ch.field === 'spring_rate' ? ((cfg.spring_unit || 'lb/in') === 'N/mm' ? 5 : 25) : ((cfg.pressure_unit || 'psi') === 'bar' ? 0.1 : 1);
  const span = Math.abs(ch.to - ch.from), half = span <= q ? span : Math.max(q, round(span / 2, q));
  const to = +(ch.to - Math.sign(ch.to - ch.from) * half).toFixed(q < 1 ? 1 : 0), dir = -ch.dir, verb = dir > 0 ? k.more : k.less, u = unitOf(ch, cfg);
  const text = span <= q
    ? 'Revenir à ' + fmtV(to) + ' ' + (clicks ? 'clics depuis fermé' : u) + ' (le bon réglage est entre les deux : garder celui qui donne le moins de symptômes)'
    : verb + (clicks ? ' ' + half + ' clic' + (half > 1 ? 's' : '') + ' (de ' + ch.to + ' à ' + to + ' depuis fermé)' : ch.field === 'tokens' ? ' (de ' + ch.to + ' à ' + to + ')' : ' de ' + fmtV(half) + ' ' + u + ' (de ' + fmtV(ch.to) + ' à ' + fmtV(to) + ')') + ' : moitié du dernier pas';
  return { ok: true, text, from: ch.to, to, unit: u, note: '', verb, half: true };
}

const runNo = n => { const r = parseRunName(String(n).replace(/^local:/, '')).run; return r != null ? r : n; };
const unitOf = (ch, cfg) => ch.field === 'tokens' ? 'token(s)' : ch.field === 'spring_rate' ? (cfg.spring_unit || 'lb/in') : CLICK_FIELDS.has(ch.field) ? 'clics' : (cfg.pressure_unit || 'psi');
function describeChange(ch, cfg) {
  const k = knobMeta(cfg, ch.c, ch.key);
  return k.name.toLowerCase() + ' ' + (CH_LABEL[ch.c] || '').toLowerCase() + ' de ' + fmt(ch.from, Number.isInteger(ch.from) ? 0 : 1) + ' à ' + fmt(ch.to, Number.isInteger(ch.to) ? 0 : 1) + ' ' + unitOf(ch, cfg);
}
function describeSteps(a1, a2, k) {
  const u = k.kind === 'clicks' ? 'clics' : k.kind === 'pressure' ? k.pu : k.kind === 'spring' ? k.su : '';
  const d = Math.abs(a2.to - a1.from);
  return (k.kind === 'pressure' || k.kind === 'spring' ? 'de ' : '') + fmt(d, Number.isInteger(d) ? 0 : 1) + ' ' + u + ' (de ' + fmt(a1.from, Number.isInteger(a1.from) ? 0 : 1) + ' à ' + fmt(a2.to, Number.isInteger(a2.to) ? 0 : 1) + (k.kind === 'clicks' ? ' depuis fermé' : '') + ')';
}

/* ---------------------------------------------------------------- mémoire des résumés (sur cet appareil) */
const sesKey = s => s.run + '|' + (s.epoch || '') + '|' + s.bike;
function sessionRemember(s) {
  if (!s || s.run == null) return;
  const all = store.get('sessum', {});
  all[sesKey(s)] = s;
  const keys = Object.keys(all);
  if (keys.length > SES.keep) keys.sort((a, b) => (+a.split('|')[0]) - (+b.split('|')[0])).slice(0, keys.length - SES.keep).forEach(k => delete all[k]);
  store.set('sessum', all);
}
function sessionFind(run, cur) {
  const all = store.get('sessum', {});
  const l = Object.values(all).filter(s => s.run === run && s.bike === cur.bike && (!cur.epoch || !s.epoch || s.epoch < cur.epoch));
  return l.sort((a, b) => (b.epoch || 0) - (a.epoch || 0))[0] || null;
}
const sameSeries = (a, b) => !!(a && b && a.ses && b.ses && a.ses.m === 'mise' && b.ses.m === 'mise' && a.ses.id === b.ses.id && a.bike === b.bike);

/**
 * Rattache le run analysé à sa série : retrouve les runs précédents (résumés gardés, sinon loader(n° de run) qui
 * relit le fichier et rend un résumé), puis évalue la série. M.session reçoit le résultat. Retourne true si fait.
 */
async function attachSession(P, M, name, loader) {
  const cur = runSummary(P, M, name);
  sessionRemember(cur);
  if (!cur.ses || cur.ses.m !== 'mise' || cur.run == null) return false;
  const hist = [];
  let loads = 0;
  for (let r = cur.run - 1; r > 0 && hist.length < SES.maxBack && cur.run - r <= SES.maxBack + 2; r--) {
    let s = sessionFind(r, cur);
    if (!s && loader && loads < 2) { loads++; try { s = await loader(r); } catch (e) { s = null; } if (s) sessionRemember(s); }
    if (!s) { if (hist.length || loads >= 2) break; continue; }
    if (!sameSeries(s, cur)) break;
    hist.push(s);
  }
  M.session = Object.assign(sessionEvaluate(cur, hist, M.advice, P.cfg || {}), { cur, hist, name: cur.ses.nom || ('série n° ' + cur.ses.id) });
  return true;
}

/* ---------------------------------------------------------------- affichage */
function sessionHTML(P, M) {
  const S = M.session;
  if (!S) return '';
  const cfg = P.cfg || {}, e = S.last, R = [];
  const row = (k, v) => R.push(`<p class="vrow"><span class="vk">${k}</span><span>${v}</span></p>`);
  if (!e) row('Série', esc(S.notes.join(' ')));
  else if (e.kind === 'same') row('Changement', 'aucun (run de répétabilité)');
  else if (e.kind === 'multi') row('Changement', '<b>' + e.diff.length + ' réglages</b> : ' + esc(e.diff.map(d => describeChange(d, cfg)).join(' ; ')));
  else {
    const res = { better: 'amélioration', worse: 'aggravation', flat: 'dans le bruit', info: 'non évalué' }[e.outcome];
    row('Changement', '<b>' + esc(describeChange(e.diff[0], cfg)) + '</b> <span class="muted">· ' + (e.followed ? 'conseil suivi' : e.against ? 'inverse du conseil' : 'autre réglage') + '</span>');
    if (e.metric) row('Effet', esc(e.metric.charAt(0).toUpperCase() + e.metric.slice(1)) + ' ' + fmt(e.before, 1) + ' → ' + fmt(e.after, 1) + ' ' + esc(e.unit) + ' <span class="muted">(±' + fmt(e.noise, 1) + ')</span> · <b>' + res + '</b>');
  }
  const n = S.hist.length + 1;
  return `<div class="dhead"><span class="lbl">Mise au point · ${esc(S.name)}</span><span class="muted small">${n} run${n > 1 ? 's' : ''}</span></div><div class="dbody">${R.join('')}</div>`;
}

<script>
'use strict';
/* =====================================================================
   Entrée auxiliaire AUX (PCB V11) et repères du téléphone
   - impulsions : vitesse de roue (aimant(s) + capteur à effet Hall / ILS),
     distance parcourue ; comparée à la vitesse GPS quand il y en a une
   - analogique : tension (mV) mise à l'échelle par les réglages de la page
     (valeur = a × V + b, nom et unité), 100 mesures par seconde
   - repères : instants marqués depuis la télécommande Bluetooth pendant le run
   ===================================================================== */

const AUX_DT = 0.1;                       // grille des courbes AUX (s), comme le GPS
const AUX_GAP_S = 2.5;                    // plus d'impulsion depuis 2,5 s : roue arrêtée

/** Blocs « AUX1 » : enregistrements de 8 octets (t µs, valeur, compteur). */
function parseAuxRecords(buf, spans) {
  const dv = new DataView(buf);
  let n = 0;
  for (const [, c] of spans) n += c;
  const t = new Float64Array(n), v = new Uint16Array(n), cnt = new Uint16Array(n);
  let i = 0;
  for (const [p, c] of spans) for (let k = 0; k < c; k++, i++) {
    const o = p + 8 + k * 8;
    t[i] = dv.getUint32(o, true) / 1e6;
    v[i] = dv.getUint16(o + 4, true);
    cnt[i] = dv.getUint16(o + 6, true);
  }
  return { n, t, v, cnt };
}

/** Courbe de l'entrée AUX sur une grille de 0,1 s couvrant le run. null si l'entrée n'était pas utilisée. */
function buildAux(P, run) {
  const h = P.hdr.aux, R = run.aux;
  if (!h || !h.mode) return null;
  const cfg = Object.assign({ label: '', unit: '', a: 1, b: 0, ppr: 1, circ: 2300 }, h.cfg || {});
  const N = Math.max(2, Math.floor(P.duration / AUX_DT) + 1), t0 = run.t[0], data = new Float32Array(N);
  const A = { mode: h.mode, cfg, dt: AUX_DT, N, data, count: R ? R.n : 0, dropped: h.dropped || 0 };
  if (!R || R.n < 2) { A.none = true; return A; }
  if (h.mode === 'pulse') {
    const stepM = (cfg.circ || 2300) / 1000 / Math.max(1, cfg.ppr || 1);   // distance entre deux impulsions (m)
    const tp = Array.from(R.t, x => x - t0);
    for (let k = 0, j = 0; k < N; k++) {
      const tk = k * AUX_DT;
      while (j < tp.length && tp[j] <= tk) j++;                             // tp[j - 1] <= tk < tp[j]
      if (j === 0 || j >= tp.length) continue;
      const d = tp[j] - tp[j - 1];
      if (d < AUX_GAP_S && tk - tp[j - 1] < AUX_GAP_S) data[k] = stepM / d * 3.6;
    }
    A.kmh = movAvg(data, 5);                                                 // lissage 0,5 s
    A.data = A.kmh;
    let pulses = 0;                                                          // d'après le compteur du boîtier (modulo 65 536) : compte aussi les impulsions non enregistrées
    for (let i = 1; i < R.n; i++) pulses += (R.cnt[i] - R.cnt[i - 1]) & 0xFFFF;
    A.distM = (pulses || R.n - 1) * stepM;
    A.stepM = stepM;
    A.label = 'Vitesse de roue';
    A.unit = 'km/h';
    A.decimals = 1;
  } else {
    const ts = new Float64Array(R.n), y = new Float32Array(R.n);
    for (let i = 0; i < R.n; i++) { ts[i] = R.t[i] - t0; y[i] = cfg.a * (R.v[i] / 1000) + cfg.b; }
    A.data = resample(ts, y, 0, AUX_DT, N);
    A.label = cfg.label || 'Entrée AUX';
    A.unit = cfg.unit || (cfg.a === 1 && cfg.b === 0 ? 'V' : '');
    A.decimals = 2;
  }
  let mx = -Infinity, mn = Infinity, sum = 0;
  for (let k = 0; k < N; k++) { const x = A.data[k]; if (x > mx) mx = x; if (x < mn) mn = x; sum += x; }
  A.max = mx; A.min = mn; A.mean = sum / N;
  return A;
}

/** Repères du téléphone (en-tête du run, ms depuis le début) -> instants sur l'axe des courbes (s). */
function runMarks(run) {
  return (run.marks || []).map((t, i) => ({ n: i + 1, t: t - run.t[0] })).filter(m => m.t >= 0);
}

/** Pastille de résumé pour l'en-tête de l'analyse. */
function auxChip(A) {
  if (!A) return null;
  if (A.none) return ['Entrée AUX', A.mode === 'pulse' ? 'aucune impulsion (capteur, aimant ?)' : 'aucune mesure'];
  if (A.mode === 'pulse') return ['Roue', fmt(A.distM / 1000, 2) + ' km · max ' + fmt(A.max, 0) + ' km/h'];
  return [A.label, fmt(A.min, 2) + ' à ' + fmt(A.max, 2) + (A.unit ? ' ' + A.unit : '')];
}

<script>
'use strict';
/* =====================================================================
   Diagnostic d'un run. Du plus important au détail :
   1. le verdict : UN conseil (réglage, sens, ampleur, confiance, mesure) ou l'abstention et ses raisons ;
   2. le réglage « à surveiller » (sens seulement) et, en mode Mise au point, le bilan du run précédent ;
   3. l'état de chaque réglage, fourche et amortisseur (conseil, à surveiller, bon, non évalué, sans objet) ;
   4. les observations qui ne touchent pas un réglage (données, sauts...).
   Le conseil vient d'advice.js (M.advice) et, en mode Mise au point, de session.js (M.session).
   ===================================================================== */
const TUNE_KEYS = KNOB_KEYS;
const SEV_RANK = { crit: 3, warn: 2, info: 1, ok: 0 };
const TUNE = { view: store.get('tuneView', 'both') };
const CONF_TXT = c => 'confiance ' + ADV.conf[c];

/** Compatibilité (télécommande) : nom, valeur actuelle et formulation des actions d'un réglage. */
function tuneMeta(cfg, c, key) {
  const k = knobMeta(cfg, c, key);
  const unit = k.kind === 'pressure' ? k.pu : k.kind === 'spring' ? k.su : k.kind === 'clicks' ? 'clics' : '';
  const cur = !k.avail ? null : k.cur === undefined || k.cur === null || k.cur === '' ? undefined
    : k.kind === 'positions' && k.positions ? 'position ' + (k.positions[Math.round(k.cur) - 1] || k.cur) : fmt(k.cur, Number.isInteger(+k.cur) ? 0 : 1) + (unit ? ' ' + unit : '');
  return Object.assign({}, k, { cur });
}

/** Le conseil et le réglage à surveiller du run (en tenant compte de la mise au point s'il y en a une). */
function runAdvice(M) {
  const S = M.session, A = M.advice || { findings: [], ok: [], abstain: true, why: ['analyse indisponible'], notes: [], gate: { why: [], warn: [] } };
  return S && S.advice ? S.advice : A;
}

/** Indication réglage par réglage pour la télécommande : { act, tone, dir, sub } ou null. */
function adviceHint(A, cfg, c, key) {
  if (!A) return null;
  if (A.main && A.main.f.c === c && A.main.lever.key === key) return { act: A.main.amt.text, tone: 'warn', dir: A.main.lever.dir, sub: CONF_TXT(A.main.f.conf) };
  if (A.watch && A.watch.f.c === c && A.watch.lever.key === key) {
    const k = knobMeta(cfg, c, key);
    return { act: 'À surveiller : ' + (A.watch.lever.dir > 0 ? k.more : k.less).toLowerCase(), tone: '', dir: A.watch.lever.dir, sub: 'sans ampleur' };
  }
  return null;
}

/* ---------------------------------------------------------------- verdict */
function evidenceHTML(f) {
  const m = f.metric || {};
  return `<p class="small m0"><b>${esc(m.label || 'Mesure')} : ${esc(typeof m.value === 'number' ? fmt(m.value, Number.isInteger(m.value) ? 0 : 1) : String(m.value))}${m.unit ? ' ' + esc(m.unit) : ''}</b>
    <span class="muted">· repère ${esc(m.ref || '—')}${f.n != null ? ' · ' + f.n + ' événement' + (f.n > 1 ? 's' : '') : ''} · ${esc(CONF_TXT(f.conf))}</span></p>`;
}

function verdictBlock(P, M) {
  const A = runAdvice(M), cfg = P.cfg || {}, g = A.gate || { why: [], warn: [] };
  const lines = [], det = [];                                  // det : détails, dans un panneau sous le verdict
  if (A.main) {
    const { f, lever, amt } = A.main, k = knobMeta(cfg, f.c, lever.key), m = f.metric || {};
    lines.push(`<div class="verdict warn"><span class="lbl">Conseil · un seul réglage à changer</span><strong>${esc(CH_LABEL[f.c])} · ${esc(k.name)}${k.abbr ? ' ' + dampTag(lever.key === 'prog' && k.abbr === 'HBC' ? 'hbc' : lever.key) : ''}</strong>
      <span>${esc(CONF_TXT(f.conf))} · ${esc(ADV.stageName[f.stage] || '')}</span></div>
      <ol class="todo"><li class="warn">${ico('warn', 'warn')}<span class="todo-w">${esc(f.title)}</span><span class="todo-a">${esc(amt.text)}</span><span class="todo-c"></span></li></ol>`);
    det.push(`<p class="vrow"><span class="vk">Mesure</span><span><b>${esc(m.label || '—')} : ${esc(typeof m.value === 'number' ? fmt(m.value, Number.isInteger(m.value) ? 0 : 1) : String(m.value || '—'))}${m.unit ? ' ' + esc(m.unit) : ''}</b> <span class="muted">· repère ${esc(m.ref || '—')}${f.n != null ? ' · ' + f.n + ' événement' + (f.n > 1 ? 's' : '') : ''}</span></span></p>`);
    if (amt.note) det.push(`<p class="vrow"><span class="vk">Attention</span><span>${esc(amt.note)}</span></p>`);
    det.push(`<details class="vwhy"><summary>Pourquoi ce réglage</summary><p>${esc(f.why)} <span class="muted">${esc(f.src || '')}</span></p>${f.blocked ? `<p class="muted">Leviers écartés : ${esc(f.blocked.join(' ; '))}.</p>` : ''}</details>`);
  } else if (g.cap === 0) {
    lines.push(`<div class="verdict"><span class="lbl">Diagnostic</span><strong>Pas de conseil pour ce run</strong><span>${esc(g.why.join(' ; ') || 'données insuffisantes')}</span></div>`);
  } else if (A.findings.length) {
    lines.push(`<div class="verdict"><span class="lbl">Diagnostic</span><strong>Pas de conseil sûr</strong><span>${esc((A.why || []).join(' ; ') || 'indices trop faibles')}</span></div>`);
  } else {
    const ev = A.ok.filter(o => !o.nodata), nd = A.ok.filter(o => o.nodata);
    if (nd.length) lines.push(`<div class="verdict"><span class="lbl">Diagnostic</span><strong>Aucun écart sur ce qui a pu être évalué</strong><span>${ev.length} point${ev.length > 1 ? 's' : ''} évalué${ev.length > 1 ? 's' : ''}, ${nd.length} non évalué${nd.length > 1 ? 's' : ''} : ${esc([...new Set(nd.map(o => o.nodata))].join(' ; '))}</span></div>`);
    else lines.push(`<div class="verdict ok"><span class="lbl">Diagnostic</span><strong>Aucun réglage à modifier</strong><span>${ev.length} point${ev.length > 1 ? 's' : ''} évalué${ev.length > 1 ? 's' : ''}, tous dans les repères</span></div>`);
  }
  if (A.watch) {
    const w = A.watch, k = knobMeta(cfg, w.f.c, w.lever.key);
    det.push(`<p class="vrow"><span class="vk">À surveiller</span><span>${esc(CH_LABEL[w.f.c])} · ${esc(k.name)} : ${esc((w.lever.dir > 0 ? k.more : k.less).toLowerCase())} si l'indice se confirme <span class="muted">(${esc(CONF_TXT(w.f.conf))})</span></span></p>`);
  }
  if (g.cap > 0) (g.ch || []).forEach((ch, c) => {
    if (ch && ch.why.length) det.push(`<p class="vrow"><span class="vk">${esc(CH_LABEL[c])}</span><span${ch.ok ? ' class="muted"' : ''}>${ch.ok ? '' : '<b>non évaluée</b> : '}${esc(ch.why.join(', '))}</span></p>`);
  });
  (A.notes || []).forEach(n => det.push(`<p class="vrow"><span class="vk">Série</span><span>${esc(n)}</span></p>`));
  if (det.length) lines.push(`<div class="vdetail">${det.join('')}</div>`);
  return lines.join('');
}

/* ---------------------------------------------------------------- état de chaque réglage */
function cellHTML(P, A, c, key) {
  const s = adviceStatus(P, A, c, key), k = s.k, id = key + c;
  const cur = k.avail ? (k.cur === undefined || k.cur === null || k.cur === '' ? '—' : tuneMeta(P.cfg, c, key).cur) : '';
  if (s.st === 'na') return `<div class="tcell muted"><div class="tact">Sans objet</div><div class="tsub">${esc(k.why || '')}</div></div>`;
  const label = s.st === 'main' ? A.main.amt.text : s.st === 'watch' ? 'À surveiller (' + (s.dir > 0 ? 'plus' : 'moins') + ')'
    : s.st === 'low' ? 'Indice faible (' + (s.dir > 0 ? 'plus' : 'moins') + ')' : s.st === 'ok' ? 'Bon' : 'Non évalué';
  const tone = s.st === 'main' ? 'warn' : s.st === 'ok' ? 'good' : '';
  const icon = s.st === 'main' ? ico('warn') : s.st === 'ok' ? ico('ok') : '';
  return `<div class="tcell${tone ? '' : ' muted'}"><div class="tact ${tone}">${icon}<span>${esc(label)}</span></div><div class="tsub">${esc(cur)}</div>
    <button type="button" class="ibtn" data-cell="${id}" aria-expanded="false" aria-label="Explication : ${esc(CH_LABEL[c])}, ${esc(k.name)}">${ico('info')}</button></div>`;
}

function cellInfo(P, A, c, key) {
  const s = adviceStatus(P, A, c, key), k = s.k;
  const fs = A.findings.filter(f => f.c === c && f.levers.some(l => l.key === key));
  const parts = [`<p><b>${esc(CH_LABEL[c])} · ${esc(k.name)}</b>${k.sub ? ' <span class="muted">— ' + esc(k.sub) + '</span>' : ''}</p>`];
  fs.forEach(f => parts.push(`<p><b>${esc(f.title)}.</b> ${esc(f.why)} <span class="muted">(${esc(CONF_TXT(f.conf))}${f.conflict ? ', indices contradictoires' : ''})</span></p>`));
  if (!fs.length && s.what) parts.push(`<p>${esc(s.st === 'ok' ? 'Évalué : ' + s.what + '.' : 'Non évalué : ' + s.what + '.')}</p>`);
  if (!fs.length && !s.what) parts.push('<p class="muted">Aucune règle ne porte sur ce réglage pour ce run.</p>');
  return parts.join('');
}

function tuneTableHTML(P, M) {
  const A = runAdvice(M), avail = [0, 1].filter(c => P.has[c]);
  if (!avail.length) return '<div class="zone"><strong>Aucune suspension enregistrée</strong><p>Cocher la fourche ou l\'amortisseur dans Réglages pour obtenir un diagnostic.</p></div>';
  let cols = (TUNE.view === 'both' ? [0, 1] : TUNE.view === 'fork' ? [0] : [1]).filter(c => P.has[c]);
  if (!cols.length) cols = avail;
  const rows = TUNE_KEYS.map(key => {
    const ks = cols.map(c => knobMeta(P.cfg, c, key));
    const label = KNOB_DAMP[key] ? KNOB_DAMP[key][0] : [...new Set(ks.map(k => k.name))].join(' / ');
    return `<div class="trow" data-key="${key}"><div class="tlab"><b>${esc(label)}</b>${KNOB_DAMP[key] ? '<span>' + dampTag(key) + '</span>' : ''}</div>
      ${cols.map(c => cellHTML(P, A, c, key)).join('')}</div><div class="tinfo hidden" data-for="${key}"></div>`;
  }).join('');
  const seg = [['both', 'Les deux'], ['fork', 'Fourche'], ['shock', 'Amortisseur']].map(([v, l]) => `<button type="button" data-view="${v}" aria-pressed="${TUNE.view === v}">${l}</button>`).join('');
  return `<div class="dhead"><span class="lbl">État de chaque réglage</span>${avail.length === 2 ? `<div class="seg sm" id="tuneView" role="group" aria-label="Suspensions affichées">${seg}</div>` : ''}</div>` +
    `<div class="ttable cols${cols.length}"><div class="trow thead"><div></div>${cols.map(c => `<div><span class="sw ${c ? 's' : 'f'}"></span>${CH_LABEL[c]}</div>`).join('')}</div>${rows}</div>`;
}

function findingsHTML(P, M) {
  const A = runAdvice(M);
  if (!A.findings.length) return '';
  return '<div class="dhead"><span class="lbl">Constats</span></div><ul class="obs">' + A.findings.map((f, i) => `
    <li class="ob ${A.main && A.main.f === f ? 'warn' : ''}">${A.main && A.main.f === f ? ico('warn') : '<span class="obdot" aria-hidden="true"></span>'}
      <div class="obt"><b>${esc(f.title)}</b> <span>· ${esc(CONF_TXT(f.conf))}${f.conflict ? ' · contradictoire' : ''}</span></div>
      <button type="button" class="ibtn obtog" data-fnd="${i}" aria-expanded="false" aria-label="Détails : ${esc(f.title)}">${ico('more')}</button>
      <div class="obx hidden" data-fnd-text="${i}">${evidenceHTML(f)}<p class="small m0">${esc(f.why)} <span class="muted">${esc(f.src || '')}</span></p></div></li>`).join('') + '</ul>';
}

function observationsHTML(diag) {
  const obs = diag.slice().sort((a, b) => SEV_RANK[b.sev] - SEV_RANK[a.sev]);
  if (!obs.length) return '';
  return '<div class="dhead"><span class="lbl">Observations</span></div><ul class="obs">' + obs.map((d, i) => `
    <li class="ob ${d.sev === 'warn' || d.sev === 'crit' ? d.sev : ''}">${d.sev === 'info' ? '<span class="obdot" aria-hidden="true"></span>' : ico(SEV_ICO[d.sev], d.sev)}
      <div class="obt"><b>${esc(d.title)}</b> <span>· ${esc(d.who)}</span></div>
      <button type="button" class="ibtn obtog" data-obs="${i}" aria-expanded="false" aria-label="Détails : ${esc(d.title)}">${ico('more')}</button>
      <div class="obx hidden" data-obs-text="${i}"><p class="small m0">${esc(d.text)}</p></div></li>`).join('') + '</ul>';
}

/** Rendu complet du diagnostic + ouverture des explications et choix Fourche / Amortisseur. */
function renderDiagnostic(box, P, M) {
  const A = runAdvice(M);
  box.innerHTML = verdictBlock(P, M) + (typeof sessionHTML === 'function' ? sessionHTML(P, M) : '') +
    tuneTableHTML(P, M) + findingsHTML(P, M) + observationsHTML(M.diag);
  box.onclick = e => {
    const vb = e.target.closest('#tuneView button');
    if (vb) { TUNE.view = vb.dataset.view; store.set('tuneView', TUNE.view); renderDiagnostic(box, P, M); return; }
    const ot = e.target.closest('.ob .obt'), ib = e.target.closest('.ibtn') || (ot && ot.parentElement.querySelector('.obtog'));   // titre cliquable aussi
    if (!ib) return;
    if (ib.dataset.obs != null || ib.dataset.fnd != null) {
      const p = box.querySelector(ib.dataset.obs != null ? `[data-obs-text="${ib.dataset.obs}"]` : `[data-fnd-text="${ib.dataset.fnd}"]`), open = p.classList.toggle('hidden') === false;
      ib.setAttribute('aria-expanded', open);
      return;
    }
    const id = ib.dataset.cell, key = id.slice(0, -1), c = +id.slice(-1), panel = box.querySelector(`.tinfo[data-for="${key}"]`);
    const wasOpen = ib.getAttribute('aria-expanded') === 'true';
    box.querySelectorAll(`.trow[data-key="${key}"] .ibtn`).forEach(b => b.setAttribute('aria-expanded', 'false'));
    if (wasOpen) { panel.classList.add('hidden'); return; }
    ib.setAttribute('aria-expanded', 'true');
    panel.innerHTML = cellInfo(P, A, c, key);
    panel.classList.remove('hidden');
  };
}
</script>
<script>
'use strict';
/* =====================================================================
   Télécommande Bluetooth du boîtier (PCB V11, firmware 11.0) : Web Bluetooth
   Protocole v3 (docs/ble_protocol.md) sur le service « Nordic UART » :
   commandes texte vers RX, lignes JSON du boîtier sur TX, données binaires
   (transfert des runs) sur 6E400004.
   Onglets :
     Run       démarrer / arrêter / repère / état, vélo utilisé
     Réglages  réglages des suspensions du vélo, avec les recommandations du
               dernier run analysé
     Analyse   transfert d'un run en Bluetooth puis diagnostic complet (le même
               moteur que la page du boîtier : analysis.js, imu.js, ui_tuning.js…)
     Capteurs  voies utilisées + contrôle en direct + calibrations
     Options   Wi-Fi, pause, LED, buzzer, code d'appairage, veille
   Chrome / Edge (Android, ordinateur), Bluefy (iPhone) ; page en https ou fichier local.
   « Mode démo » : boîtier simulé dans la page (même protocole).
   ===================================================================== */
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_DATA = '6e400004-b5a3-f393-e0a9-e50e24dcca9e';

const RM = {
  dev: null, rx: null, conn: false, want: false, demo: null, buf: [], q: Promise.resolve(), hasData: false,
  st: null, stAt: 0, info: null, infoV: 0, lv: null, hello: null, needCode: false,
  tab: store.get('rmTab2', 'run'), lastSeq: null, busy: false, layoutKey: '',
  bikes: null, bikeOpen: false, cfg: undefined, draft: null, dirty: false,
  files: null, xfer: null, anal: null, reco: null,
};

/* ---------------------------------------------------------------- liaison */
async function rmConnect() {
  if (!navigator.bluetooth) {
    toast('Bluetooth web indisponible. Utiliser Chrome ou Edge (Android, ordinateur) ou Bluefy (iPhone), page en https.', 8000);
    return;
  }
  try {
    RM.dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'SuspLogger' }, { namePrefix: 'SuspensionLogger' }, { services: [NUS] }], optionalServices: [NUS, 'battery_service'] });
    RM.dev.addEventListener('gattserverdisconnected', rmOnDisconnect);
    RM.want = true;
    await rmOpen();
  } catch (e) {
    if (e && e.name !== 'NotFoundError') toast('Connexion refusée : ' + e.message + '. Rapprocher le téléphone du boîtier, puis réessayer.', 6000);
  }
}

async function rmOpen() {
  rmSetConn(false);
  const srv = await RM.dev.gatt.connect();
  const svc = await srv.getPrimaryService(NUS);
  RM.rx = await svc.getCharacteristic(NUS_RX);
  const tx = await svc.getCharacteristic(NUS_TX);
  tx.addEventListener('characteristicvaluechanged', e => rmOnBytes(new Uint8Array(e.target.value.buffer)));
  await tx.startNotifications();
  try {                                                  // données binaires (firmware 10.1 et suivants)
    const dc = await svc.getCharacteristic(NUS_DATA);
    dc.addEventListener('characteristicvaluechanged', e => rmOnData(e.target.value));
    await dc.startNotifications();
    RM.hasData = true;
  } catch (e) { RM.hasData = false; }
  RM.buf = [];
  rmResetSession();
  rmSetConn(true);
  await rmSend('hello');
}

function rmResetSession() {
  RM.st = null; RM.info = null; RM.lv = null; RM.hello = null; RM.bikes = null; RM.cfg = undefined; RM.draft = null; RM.dirty = false;
  RM.files = null; if (RM.xfer) RM.xfer = null;
  RM.liveOn = false; RM.authed = false; RM.peak = [null, null];
}

function rmOnDisconnect() {
  rmSetConn(false);
  if (!RM.want) return;
  const retry = async (n) => {
    if (!RM.want || RM.conn) return;
    try { await rmOpen(); } catch (e) { setTimeout(() => retry(n + 1), Math.min(10000, 2000 + n * 1000)); }
  };
  setTimeout(() => retry(0), 1000);
}

function rmDisconnect() {
  RM.want = false;
  if (RM.demo) { clearInterval(RM.demo.timer); clearInterval(RM.demo.liveTimer); clearInterval(RM.demo.xferTimer); RM.demo = null; rmResetSession(); rmSetConn(false); return; }
  if (RM.dev && RM.dev.gatt.connected) RM.dev.gatt.disconnect();
}

const rmEnc = new TextEncoder(), rmDec = new TextDecoder();
/** Envoi d'une commande : les écritures Bluetooth sont mises en file (une seule à la fois). */
function rmSend(cmd) {
  if (RM.demo) { demoCommand(cmd); return Promise.resolve(); }
  const p = RM.q.then(() => { if (!RM.rx) throw new Error('non connecté'); return RM.rx.writeValue(rmEnc.encode(cmd + '\n')); });
  RM.q = p.catch(() => {});
  return p;
}

function rmOnBytes(u8) {
  for (const b of u8) {
    if (b === 10) {
      const line = rmDec.decode(new Uint8Array(RM.buf)).trim();
      RM.buf = [];
      if (line) rmOnLine(line);
    } else if (RM.buf.length < 8192) RM.buf.push(b);
  }
}

const codeKey = () => 'code:' + ((RM.hello && RM.hello.n) || (RM.dev && RM.dev.name) || 'boitier');

async function rmAfterAuth() {
  RM.needCode = false;
  RM.authed = true;
  const tz = -new Date().getTimezoneOffset();
  await rmSend('time ' + Math.floor(Date.now() / 1000 + tz * 60) + ' ' + tz);   // heure du téléphone pour les noms de fichiers
  await rmSend('info');
  await rmSend('status');
  await rmSend('bikes');
  RM.liveOn = false;
  syncLive();
  if (RM.tab === 'set' || RM.tab === 'run') await rmSend('cfg');   // Run : le sag visé des réglages pour la zone des jauges
  if (RM.tab === 'ana') await rmSend('files');
}

function rmOnLine(line) {
  let o;
  try { o = JSON.parse(line); } catch (e) { return; }
  if (o.l) {                                            // valeurs en direct
    const now = performance.now();                       // les barres glissent pendant l'intervalle mesuré entre deux trames
    if (RM.lvAt) { RM.lvDt = (RM.lvDt || 150) * 0.8 + Math.min(500, now - RM.lvAt) * 0.2; document.documentElement.style.setProperty('--poll', Math.round(RM.lvDt) + 'ms'); }
    RM.lvAt = now;
    RM.lv = o; rmLive(); return;
  }
  switch (o.r) {
    case 'bye':                                          // le module au cintre a pris la main (prioritaire)
      RM.want = false;
      toast(o.m || 'Le module au cintre est connecté au boîtier.', 9000);
      return;
    case 'hello':
      RM.hello = o;
      RM.authed = false; RM.liveOn = false;
      if (o.auth) { const c = store.get(codeKey(), ''); if (c) rmSend('auth ' + c); else { RM.needCode = true; rmRender(); } }
      else rmAfterAuth();
      return;
    case 'auth':
      if (o.ok) rmAfterAuth();
      else { store.set(codeKey(), ''); RM.needCode = true; toast(o.m || 'Code incorrect', 5000); rmRender(); }
      return;
    case 'info': {
      const prevBike = RM.info && RM.info.bike ? RM.info.bike.id : null, bike = o.bike ? o.bike.id : null;
      RM.info = o; RM.infoV++;
      if (prevBike !== bike || (RM.cfg !== undefined && !RM.dirty)) rmSend('cfg');   // vélo changé : ses réglages
      if (prevBike !== bike) rmSend('bikes');
      rmRender();
      return;
    }
    case 'bikes': RM.bikes = o; rmRender(); return;
    case 'cfg':
      if (o.ok === false) { toast(o.m || 'Réglages refusés', 5000); RM.saving = false; rmRender(); return; }
      if ('cfg' in o) { RM.cfg = o.cfg; if (!RM.dirty) RM.draft = null; RM.layoutKey = ''; rmRender(); }
      else { RM.saving = false; RM.dirty = false; toast(o.m || 'Réglages enregistrés'); rmSend('cfg'); }
      return;
    case 'files': if (o.ok) RM.files = o.files; else toast(o.m, 5000); RM.layoutKey = ''; rmRender(); return;
    case 'get': if (o.ok) xferBegin(o); else { toast(o.m, 5000); RM.xfer = null; RM.layoutKey = ''; rmRender(); } return;
    case 'got': if (o.ok) xferDone(); else xferFail(o.m || 'Transfert interrompu'); return;
  }
  if (o.r) {
    if (o.auth) { RM.needCode = true; rmRender(); return; }
    if (!o.ok && o.m) toast(o.m, 5000);
    else if (o.r === 'mark' && o.m) toast(o.m + ' posé');
    else if (o.r === 'comment' && o.ok) toast('Commentaire enregistré avec le run');
    else if (o.r === 'wifi' && o.ok) toast(o.m ? 'Wi-Fi allumé : « ' + o.m + ' »' : 'Wi-Fi coupé');
    else if ((o.r === 'opt' || o.r === 'code') && o.ok) toast(o.r === 'code' ? o.m : 'Option enregistrée');
    return;
  }
  const prev = RM.st;
  RM.st = o;
  RM.stAt = performance.now();
  if (RM.lastSeq !== null && o.q !== RM.lastSeq && o.m) toast(o.m, 5000);
  RM.lastSeq = o.q;
  if (prev && prev.s !== o.s && navigator.vibrate) navigator.vibrate(o.s === 'recording' ? [80] : o.s === 'idle' ? [60, 80, 60] : o.s === 'capture' ? [150] : 30);
  if (prev && prev.s === 'stopping' && o.s === 'idle' && RM.tab === 'ana') rmSend('files');   // nouveau run sur la carte
  if (prev && prev.s !== 'recording' && o.s === 'recording') RM.peak = [null, null];
  if (RM.askComment && o.s === 'idle') {             // run arrêté d'ici, fichier écrit
    const f = RM.askComment;
    RM.askComment = null;
    if (o.f === f) setTimeout(() => rmCommentBox(f), 400);
  }
  rmRender();
}

function rmSetConn(ok) {
  RM.conn = ok;
  if (!ok) { RM.rx = null; RM.layoutKey = ''; }
  rmRender();
}

/** Barre du haut : l'état de la liaison Bluetooth est toujours visible, à la même place. */
function rmBar() {

/** Envoie une commande, bloque les boutons 0,6 s (évite les doubles appuis avec des gants).
    confirmTxt : [titre, texte, bouton qui confirme, bouton qui annule, action destructive]. */
async function rmAct(cmd, confirmTxt) {
  if (confirmTxt && !await confirmBox(confirmTxt[0], confirmTxt[1], confirmTxt[2], !!confirmTxt[4], confirmTxt[3] || 'Annuler')) return false;
  RM.busy = true; rmRender();
  let sent = true;
  try { await rmSend(cmd); } catch (e) { sent = false; toast('Commande non envoyée : ' + e.message + '. Vérifier la liaison Bluetooth.'); }
  setTimeout(() => { RM.busy = false; rmRender(); }, 600);
  return sent;
}

/* ---------------------------------------------------------------- ressenti du pilote après un arrêt depuis le téléphone
   Facultatif. Écrit par le boîtier dans l'en-tête du run (commande « comment ») : il suit le fichier partout. */
const FEEL_TAGS = ['Confortable', 'Trop ferme', 'Trop souple', 'Talonne', 'Rebondit', 'Manque de grip', 'Fatigue des bras'];
function rmCommentBox(file) {
  const max = Math.max(40, 250 - 9 - file.length);           // une commande Bluetooth fait 255 octets au plus
  const enc = new TextEncoder(), clean = t => t.replace(/\s*[\r\n;]+\s*/g, ', ').replace(/\s+/g, ' ').trim();
  const el = document.createElement('div'), back = document.activeElement;
  el.className = 'overlay';
  el.innerHTML = `<div class="box feel" role="dialog" aria-modal="true" aria-labelledby="fbT">
    <h2 id="fbT">Ton ressenti sur ce run ?</h2>
    <p>Facultatif. Gardé avec le run « ${esc(parseRunName(file).label)} », visible dans l'analyse.</p>
    <div class="feeltags">${FEEL_TAGS.map(t => `<button type="button" class="btn sm" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
    <div class="field nona"><label for="fbTxt">Commentaire <small id="fbLeft"></small></label><textarea id="fbTxt" rows="3" placeholder="ex. avant qui plonge au freinage, arrière OK"></textarea></div>
    <button class="btn primary" data-r="1">Enregistrer</button><button class="btn" data-r="0">Passer</button></div>`;
  const ta = $('#fbTxt', el), left = $('#fbLeft', el);
  const count = () => {
    const n = enc.encode(clean(ta.value)).length;
    left.textContent = n > max ? 'trop long : ' + (n - max) + ' caractères de trop' : (max - n) + ' caractères restants';
    left.classList.toggle('crit', n > max);
    return n <= max;
  };
  const done = async ok => {
    if (ok) {
      const t = clean(ta.value);
      if (!count()) { ta.focus(); return; }
      if (t) { try { await rmSend('comment ' + file + ' ' + t); } catch (e) { toast('Commentaire non envoyé : ' + e.message, 5000); return; } }
    }
    document.removeEventListener('keydown', key, true);
    el.remove();
    if (back && back.focus) back.focus();
  };
  const key = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
  ta.oninput = count;
  $$('.feeltags button', el).forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true', w = b.textContent;
    b.setAttribute('aria-pressed', on);
    const parts = clean(ta.value).split(/\s*,\s*/).filter(x => x && x.toLowerCase() !== w.toLowerCase());
    if (on) parts.push(w.toLowerCase());
    ta.value = parts.join(', ').replace(/^./, c => c.toUpperCase());
    count();
  });
  el.addEventListener('click', e => { const b = e.target.closest('button[data-r]'); if (b) done(b.dataset.r === '1'); });
  document.addEventListener('keydown', key, true);
  document.body.appendChild(el);
  count();
}

/* ---------------------------------------------------------------- affichage commun */
const ST_NAME = { idle: 'Prêt', starting: 'Démarrage…', countdown: 'Compte à rebours', capture: 'Mesure…', recording: 'Enregistrement', stopping: 'Écriture du fichier…' };
const hm = min => min < 60 ? Math.round(min) + ' min' : Math.floor(min / 60) + ' h ' + String(Math.round(min % 60)).padStart(2, '0');
const TABS = [['run', 'Run'], ['set', 'Réglages'], ['ana', 'Analyse'], ['sens', 'Capteurs'], ['opt', 'Paramètres']];
const bikeNameNow = () => (RM.info && RM.info.bike && RM.info.bike.name) || (RM.st && RM.st.bn) || '';

/** Valeurs en direct : onglet Capteurs, et onglet Run à l'arrêt (jauges de sag). Coupées sinon (pendant le run). */
function syncLive() {
  const want = !!(RM.conn && RM.authed && (RM.tab === 'sens' || (RM.tab === 'run' && RM.st && RM.st.s === 'idle')));
  if (want === !!RM.liveOn) return;
  RM.liveOn = want;
  if (!want) RM.lvAt = 0;
  rmSend('live ' + (want ? 'on' : 'off')).catch(() => { RM.liveOn = !want; });
}

function rmRender() {
  syncLive();

        <button class="btn primary bigbtn" id="rmConnect">${ico('bt')}Se connecter</button>

    box.innerHTML = `<div class="card zone"><span class="lbl">Code d'appairage</span><strong>Ce boîtier demande un code</strong>
      <p>Demandé une seule fois sur ce téléphone.</p>

      <button class="btn primary bigbtn" id="rmCodeOk">Valider</button><button class="btn ghost" id="rmOff">Se déconnecter</button></div>`;
    $('#rmCodeOk').onclick = () => { const c = $('#rmCode').value.trim(); if (!/^[0-9]{4,8}$/.test(c)) { toast('Code refusé : saisir 4 à 8 chiffres.'); return; } store.set(codeKey(), c); RM.layoutKey = ''; rmSend('auth ' + c); };
    $('#rmOff').onclick = rmDisconnect;
    $('#rmCode').focus();
    return;
  }
  if (!RM.st) { nav.classList.add('hidden'); box.innerHTML = '<div class="card zone"><span class="lbl">Boîtier</span><strong class="pulse">Lecture de l\'état…</strong></div>'; RM.layoutKey = 'wait'; RM.shownTab = null; return; }

  // corps reconstruit seulement quand son contenu change de nature ; les valeurs sont ensuite mises à jour en place
  const s = RM.st, mini = RM.tab !== 'run', key = RM.tab + '|' + s.s + '|' + (lost ? 'L' : '') + tabKey();
  if (RM.layoutKey !== key) {
    const sameTab = RM.shownTab === RM.tab, keepScroll = sameTab ? window.scrollY : 0;   // même onglet reconstruit (réponse reçue) : ni fondu ni retour en haut
    RM.shownTab = RM.tab;
    RM.layoutKey = key;
    box.innerHTML = `
      <div class="state" id="rmBox" role="status">
        <div class="state-top"><span class="lbl">État</span><span id="rmName"></span></div>
        <div class="bigstate" id="rmState"></div>
        <div class="clock" id="rmClock">00:00</div>
        <div class="state-sub num" id="rmFile"></div>
      </div>
      <div id="rmBody" class="rmb${sameTab ? '' : ' enter'}"></div>
      <div class="muted small msg" id="rmMsg"></div>
      <button class="btn ghost" id="rmOff">Se déconnecter</button>`;
    $('#rmOff').onclick = rmDisconnect;
    ({ run: layoutRun, set: layoutSet, ana: layoutAna, sens: layoutSens, opt: layoutOpt })[RM.tab]();
    if (keepScroll) window.scrollTo(0, keepScroll);
  }
  nav.classList.remove('hidden');
  setHTML(nav, TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${RM.tab === k}" aria-label="${l}" class="${RM.tab === k ? 'on' : ''}">${ico('tab-' + k)}<span>${l}</span></button>`).join(''));

  const rec = s.s === 'recording', idle = s.s === 'idle';
  const st = lost ? ['stale', '', ST_NAME[s.s] || s.s]
    : rec ? ['rec', 'rec', s.p ? 'En pause' : 'Enregistrement']
    : idle && !s.sd ? ['crit', 'err', 'Carte SD absente']
    : idle && !s.z ? ['warn', 'warn', 'Zéro à calibrer']
    : idle ? ['ok', 'ok', 'Prêt'] : ['', '', ST_NAME[s.s] || s.s];
  $('#rmBox').className = 'state ' + st[0] + (mini ? ' mini' : '');
  setHTML($('#rmState'), (st[1] ? ico(st[1]) : '') + esc(st[2]));
  $('#rmName').textContent = bikeNameNow();
  const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');
  $('#rmFile').textContent = lost ? 'Dernier état reçu. Le boîtier continue seul.'
    : rec ? s.f.split(/[_.]/)[0] + ' · ' + plural(s.mk || 0, 'repère') + ' · ' + plural(s.d || 0, 'perte')
    : s.f ? 'Dernier run : ' + parseRunName(s.f).label : 'Aucun run enregistré';
  $('#rmMsg').textContent = s.m || '';
  ({ run: updateRun, set: () => {}, ana: updateAna, sens: updateSens, opt: () => {} })[RM.tab]();
  if (lost) $$('#rmBody button, #rmBody input, #rmBody select').forEach(e => { e.disabled = true; });   // dernières valeurs reçues, commandes désactivées
  rmTick();
}

/** Ce qui oblige à reconstruire le corps de l'onglet (réglages reçus, liste des runs, transfert…). */
function tabKey() {
  if (RM.tab === 'run') return (RM.bikeOpen ? 'b' : '') + (RM.bikes ? RM.bikes.bikes.length + RM.bikes.cur : '') + '|' + bikeNameNow() + '|' + (RM.cfg === undefined ? 'w' : RM.cfg ? JSON.stringify(rmSesNow()) : 'n') + (RM.saving ? 's' : '') + (RM.st && RM.st.s === 'idle' ? 'i' : '');
  if (RM.tab === 'set') return (RM.cfg === undefined ? 'w' : 'c') + RM.infoV + (RM.reco ? RM.reco.name : '') + (RM.saving ? 's' : '');
  if (RM.tab === 'ana') return (RM.files ? RM.files.length : 'n') + (RM.xfer ? 'x' : '') + (RM.anal ? RM.anal.name : '') + (RM.anaErr || '');
  if (RM.tab === 'sens') return RM.infoV;
  return RM.infoV;
}

function rmSetTab(t) {
  const was = RM.tab;
  if (was === 'set' && RM.dirty && t !== 'set') toast('Réglages modifiés, non enregistrés. Revenir sur Réglages pour les enregistrer.', 5000);
  RM.tab = t;
  store.set('rmTab2', t);
  if ((t === 'set' || t === 'run') && !RM.dirty) rmSend('cfg').catch(() => {});
  if (t === 'ana' && !RM.files) rmSend('files').catch(() => {});
  if (t === 'run' || t === 'sens' || t === 'opt') rmSend('info').catch(() => {});
  rmRender();
  window.scrollTo(0, 0);
}

/** Champ de mesure : libellé, état (forme + teinte), valeur, unité, précision. */
function rmTile(l, cls, v, u, sub) {
  return `<div class="tile ${cls}"><div class="l">${l}</div><div class="v${/^[0-9]/.test(v) ? '' : ' txt'}">${cls ? ico(SEV_ICO[cls]) : ''}<span>${esc(v)}</span>${u ? `<span class="u">${u}</span>` : ''}</div><div class="s">${esc(sub)}</div></div>`;
}

  const sd = !s.sd ? ['crit', 'Absente', '', 'insérer la carte'] : s.sdf < 0 ? ['ok', 'Présente', '', 'espace libre inconnu']
    : [s.sdh >= 0 && s.sdh < 0.5 ? 'crit' : s.sdh >= 0 && s.sdh < 2 ? 'warn' : 'ok', s.sdf >= 1024 ? fmt(s.sdf / 1024, 1) : String(s.sdf), s.sdf >= 1024 ? 'Go' : 'Mo', 'libres' + (s.sdh >= 0 ? ' · ≈ ' + hm(s.sdh * 60) + ' de run' : '')];

  rmGauges();
  if (rec || s.np || s.d) h += rmTile('Pauses', s.p ? 'warn' : '', String(s.np || 0), '', s.p ? 'en pause, vélo arrêté' : 'automatiques') + rmTile('Pertes', s.d ? 'warn' : 'ok', String(s.d || 0), '', 'échantillons');
  setHTML($('#rmTiles'), h);
}

/* ---------------------------------------------------------------- onglet Réglages des suspensions */
const CLICK_KEYS = [['lsc', 'LSC', 'compression basse vitesse'], ['hsc', 'HSC', 'compression haute vitesse'], ['lsr', 'LSR', 'détente basse vitesse'], ['hsr', 'HSR', 'détente haute vitesse']];
const PATH_TUNE = { 'fork.pressure': [0, 'spring'], 'fork.pressure_plus': [0, 'spring'], 'fork.tokens': [0, 'prog'], 'fork.pressure_plusplus': [0, 'prog'],
  'shock.pressure': [1, 'spring'], 'shock.spring_rate': [1, 'spring'], 'shock.hbc': [1, 'prog'] };
CLICK_KEYS.forEach(([k]) => { PATH_TUNE['fork.' + k] = [0, k]; PATH_TUNE['shock.' + k] = [1, k]; });

const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
function setPath(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => { a = a[k] = a[k] || {}; }); a[ks[ks.length - 1]] = v; }

function draft() {
  if (!RM.draft) {
    RM.draft = JSON.parse(JSON.stringify(RM.cfg || { v: 1, rider: '', bike: '', note: '', pressure_unit: 'psi', spring_unit: 'lb/in', fork: { chamber: 'single' }, shock: { type: 'air' } }));
    RM.draft.fork = RM.draft.fork || {}; RM.draft.shock = RM.draft.shock || { type: 'air' };
  }
  return RM.draft;
}

/** Recommandation du dernier run analysé pour ce réglage : { act, tone, sub } ou null. */
function recoHint(c, key) {
  const R = RM.reco, bn = bikeNameNow();
  if (!R || (R.bike && bn && R.bike !== bn)) return null;          // run d'un autre vélo : pas de conseil réglage par réglage
  const h = adviceHint(R.advice, R.cfg, c, key);                    // un seul conseil (avec ampleur) et un « à surveiller »
  if (!h) return null;
  return Object.assign(h, { sub: h.sub + ' · au run : ' + (tuneMeta(R.cfg, c, key).cur || '—') });
}

function stepRow(path, label, sub, step, o = {}) {

    <div class="slab"><b>${o.tag || label}</b>${sub ? `<span class="muted small">${sub}</span>` : ''}${h ? `<span class="shint ${h.tone}">${ico(h.dir > 0 ? 'more' : h.dir < 0 ? 'less' : 'ok')}${esc(h.act)} <span class="muted">${esc(h.sub)}</span></span>` : ''}</div>

    </div></div>`;
}

/** Enregistre les réglages dans le boîtier (même règle de révision que la page), en base64 par morceaux. */
async function saveCfg() {
  const d = draft(), cfg = JSON.parse(JSON.stringify(d));
  if (cfg.fork.chamber === 'ext') {
    if (cfg.fork.pressure_plus != null && cfg.fork.pressure_plusplus != null && cfg.fork.pressure_plusplus <= cfg.fork.pressure_plus) { toast('Fourche : la chambre ++ doit être à une pression plus haute que la +', 5000); return; }
    cfg.fork.tokens = null; cfg.fork.pressure = null;
  } else { cfg.fork.pressure_plus = null; cfg.fork.pressure_plusplus = null; }
  if (cfg.shock.type === 'coil') delete cfg.shock.pressure; else delete cfg.shock.spring_rate;
  const bn = bikeNameNow();
  if (bn) cfg.bike = bn;
  const strip = c => JSON.stringify(Object.assign({}, c, { rev: 0, saved: '' }));
  const changed = !RM.cfg || strip(RM.cfg) !== strip(cfg);
  cfg.rev = ((RM.cfg && RM.cfg.rev) || 0) + (changed ? 1 : 0) || 1;
  const t = new Date(), pad = n => String(n).padStart(2, '0');
  cfg.saved = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()) + 'T' + pad(t.getHours()) + ':' + pad(t.getMinutes());
  await rmWriteCfg(cfg, true);
}

/** Envoie des réglages complets au boîtier (par morceaux base64) ; asDraft : ils deviennent le brouillon affiché. */
async function rmWriteCfg(cfg, asDraft) {
  const json = JSON.stringify(cfg), u8 = rmEnc.encode(json);
  if (u8.length > 1800) { toast('Réglages trop volumineux pour le boîtier (' + u8.length + ' octets sur 1 800) : raccourcir la note ou le nom de série.', 6000); return false; }
  let bin = '';
  u8.forEach(b => { bin += String.fromCharCode(b); });
  const b64 = btoa(bin);
  RM.saving = true; RM.layoutKey = ''; rmRender();
  try {
    for (let i = 0, k = 0; i < b64.length; i += 160, k++) await rmSend('cfgw ' + k + ' ' + b64.slice(i, i + 160));
    await rmSend('cfgend');
    if (asDraft) RM.draft = cfg;                         // la réponse « cfg » confirme puis relit les réglages
    return true;
  } catch (e) { RM.saving = false; toast('Envoi impossible : ' + e.message, 5000); rmRender(); return false; }
}

/* ---------------------------------------------------------------- onglet Analyse : transfert puis diagnostic */
const RCache = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('susplogger-remote', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('runs');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('runs').objectStore('runs').get(k); q.onsuccess = () => res(q.result ? q.result.buf : null); q.onerror = () => res(null); }); } catch (e) { return null; }
  },
  async keys() {
    try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('runs').objectStore('runs').getAllKeys(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); } catch (e) { return []; }
  },
  async put(k, buf) {
    try {
      const db = await this.open();
      await new Promise(res => { const tx = db.transaction('runs', 'readwrite'); tx.objectStore('runs').put({ buf, at: Date.now() }, k); tx.oncomplete = res; tx.onerror = res; });
      const all = await new Promise(res => { const q = db.transaction('runs').objectStore('runs').openCursor(); const out = []; q.onsuccess = () => { const c = q.result; if (c) { out.push([c.key, c.value.at]); c.continue(); } else res(out); }; q.onerror = () => res(out); });
      all.sort((a, b) => b[1] - a[1]).slice(6).forEach(([key]) => db.transaction('runs', 'readwrite').objectStore('runs').delete(key));   // 6 runs gardés
    } catch (e) { /* stockage indisponible : pas de cache */ }
  },
};
const cacheKey = n => ((RM.hello && RM.hello.n) || 'boitier') + '/' + n;

function layoutAna() {
  const body = $('#rmBody'), X = RM.xfer, A = RM.anal;
  if (X) {
    body.innerHTML = `<div class="card zone"><span class="lbl">Transfert Bluetooth</span><strong>${esc(parseRunName(X.name).label)}</strong>
      <div class="progress"><i id="xBar"></i></div>
      <div class="small num" id="xTxt">Démarrage…</div>
      <p>Garder le téléphone près du boîtier.</p>
      <button class="btn" id="xAbort">Annuler</button></div>`;
    $('#xAbort').onclick = () => { rmSend('abort'); RM.xfer = null; RM.layoutKey = ''; rmRender(); };
    updateAna();
    return;
  }
  if (A) { renderAnalysis(body, A); return; }
  if (!RM.files) { body.innerHTML = '<p class="muted pulse">Lecture de la carte SD…</p>'; return; }
  body.innerHTML = `
    ${RM.anaErr ? banner('crit', 'Analyse impossible', esc(RM.anaErr)) : ''}
    ${RM.files.length ? `<div class="rows" id="runList">${RM.files.map((f, k) => `<div class="rw"><span class="grow"><b>${esc(parseRunName(f.n).label)}</b><span class="small muted num">${fmtBytes(f.s)}<span data-cached="${esc(f.n)}"></span></span></span>
      <button class="btn ${k ? '' : 'primary'}" data-run="${esc(f.n)}">Analyser</button></div>`).join('')}</div>`
      : '<div class="card zone"><span class="lbl">Carte SD</span><strong>Aucun run</strong><p>Les runs enregistrés apparaissent ici.</p></div>'}
    <button class="btn ghost" id="anaReload">Actualiser</button>`;
  $('#anaReload').onclick = () => { RM.files = null; RM.anaErr = ''; RM.layoutKey = ''; rmSend('files'); rmRender(); };
  $$('#runList [data-run]').forEach(b => b.onclick = () => openRunBle(b.dataset.run, RM.files.find(f => f.n === b.dataset.run).s));
  RCache.keys().then(keys => $$('#runList [data-cached]').forEach(e => { if (keys.includes(cacheKey(e.dataset.cached))) e.textContent = ' · sur ce téléphone'; }));
}

async function openRunBle(name, size) {
  RM.anaErr = '';
  const cached = await RCache.get(cacheKey(name));
  if (cached && cached.byteLength === size) { analyseBuffer(name, cached); return; }
  if (!RM.hasData && !RM.demo) { RM.anaErr = 'Ce firmware n\'envoie pas les runs en Bluetooth. Mettre le boîtier à jour (10.1 ou plus).'; RM.layoutKey = ''; rmRender(); return; }
  RM.xfer = { name, size, buf: null, exp: 0, lastAck: 0, t0: performance.now(), lastData: performance.now() };
  RM.layoutKey = ''; rmRender();
  rmSend('get ' + name + ' 0').catch(e => xferFail(e.message));
}

function xferBegin(o) {
  const X = RM.xfer;
  if (!X || o.n !== X.name) return;
  X.size = o.size; X.buf = new Uint8Array(o.size); X.exp = o.off; X.lastAck = o.off; X.t0 = performance.now(); X.lastData = X.t0;
  RM.layoutKey = ''; rmRender();
}

/** Paquet de données : adresse uint32 + octets. Seul le paquet attendu est gardé (le boîtier renvoie en cas de perte). */
function rmOnData(dv) {
  const X = RM.xfer;
  if (!X || !X.buf || dv.byteLength < 5) return;
  const off = dv.getUint32(0, true), n = dv.byteLength - 4;
  if (off !== X.exp || off + n > X.size) return;
  X.buf.set(new Uint8Array(dv.buffer, dv.byteOffset + 4, n), off);
  X.exp += n;
  X.lastData = performance.now();
  if (X.exp - X.lastAck >= 4096 || X.exp >= X.size) { X.lastAck = X.exp; rmSend('ack ' + X.exp).catch(() => {}); }
  if (!X.uiAt || X.lastData - X.uiAt > 250) { X.uiAt = X.lastData; updateAna(); }
}

function updateAna() {
  const X = RM.xfer, bar = $('#xBar');
  if (!X || !bar) return;
  const pct = X.size ? X.exp / X.size * 100 : 0, sec = (performance.now() - X.t0) / 1000, rate = sec > 0.5 ? (X.exp - (X.start0 || 0)) / sec : 0;
  bar.style.width = pct.toFixed(1) + '%';
  $('#xTxt').textContent = X.buf ? fmt(pct, 0) + ' % · ' + fmtBytes(X.exp) + ' / ' + fmtBytes(X.size) + (rate > 0 ? ' · ' + fmt(rate / 1024, 0) + ' Ko/s · reste ≈ ' + fmtDur((X.size - X.exp) / rate) : '') : 'Préparation du transfert…';
}

setInterval(() => {                                    // relance : sans données depuis 2 s, on réacquitte (le boîtier renvoie)
  const X = RM.xfer;
  if (X && X.buf && !RM.demo && performance.now() - X.lastData > 2000 && X.exp < X.size) { X.lastData = performance.now(); rmSend('ack ' + X.exp).catch(() => {}); }
}, 1000);

async function xferDone() {
  const X = RM.xfer;
  if (!X || !X.buf) return;
  if (X.exp < X.size) { rmSend('ack ' + X.exp); return; }
  RM.xfer = null;
  const ab = X.buf.buffer;
  RCache.put(cacheKey(X.name), ab);
  if (navigator.vibrate) navigator.vibrate(60);
  analyseBuffer(X.name, ab);
}

function xferFail(m) {
  RM.xfer = null;
  RM.anaErr = 'Transfert interrompu : ' + m + '. Rapprocher le téléphone du boîtier, puis relancer.';
  RM.layoutKey = ''; rmRender();
}

/** Résumé d'un run précédent pour la mise au point, s'il est déjà sur ce téléphone (cache des 6 derniers runs). */
async function remoteSummaryLoader(run) {
  const f = (RM.files || []).find(x => parseRunName(x.n).run === run);
  if (!f) return null;
  const buf = await RCache.get(cacheKey(f.n));
  if (!buf) return null;
  const prm = loadParams(), P = prepareRun(parseSus(buf.slice ? buf.slice(0) : buf), prm), mn = P.imu && P.imu.seg.main;
  let M = computeAll(P, prm);
  if (mn && mn.t1 - mn.t0 < 0.95 * P.duration) M = computeAll(P, prm, Math.round(mn.t0 / P.dt), Math.min(P.N, Math.round(mn.t1 / P.dt)));
  return runSummary(P, M, f.n);
}

/** Analyse complète du run (comme la page) : descente détectée par la centrale, diagnostic et indicateurs. */
function analyseBuffer(name, ab) {
  RM.layoutKey = '';
  $('#rmBody').innerHTML = '<p class="muted pulse">Analyse du run…</p>';
  setTimeout(() => {
    try {
      const run = parseSus(ab.slice ? ab.slice(0) : ab), prm = loadParams();
      const P = prepareRun(run, prm), M0 = computeAll(P, prm), main = P.imu && P.imu.seg.main;
      let M = M0, span = null;
      if (main && main.t1 - main.t0 < 0.95 * P.duration) { M = computeAll(P, prm, Math.round(main.t0 / P.dt), Math.min(P.N, Math.round(main.t1 / P.dt))); span = [main.t0, main.t1]; }
      const bike = (run.hdr.bike && run.hdr.bike.name) || (P.cfg && P.cfg.bike) || '';
      RM.anal = { name, P, M, span, bike };
      RM.reco = { name, advice: runAdvice(M), cfg: P.cfg || {}, bike };
      RM.anaErr = '';
      // mise au point : runs précédents de la série déjà sur ce téléphone (pas de transfert Bluetooth automatique)
      attachSession(P, M, name, remoteSummaryLoader).then(ok => {
        if (ok && RM.anal && RM.anal.M === M) { RM.reco.advice = runAdvice(M); RM.layoutKey = ''; rmRender(); }
      }).catch(() => {});
    } catch (e) { RM.anal = null; RM.anaErr = 'Fichier illisible : ' + e.message + '.'; }
    RM.layoutKey = ''; rmRender();
  }, 30);
}

function liveText(b) {
  const l = RM.lv, i = RM.info;

  const k = l.bk[b - 2];

}
function auxText() {
  const l = RM.lv, c = auxCfg();

}

/** Jauges de sag en direct (onglet Run, à l'arrêt) : comme la page du boîtier — zone du sag visé, maximum, mm et %. */
const SAG_LIVE_RM = [[15, 25], [25, 35]];
function rmGauges() {
  const box = $('#rmGauges'), i = RM.info, s = RM.st;
  if (!box) return;
  const used = i ? [0, 1].filter(c => i.chm & (1 << c)) : [];
  const show = !!(s && s.s === 'idle' && used.length && !(!RM.conn && RM.want));
  box.classList.toggle('hidden', !show);
  if (!show) return;
  const K = ['f', 's'], N = ['Fourche', 'Amortisseur'];
  if (box.dataset.k !== used.join('')) {
    box.dataset.k = used.join('');
    RM.peak = RM.peak || [null, null];
    box.innerHTML = `<div class="card-head ghead"><h2>En direct</h2><div class="gtools"><button type="button" class="btn sm ghost" id="rmPeakReset">${ico('reset')}Max à zéro</button></div></div>
      <div class="glg"><span><i class="lg-zone"></i>sag visé</span><span><i class="lg-pic"></i>maximum depuis la remise à zéro</span></div>` +
      used.map(c => `<div class="gauge" id="rg_${K[c]}"><div class="top"><span class="lbl"><span class="sw ${K[c]}"></span>${N[c]}</span><span class="val num" id="rg_${K[c]}_v">—</span></div>
        <div class="track"><i class="zone" id="rg_${K[c]}_z"></i><i class="${K[c]}" id="rg_${K[c]}_b" style="width:0"></i><i class="pic" id="rg_${K[c]}_p" hidden></i></div></div>`).join('');
    $('#rmPeakReset').onclick = () => { RM.peak = [null, null]; rmGauges(); toast('Maximum remis à zéro'); };
  }
  const l = RM.lv;
  used.forEach(c => {
    const k = K[c], T = i.travel && i.travel[c] > 0 ? i.travel[c] : (i.pot ? i.pot[c] * 0.85 : 100), ok = !!(i.zm & (1 << c)) && !!(l && l.mm);
    const t = sagTarget(RM.cfg || {}, c), z = t ? t.range : SAG_LIVE_RM[c];
    const ze = $('#rg_' + k + '_z');
    ze.style.left = z[0] + '%'; ze.style.width = (z[1] - z[0]) + '%'; ze.title = 'Sag visé ' + z[0] + '–' + z[1] + ' %';
    if (!ok) {
      setHTML($('#rg_' + k + '_v'), `<small>${i.zm & (1 << c) ? 'en attente' : 'zéro absent'}</small>`);
      $('#rg_' + k + '_b').style.width = '0';
      $('#rg_' + k + '_p').hidden = true;
      $('#rg_' + k).classList.remove('inzone');
      return;
    }
    const mm = l.mm[c], raw = mm / T * 100, pct = clamp(raw, 0, 100), inz = raw >= z[0] && raw <= z[1];
    RM.peak[c] = RM.peak[c] == null || pct > RM.peak[c] ? pct : RM.peak[c];
    setHTML($('#rg_' + k + '_v'), `<b>${fmt(mm, 1)}</b><small>mm</small><em>${inz ? ico('ok') : ''}${fmt(raw, 0)} %</em><small class="gmax">max ${fmt(RM.peak[c], 0)} %</small>`);
    $('#rg_' + k).classList.toggle('inzone', inz);
    $('#rg_' + k + '_b').style.width = pct + '%';
    const pe = $('#rg_' + k + '_p');
    pe.hidden = false; pe.style.left = RM.peak[c] + '%';
  });
}

  if (d.files) return d.files;
  d.files = new Map();

  for (const n of Object.keys(src).sort().reverse()) {

    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
