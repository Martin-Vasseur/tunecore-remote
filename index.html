<style>
/* =====================================================================
   TuneCore - feuille de style « Relief » (phase 3)
   Carte topo et instrument de pilote. Deux thèmes (jour / nuit).
   - Fond : courbes de niveau animées (js/fond.js) sur un dégradé glacier.
   - Panneaux en verre à coins coupés (haut-droit, bas-gauche), repères de
     visée orange aux deux autres coins.
   - La couleur code une information : outremer = avant (fourche, frein
     avant), orange = arrière (amortisseur, frein arrière) ; vert / ambre /
     rouge = bon / attention / erreur, toujours avec une forme (coche,
     triangle, octogone). L'orange signal sert aussi à l'action principale.
   - Libellés en capitales espacées, chiffres tabulaires, chiffres clés
     soulignés au surligneur.
   Deux mises en page : body[data-mode="phone"] et body[data-mode="pc"].
   ===================================================================== */
:root {
  color-scheme: light;
  --plane: #e3eaed;
  --plane-img: radial-gradient(130% 60% at 85% -10%, #fbfcfb 0%, rgba(251, 252, 251, 0) 60%), linear-gradient(180deg, #edf2f3 0%, #dbe4e8 100%);
  --surface: #ffffff;  --surface2: #edf2f4;  --glass: rgba(255, 255, 255, .86);  --glass-bar: rgba(255, 255, 255, .8);
  --ink: #0b1c2c;   --ink2: #394d5f;     --muted: #5b6f81;   --off: #8a9cab;
  --grid: #c6d1d9;  --axis: #8a9cab;     --border: var(--grid);  --line: #b2c0c9;
  --s1: #2f3cff;    /* avant : fourche, frein avant */
  --s2: #ff5a14;    /* arrière : amortisseur, frein arrière */
  --s1-ink: #2f3cff; --s2-ink: #d4430a;   /* mêmes couleurs, lisibles en texte */
  --s3: #394d5f;    /* vélo entier : vitesse, AUX, nuage de points */
  --s4: #2f3cff;    --s5: #ff5a14;
  --good: #00845a;  --good-fill: #00a56d;  --on-good: #ffffff;  --good-t: #e2f3eb;
  --warn: #ffae00;  --warn-ink: var(--ink);  --on-warn: #1f1400;  --warn-t: #ffedc2;  --warn-mark: #f08c00;  --heat-l: 47%;
  --crit: #d81f36;  --crit-fill: #e5243b;  --on-crit: #ffffff;  --crit-t: #fde6e8;
  --s1-t: #e6e8ff;  --s2-t: #ffeadf;
  --accent: #ff5a14;  --accent-ink: #d4430a;  --on-accent: #ffffff;
  --rec: #ff3b1f;
  --comp: #0b84e3;  --comp-ink: #006bc2;  --reb: #e5222e;  --reb-ink: #c81b26;   /* molettes : compression bleu, détente rouge */
  --good-ink: var(--good);  --serious: var(--crit);  --seg-descent: var(--accent);
  --inv-bg: var(--ink);  --inv-ink: var(--surface);
  --hud: var(--accent);
  --halo: rgba(255, 110, 40, .10);  --scan: rgba(255, 90, 20, .5);
  --cv-1: rgba(11, 28, 44, .10);  --cv-2: rgba(11, 28, 44, .19);  --cv-3: rgba(255, 90, 20, .5);
  --heat0: hsl(52, 90%, 58%);  --heat1: hsl(20, 88%, 48%);  --heat2: hsl(348, 80%, 34%);   /* carte : lent -> rapide */
  /* polices de l'appareil : Bahnschrift (Windows), DIN Alternate (Apple), Roboto Condensed (Android) */
  --font: Bahnschrift, "DIN Alternate", "Roboto Condensed", sans-serif-condensed, "Segoe UI", system-ui, sans-serif;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  --t-xs: .75rem; --t-s: .875rem; --t-m: .9375rem; --t-l: 1.25rem; --t-xl: 1.75rem; --t-2xl: 2.5rem;
  --r: 0;  --hit: 44px;  --fast: .14s;  --c: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0c1724;
    --plane-img: radial-gradient(120% 60% at 85% -10%, #182b44 0%, rgba(24, 43, 68, 0) 60%), linear-gradient(180deg, #11203a 0%, #0a1420 100%);
    --surface: #13233a;  --surface2: #1a2d47;  --glass: rgba(17, 32, 52, .88);  --glass-bar: rgba(12, 23, 38, .84);
    --ink: #e9f1f7;   --ink2: #b3c4d3;     --muted: #8599ac;   --off: #5f7489;
    --grid: #263d58;  --axis: #5f7489;     --line: #2e4866;
    --s1: #8b95ff;    --s2: #ff7a3d;    --s1-ink: #9aa3ff;  --s2-ink: #ff8f5a;  --s3: #b3c4d3;    --s4: #8b95ff;    --s5: #ff7a3d;
    --good: #35d69a;  --good-fill: #35d69a;  --on-good: #04170f;  --good-t: #0f2a22;
    --warn: #ffbe3b;  --warn-ink: #ffc24f;   --on-warn: #1f1400;  --warn-t: #2b2412;  --warn-mark: #ffbe3b;  --heat-l: 60%;
    --crit: #ff6b6b;  --crit-fill: #ff6b6b;  --on-crit: #22060a;  --crit-t: #33171c;
    --s1-t: #1a2050;  --s2-t: #36200f;
    --accent: #ff7a3d;  --accent-ink: #ff8f5a;  --on-accent: #1a0900;
    --rec: #ff5a3d;
    --comp: #4cb2ff;  --comp-ink: #74c4ff;  --reb: #ff5c5c;  --reb-ink: #ff8080;
    --halo: rgba(255, 122, 61, .08);  --scan: rgba(255, 122, 61, .45);
    --cv-1: rgba(150, 190, 230, .09);  --cv-2: rgba(150, 190, 230, .17);  --cv-3: rgba(255, 122, 61, .32);
    --heat0: hsl(52, 92%, 68%);  --heat1: hsl(20, 92%, 60%);  --heat2: hsl(348, 88%, 54%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0c1724;
  --plane-img: radial-gradient(120% 60% at 85% -10%, #182b44 0%, rgba(24, 43, 68, 0) 60%), linear-gradient(180deg, #11203a 0%, #0a1420 100%);
  --surface: #13233a;  --surface2: #1a2d47;  --glass: rgba(17, 32, 52, .88);  --glass-bar: rgba(12, 23, 38, .84);
  --ink: #e9f1f7;   --ink2: #b3c4d3;     --muted: #8599ac;   --off: #5f7489;
  --grid: #263d58;  --axis: #5f7489;     --line: #2e4866;
  --s1: #8b95ff;    --s2: #ff7a3d;    --s1-ink: #9aa3ff;  --s2-ink: #ff8f5a;  --s3: #b3c4d3;    --s4: #8b95ff;    --s5: #ff7a3d;
  --good: #35d69a;  --good-fill: #35d69a;  --on-good: #04170f;  --good-t: #0f2a22;
  --warn: #ffbe3b;  --warn-ink: #ffc24f;   --on-warn: #1f1400;  --warn-t: #2b2412;  --warn-mark: #ffbe3b;  --heat-l: 60%;
  --crit: #ff6b6b;  --crit-fill: #ff6b6b;  --on-crit: #22060a;  --crit-t: #33171c;
  --s1-t: #1a2050;  --s2-t: #36200f;
  --accent: #ff7a3d;  --accent-ink: #ff8f5a;  --on-accent: #1a0900;
  --rec: #ff5a3d;
  --comp: #4cb2ff;  --comp-ink: #74c4ff;  --reb: #ff5c5c;  --reb-ink: #ff8080;
  --halo: rgba(255, 122, 61, .08);  --scan: rgba(255, 122, 61, .45);
  --cv-1: rgba(150, 190, 230, .09);  --cv-2: rgba(150, 190, 230, .17);  --cv-3: rgba(255, 122, 61, .32);
  --heat0: hsl(52, 92%, 68%);  --heat1: hsl(20, 92%, 60%);  --heat2: hsl(348, 88%, 54%);
}

/* ------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--plane-img); background-color: var(--plane); background-attachment: fixed; min-height: 100%; }
body { margin: 0; background: transparent; color: var(--ink); font: 400 var(--t-m)/1.4 var(--font); }
/* fond : courbes de niveau (canvas posé par js/fond.js), halo qui suit la souris, ligne de balayage */
#fond { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: -1; pointer-events: none; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(340px circle at var(--mx, -400px) var(--my, -400px), var(--halo), transparent 70%); }
body::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: -1; pointer-events: none; background: linear-gradient(90deg, transparent, var(--scan), transparent); animation: balayage 11s linear infinite; }
h1, h2, h3 { margin: 0; font-family: var(--font); }
h2 { font-size: var(--t-xs); line-height: 1.3; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
h2.title { font-size: var(--t-xl); line-height: 1.15; letter-spacing: .02em; text-transform: none; }
h3 { font-size: var(--t-s); font-weight: 600; letter-spacing: .02em; }
p { margin: 0 0 8px; }
a { color: inherit; text-underline-offset: 2px; }
code { font-family: var(--mono); font-size: .9em; }
.muted { color: var(--muted); }
.small { font-size: var(--t-s); }
.num, .stat .v, .timer, .clock, .gauge .val, .kv dd, .tbl, .tsub, .tile .v, .meta dd { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button, input, select, textarea { font: inherit; color: inherit; }
input[type=text], input[type=number], input[type=search], textarea, select { background-color: var(--surface); color: var(--ink); }
select option, select optgroup { background-color: var(--surface); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lbl { font-size: var(--t-xs); line-height: 1.2; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
.u, .stat .v small, .gauge .val small { color: var(--muted); font-weight: 400; font-size: .6em; margin-left: .15em; white-space: nowrap; }
/* textes longs : police de lecture */
.tinfo, .ob p, .zone p, .banner, .overlay .box p, .list, #tab-manuals p, #tab-manuals li { font-family: var(--font-text); }

/* icônes : un seul jeu (index.html / remote.html), trait de 2, extrémités carrées */
.ico { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; vertical-align: -.25em; }
.good, .ok > .ico, .ico.ok { color: var(--good); }
.ico.warn, .warn > .ico { color: var(--warn-ink); }
.ico.crit, .crit > .ico { color: var(--crit); }

/* ------------------------------------------------------------ panneaux à coins coupés
   Le filet droit est une ombre intérieure (une bordure serait coupée en biais), les deux filets
   diagonaux sont dessinés par ::before (haut-droit) et ::after (bas-gauche). --c1 / --c2 : taille des coupes. */
.card, .state, .verdict, .todo, .ttable, .obs, .runlist, .rows, .chanlist, .metrics, .tile, .banner, .overlay .box, .btn, .chip.rec, .seg, .na {
  --c1: var(--c); --c2: var(--c); --edge: var(--line);
  position: relative;
  clip-path: polygon(0 0, calc(100% - var(--c1)) 0, 100% var(--c1), 100% 100%, var(--c2) 100%, 0 calc(100% - var(--c2)));
}
.card::before, .state::before, .verdict::before, .todo::before, .ttable::before, .obs::before, .runlist::before, .rows::before, .chanlist::before, .metrics::before, .tile::before, .banner::before, .overlay .box::before, .btn::before, .seg::before, .na::before,
.card::after, .state::after, .verdict::after, .todo::after, .ttable::after, .obs::after, .runlist::after, .rows::after, .chanlist::after, .metrics::after, .tile::after, .banner::after, .overlay .box::after, .btn::after, .seg::after, .na::after {
  content: ""; position: absolute; z-index: 3; pointer-events: none;
}
.card::before, .state::before, .verdict::before, .todo::before, .ttable::before, .obs::before, .runlist::before, .rows::before, .chanlist::before, .metrics::before, .tile::before, .banner::before, .overlay .box::before, .btn::before, .seg::before, .na::before {
  top: 0; right: 0; width: var(--c1); height: var(--c1);
  background: linear-gradient(to bottom left, transparent calc(50% - 1px), var(--edge) calc(50% - 1px), var(--edge) calc(50% + 1px), transparent calc(50% + 1px));
}
.card::after, .state::after, .verdict::after, .todo::after, .ttable::after, .obs::after, .runlist::after, .rows::after, .chanlist::after, .metrics::after, .tile::after, .banner::after, .overlay .box::after, .btn::after, .seg::after, .na::after {
  bottom: 0; left: 0; width: var(--c2); height: var(--c2);
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--edge) calc(50% - 1px), var(--edge) calc(50% + 1px), transparent calc(50% + 1px));
}
/* repères de visée aux deux coins non coupés */
.card, .state, .tile {
  background-color: var(--glass);
  background-image: linear-gradient(var(--hud), var(--hud)), linear-gradient(var(--hud), var(--hud)), linear-gradient(var(--hud), var(--hud)), linear-gradient(var(--hud), var(--hud));
  background-size: 14px 2px, 2px 14px, 14px 2px, 2px 14px;
  background-position: 0 0, 0 0, 100% 100%, 100% 100%;
  background-repeat: no-repeat;
  box-shadow: inset 0 0 0 1px var(--edge);
}
.card .card { --hud: transparent; background-color: transparent; }
@media (hover: hover) { .card:hover, .tile:hover { --edge: var(--axis); } }

/* ------------------------------------------------------------ squelette */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 48px; padding: 6px 16px; padding-top: max(6px, env(safe-area-inset-top));
  background: var(--glass-bar); -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2);
  border-bottom: 1px solid var(--line); font-size: var(--t-s);
  transition: background-color var(--fast), color var(--fast);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; flex: 0 1 auto; }
.brand .logo { width: 24px; height: 24px; flex: none; color: var(--accent); }
.brand b { font-weight: 700; font-size: .8125rem; letter-spacing: .26em; color: var(--ink); }
.brand span { font-weight: 400; font-size: inherit; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.brand.link #connName { color: var(--ink); font-weight: 600; }
.topstate { display: flex; align-items: center; gap: 14px; white-space: nowrap; flex: none; }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.link.on { color: var(--ink); }
.link.off { color: var(--crit); font-weight: 600; }
.topbar.lost { background: var(--crit-fill); color: var(--on-crit); border-bottom-color: var(--crit-fill); }
.topbar.lost .link, .topbar.lost .muted, .topbar.lost .brand span, .topbar.lost .brand b, .topbar.lost .brand .logo, .topbar.lost .brand.link #connName { color: inherit; }
.dot { width: 8px; height: 8px; background: var(--off); display: inline-block; }
.dot.on { background: var(--good-fill); border-radius: 50%; box-shadow: 0 0 0 0 var(--good-fill); animation: ping 2.4s ease-out infinite; }
.dot.off { background: var(--crit); }

/* onglets : icône + mot ; sur téléphone, le mot n'apparaît que sur l'onglet actif */
.nav { display: flex; background: var(--glass-bar); -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2); }
.nav button, .rmtabs button {
  position: relative; flex: 1 1 0; min-width: 0; min-height: 58px; border: 0; background: none; cursor: pointer; padding: 6px 2px 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 10px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); transition: color var(--fast);
}
.nav button .ico, .rmtabs button .ico { width: 24px; height: 24px; vertical-align: 0; }
.nav button span, .rmtabs button span { display: none; }
.nav button::before, .rmtabs button::before { content: ""; position: absolute; left: 32%; right: 32%; top: -1px; height: 3px; background: var(--accent); transform: scaleX(0); transition: transform var(--fast) ease-out; }
.nav button.on, .rmtabs button.on { color: var(--accent-ink); }
.nav button.on span, .rmtabs button.on span { display: block; }
.nav button.on::before, .rmtabs button.on::before { transform: none; }

main { padding: 12px 16px 24px; }
.tab { display: none; }
.tab.on { display: block; animation: monte .32s cubic-bezier(.2, .75, .25, 1); }
.stack > :not(:first-child) { margin-top: 12px; }   /* plus fort que .m0 / .mt-s : un texte ne se colle jamais au bloc précédent */

/* section : panneau de verre à coins coupés */
.card { padding: 13px 16px 16px; }
.card > h2 + *, .card > h3 + * { margin-top: 10px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.sep { height: 1px; background: var(--grid); margin: 12px 0; border: 0; }
.m0 { margin: 0; } .mt { margin-top: 12px; } .mt-s { margin-top: 8px; }
.full { grid-column: 1 / -1; } .contents { display: contents; } .click { cursor: pointer; }
.list { margin: 6px 0 0; padding-left: 18px; }
summary { cursor: pointer; font-weight: 600; font-size: var(--t-s); padding: 6px 0; }
#anMain > * { min-width: 0; }
body[data-mode="pc"] #anMain { display: flex; flex-direction: column; }
body[data-mode="pc"] #anMain > .anhead { order: -2; }

/* téléphone : onglets en bas */
body[data-mode="phone"] .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
body[data-mode="phone"] main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
body[data-mode="phone"] .only-pc { display: none !important; }

/* ordinateur : rail latéral numéroté (01 Run…), colonnes multiples */
body[data-mode="pc"] { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
body[data-mode="pc"] .topbar { grid-column: 1 / -1; }
body[data-mode="pc"] .nav { flex-direction: column; align-self: start; position: sticky; top: 49px; padding: 14px 0; border-right: 1px solid var(--line); height: calc(100vh - 49px); counter-reset: onglet; }
body[data-mode="pc"] .nav button { flex: none; min-height: 44px; flex-direction: row; justify-content: flex-start; gap: 10px; padding: 0 18px; font-size: 13px; font-weight: 500; letter-spacing: .11em; color: var(--ink2); transition: color var(--fast), padding-left .2s, background-color .2s; }
body[data-mode="pc"] .nav button .ico { width: 18px; height: 18px; }
body[data-mode="pc"] .nav button span { display: block; }
body[data-mode="pc"] .nav button::after { counter-increment: onglet; content: "0" counter(onglet); margin-left: auto; font: 11px var(--mono); letter-spacing: 0; color: var(--muted); }
body[data-mode="pc"] .nav button::before { display: none; }
body[data-mode="pc"] .nav button:hover { padding-left: 23px; color: var(--ink); }
body[data-mode="pc"] .nav button.on { background: var(--accent); color: var(--on-accent); font-weight: 700; padding-left: 18px; }
body[data-mode="pc"] .nav button.on::after { color: inherit; opacity: .75; }
body[data-mode="pc"] main { padding: 20px 24px 40px; max-width: 1400px; width: 100%; }
body[data-mode="pc"] .stack > * + * { margin-top: 16px; }
body[data-mode="pc"] .grid2 { grid-template-columns: 1fr 1fr; gap: 16px; }
body[data-mode="pc"] .only-phone { display: none !important; }
body[data-mode="pc"] .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
body[data-mode="pc"] .an-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
body[data-mode="pc"] .an-open .an-layout { grid-template-columns: minmax(0, 1fr); }
.an-open #anSide { display: none; }

/* ------------------------------------------------------------ boutons (coins coupés, capitales espacées) */
.btn {
  --c: 9px; --edge: var(--axis);
  display: inline-flex; align-items: center; justify-content: center; gap: .55em; min-height: var(--hit); padding: 0 1.1em;
  border: 0; border-radius: 0; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: inset 0 0 0 1px var(--edge);
  font-family: var(--font); font-weight: 600; font-size: var(--t-s); line-height: 1.15; letter-spacing: .09em; text-transform: uppercase; text-decoration: none; touch-action: manipulation;
  transition: background-color var(--fast), color var(--fast), box-shadow var(--fast), transform .1s;
}
.btn:hover { --edge: var(--ink); }
.btn:active { transform: translateY(1px); background: var(--ink); color: var(--surface); --edge: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); --edge: var(--ink); }
.btn.primary:hover { background: var(--ink2); --edge: var(--ink2); }
.btn.go { background: var(--accent); color: var(--on-accent); --edge: var(--accent); }
.btn.go:hover { filter: brightness(1.07); }
.btn.strong { background: var(--ink); color: var(--surface); --edge: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.btn.strong .ico { color: var(--accent); }
.btn.rec { background: var(--crit-fill); color: var(--on-crit); --edge: var(--crit-fill); }
.btn.danger { --edge: var(--crit); color: var(--crit); }
.btn.big { width: 100%; min-height: 64px; font-size: var(--t-l); letter-spacing: .12em; --c: 12px; }
.btn.sm { min-height: 36px; padding: 0 .85em; font-size: var(--t-xs); }
.btn.ghost { --edge: var(--axis); background: transparent; }   /* bouton secondaire : cadre fin, sans fond */
.btn.ghost:hover { --edge: var(--ink); }
.btn .ico { width: 1.15em; height: 1.15em; }
.btn[disabled] { background: transparent; color: var(--muted); --edge: var(--axis); box-shadow: inset 0 0 0 1px var(--edge); cursor: not-allowed; filter: none; opacity: .8; }
a.btn.primary { color: var(--surface); }
/* éclat qui traverse le bouton Démarrer quand tout est prêt */
.btn.go.big { overflow: hidden; }
.btn.go.big > .ico { position: relative; z-index: 1; }
.btn.go.big { background-image: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .38) 50%, transparent 65%); background-size: 250% 100%; background-repeat: no-repeat; animation: eclat 3.6s ease-in-out infinite; }
/* bouton d'explication : remplace le mot « Pourquoi » */
.ibtn { width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 0; background: none; color: var(--muted); cursor: pointer; vertical-align: middle; transition: color var(--fast), background-color var(--fast); }
.ibtn:hover { color: var(--accent-ink); }
.ibtn[aria-expanded="true"] { background: var(--ink); color: var(--surface); }
.ibtn .ico { width: 18px; height: 18px; }

/* ------------------------------------------------------------ repères d'état, messages */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-s); font-weight: 600; white-space: nowrap; letter-spacing: .03em; }
.chip .ic { display: inline-flex; }
.chip.ok { color: var(--good); }
.chip.warn { color: var(--warn-ink); }
.chip.crit { color: var(--crit); }
.chip.rec { --c: 6px; --edge: var(--ink); background: var(--ink); color: var(--surface); padding: 4px 11px; letter-spacing: .08em; text-transform: uppercase; font-size: var(--t-xs); }
.chip.rec .ic { color: var(--rec); animation: beat 1s ease-in-out infinite; }
.banner { --c: 8px; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge), inset 4px 0 0 var(--muted); font-size: var(--t-s); }
.banner.warn { background: var(--warn-t); box-shadow: inset 0 0 0 1px var(--warn), inset 4px 0 0 var(--warn); --edge: var(--warn); }
.banner.crit { background: var(--crit-t); box-shadow: inset 0 0 0 1px var(--crit), inset 4px 0 0 var(--crit); --edge: var(--crit); }
.banner.ok { background: var(--good-t); box-shadow: inset 0 0 0 1px var(--good-fill), inset 4px 0 0 var(--good-fill); --edge: var(--good-fill); }
.banner .bt { display: block; font-weight: 600; font-family: var(--font); letter-spacing: .02em; }
.ic { font-weight: 600; }
.batchip { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; }
.batchip svg { display: block; }
.batchip.warn svg { color: var(--warn-ink); }
.batchip.crit { color: var(--crit); }
.batchip.chg svg { color: var(--good); }

/* ------------------------------------------------------------ état et chrono (bloc dominant) */
.state { --hud: var(--accent); padding: 13px 16px 15px; transition: box-shadow .2s; }
.state.ok { --hud: var(--good-fill); box-shadow: inset 0 0 0 1px var(--edge), inset 4px 0 0 var(--good-fill); }
.state.warn { --hud: var(--warn); box-shadow: inset 0 0 0 1px var(--edge), inset 4px 0 0 var(--warn); }
.state.crit { --hud: var(--crit); box-shadow: inset 0 0 0 1px var(--edge), inset 4px 0 0 var(--crit); }
.state.rec { --hud: var(--rec); box-shadow: inset 0 0 0 1px var(--edge), inset 4px 0 0 var(--rec); }
.state-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: var(--t-s); color: var(--ink2); }
.state-top > span:last-child { letter-spacing: .04em; }
.bigstate { display: flex; align-items: center; gap: .4em; font-size: clamp(1.3rem, 6.4vw, 1.75rem); line-height: 1.15; font-weight: 600; letter-spacing: .02em; margin-top: 6px; }
.bigstate .ico { width: .8em; height: .8em; }
.state.ok .bigstate { color: var(--good); }
.state.warn .bigstate { color: var(--warn-ink); }
.state.crit .bigstate { color: var(--crit); }
.state.rec .bigstate { color: var(--rec); text-transform: uppercase; letter-spacing: .12em; font-size: clamp(1rem, 4.6vw, 1.25rem); }
.timer, .clock { font-size: clamp(4.5rem, 26vw, 7rem); line-height: .95; font-weight: 600; letter-spacing: -.02em; margin: 8px 0 6px -.04em; color: var(--off); white-space: nowrap; }
.timer small { font-size: .42em; letter-spacing: 0; color: inherit; }
.state.rec .timer, .state.rec .clock { color: var(--ink); }
.state.rec .timer small { color: var(--accent); }
.state-sub { font-size: var(--t-s); color: var(--ink2); min-height: 1.4em; overflow-wrap: anywhere; letter-spacing: .02em; }
.state.rec .lbl, .state.rec .state-top, .state.rec .state-sub { color: var(--ink2); }
.state.rec .bigstate .ico { color: var(--rec); animation: beat 1s ease-in-out infinite; }
.state.stale { --hud: var(--off); }
.state.stale .bigstate, .state.stale .clock, .state.stale .timer { color: var(--muted); }
.state.mini { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
.state.mini .state-top, .state.mini .state-sub { display: none; }
.state.mini .bigstate { font-size: var(--t-l); margin: 0; flex: 1; min-width: 0; }
.state.mini .clock { font-size: var(--t-xl); margin: 0; }
.countdown { font-size: 5.5rem; font-weight: 600; text-align: center; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--accent-ink); }

/* ------------------------------------------------------------ jauges, champs de mesure */
.gauges { display: grid; gap: 14px; }
.gauge .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 8px; }
.gauge .lbl { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); letter-spacing: .13em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
/* entrée AUX : valeur + détail long (impulsions, tension) sur deux lignes */
.gauge:has(.sw.aux) .val { flex: 1 1 auto; text-align: right; font-size: var(--t-l); }
.gauge:has(.sw.aux) .val small { display: block; font-size: var(--t-xs); white-space: normal; }
.sw { width: 14px; height: 4px; display: inline-block; flex: none; vertical-align: middle; background: var(--s3); }
.sw.f, .sw.bf { background: var(--s1); } .sw.s, .sw.br { background: var(--s2); } .sw.bf, .sw.br { height: 2px; } .sw.gps, .sw.aux { background: var(--s3); }
.gauge .val { font-size: var(--t-xl); line-height: 1.05; font-weight: 600; white-space: nowrap; }
/* valeur en direct à la couleur du capteur, soulignée au surligneur */
.gauge:has(.sw.f) .val, .gauge:has(.sw.bf) .val { color: var(--s1-ink); --hl: var(--s1); }
.gauge:has(.sw.s) .val, .gauge:has(.sw.br) .val { color: var(--s2-ink); --hl: var(--s2); }
.gauge:has(.sw.f) .val, .gauge:has(.sw.s) .val { background: linear-gradient(transparent 60%, color-mix(in srgb, var(--hl) 24%, transparent) 60% 92%, transparent 92%); padding: 0 2px; }
.track { position: relative; height: 12px; margin-top: 7px; background-color: var(--surface2); background-image: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--surface) calc(10% - 1px) 10%); }
.track > i { position: relative; z-index: 1; display: block; height: 100%; max-width: 100%; transition: width var(--poll, .25s) linear; background: var(--s3); }
.track > i.f, .track > i.bf { background: var(--s1); } .track > i.s, .track > i.br { background: var(--s2); }
.gauge:has(.sw.bf) .track, .gauge:has(.sw.br) .track { height: 6px; background-image: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: var(--t-s); margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-weight: 600; }
/* grille d'indicateurs : filets tracés par chaque case (une case vide en fin de grille reste vide) */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); }
body[data-mode="pc"] .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 9px 12px 10px; min-width: 0; background: transparent; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.stat .l, .tile .l { font-size: var(--t-xs); line-height: 1.2; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat .v, .tile .v { display: flex; align-items: baseline; gap: .3em; font-size: var(--t-l); line-height: 1.25; font-weight: 600; margin-top: 3px; white-space: nowrap; }
.mcard:has(h2 .sw.f) .stat:not(.warn):not(.crit) .v { color: var(--s1-ink); }
.mcard:has(h2 .sw.s) .stat:not(.warn):not(.crit) .v { color: var(--s2-ink); }
.mcard:has(h2 .sw.f) { box-shadow: inset 0 0 0 1px var(--edge), inset 3px 0 0 var(--s1); }
.mcard:has(h2 .sw.s) { box-shadow: inset 0 0 0 1px var(--edge), inset 3px 0 0 var(--s2); }
.stat .d, .tile .s { font-size: var(--t-s); color: var(--ink2); margin-top: 1px; overflow-wrap: anywhere; }
/* tuiles : un panneau chacune */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { padding: 11px 13px 12px; min-width: 0; }
.tile .v { font-size: var(--t-xl); line-height: 1.15; margin-top: 6px; }
.tile .v.txt { font-size: var(--t-l); line-height: 1.6; }
.tile .v .ico { align-self: center; width: .8em; height: .8em; }
.tile.warn .v { color: var(--warn-ink); } .tile.crit .v { color: var(--crit); } .tile.ok .v .ico { color: var(--good); }
.tile.warn { background-color: var(--warn-t); --edge: var(--warn); --hud: var(--warn); }
.tile.crit { background-color: var(--crit-t); --edge: var(--crit); --hud: var(--crit); }
.mcard h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta { display: flex; flex-wrap: wrap; margin: 0; border-top: 1px solid var(--grid); border-bottom: 1px solid var(--grid); font-size: var(--t-s); }
.meta div { padding: 6px 16px 6px 0; margin-right: 16px; border-right: 1px solid var(--grid); display: flex; gap: 6px; align-items: baseline; }
.meta div:last-child { border-right: 0; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; font-weight: 600; }

/* ------------------------------------------------------------ formulaires */
.field.nona { grid-template-columns: 1fr; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: end; }
.field label { grid-column: 1 / -1; font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.field label small { font-weight: 400; color: var(--muted); font-size: inherit; text-transform: none; letter-spacing: .02em; }
.field input[type=number], .field input[type=text], .field select, .inp, select.sm {
  width: 100%; min-height: var(--hit); padding: 0 12px; border: 1px solid var(--axis); border-radius: 0; background: var(--surface); font-size: 1rem;
  transition: border-color var(--fast), box-shadow var(--fast);
}
.field input:hover, .field select:hover, .inp:hover { border-color: var(--ink); }
.field input:focus, .field select:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.field input:disabled { background: var(--surface2); color: var(--muted); border-style: dashed; }
.field .invalid { border-color: var(--crit); border-width: 2px; }
.na { --c: 7px; --edge: var(--axis); min-height: var(--hit); padding: 0 12px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); cursor: pointer; font-weight: 600; font-size: var(--t-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); transition: background-color var(--fast), color var(--fast); }
.na[aria-pressed="true"] { background: var(--ink); color: var(--surface); --edge: var(--ink); }
.fgrid { display: grid; gap: 12px; grid-template-columns: 1fr; }
body[data-mode="pc"] .fgrid { grid-template-columns: 1fr 1fr; }
.fgrid .full { grid-column: 1 / -1; }
.seg { --c: 7px; --edge: var(--axis); display: inline-flex; border: 0; box-shadow: inset 0 0 0 1px var(--edge); background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 1em; min-height: calc(var(--hit) - 2px); cursor: pointer; font-weight: 600; font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); transition: background-color var(--fast), color var(--fast); }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg.sm button { min-height: 34px; padding: 0 .8em; }
.seg.two { display: grid; grid-template-columns: 1fr 1fr; }
.check { display: flex; gap: 12px; align-items: center; min-height: var(--hit); cursor: pointer; font-weight: 600; }
.check input, .chanrow input, .run input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.steps { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: var(--t-s); }
.steps a { font-weight: 600; color: var(--ink2); padding: 6px 0; letter-spacing: .04em; }
.steps a:hover { color: var(--accent-ink); }
.stickybar { position: sticky; bottom: 0; z-index: 5; padding: 10px 0; background: var(--glass-bar); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
body[data-mode="phone"] .stickybar { bottom: calc(58px + env(safe-area-inset-bottom)); }
select.sm { width: auto; min-height: 36px; padding: 0 8px; font-size: var(--t-s); }
#anStage .row input[type=text] { flex: 1 1 200px; }

/* ------------------------------------------------------------ analyse */
.runlist { display: grid; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); }
.run { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; background: transparent; transition: background-color var(--fast); }
.run:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.run + .run { border-top: 1px solid var(--grid); }
.run .name { font-weight: 600; letter-spacing: .02em; }
.run .sub { font-size: var(--t-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.run .acts { display: flex; gap: 6px; }
/* séries « Mise au point » dans la liste des runs, et vue d'une série */
.sblock { box-shadow: inset 3px 0 0 var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.sblock + .run, .run + .sblock, .sblock + .sblock { border-top: 1px solid var(--grid); }
.sblock .shead { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 9px 12px 6px; }
.sblock .shead .name { font-weight: 700; letter-spacing: .02em; }
.sblock .shead .sub { font-size: var(--t-s); color: var(--muted); }
.sblock .run { padding-left: 24px; border-top: 1px dashed var(--grid); }
.sbar { height: 8px; background: var(--surface2); } .sbar > i { display: block; height: 100%; background: var(--axis); }
.slist { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; font-size: var(--t-s); }
.spark { display: block; }
/* mode d'analyse sous Démarrer : une seule ligne en grand écran */
.sesbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; }
.sesbox .lbl { margin: 0; }
.sesmise { display: flex; gap: 8px; flex: 1 1 300px; min-width: 0; }
.sesmise .inp { flex: 1; min-width: 0; min-height: 34px; }
.sesinfo { flex: 1 1 220px; }
/* carte 3 : course des capteurs | zéro, puis tableau fourche / amortisseur */
.calgrid { display: grid; gap: 16px; }
body[data-mode="pc"] .calgrid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.calrow { display: grid; grid-template-columns: 7.5em minmax(5em, 9em) auto; gap: 8px; align-items: center; justify-content: start; }
.calrow label { font-size: var(--t-s); font-weight: 600; }
.inunit { display: flex; align-items: center; gap: 6px; } .inunit .inp { width: 100%; min-width: 0; min-height: 34px; }
table.tbl.calt { width: auto; min-width: min(100%, 560px); }
.calt td, .calt th { white-space: nowrap; padding-left: 28px; }
/* conseil : détails dans un panneau, sous l'action */
.vdetail { margin-top: 10px; display: grid; gap: 6px; padding: 10px 14px 12px; background: var(--surface2); box-shadow: inset 0 0 0 1px var(--grid), inset 4px 0 0 var(--warn); font-family: var(--font-text); font-size: var(--t-s); color: var(--ink2); }
.verdict:not(.warn) + .vdetail { box-shadow: inset 0 0 0 1px var(--grid), inset 4px 0 0 var(--axis); }
.vrow { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 10px; margin: 0; }
.vrow .vk { font-family: var(--font); font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.vrow b { color: var(--ink); font-weight: 600; }
.vwhy summary { cursor: pointer; font-family: var(--font); font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.vwhy p { margin: 6px 0 0; }
@media (max-width: 640px) { .vrow { grid-template-columns: 1fr; gap: 0; } }
/* diagnostic : titre de section dans un bandeau collé au tableau qu'il annonce */
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 18px; padding: 7px 8px 7px 14px; min-height: 42px; background: var(--surface2); box-shadow: inset 0 0 0 1px var(--edge, var(--grid)); }
.dhead .lbl { margin: 0; color: var(--ink2); }
.dhead + .ttable, .dhead + .obs, .dhead + .dbody { margin-top: 0; border-top: 0; }
.dbody { display: grid; gap: 6px; padding: 10px 14px 12px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge, var(--grid)); font-family: var(--font-text); font-size: var(--t-s); color: var(--ink2); }
.dbody .vrow b { color: var(--ink); font-weight: 600; }
/* constats / observations : flèche d'ouverture (le « i » reste celui du tableau des réglages), puce pour l'info */
.ob .obx { grid-column: 2 / -1; margin: 2px 0 6px; color: var(--ink2); display: grid; gap: 4px; animation: reveal .16s ease-out; }
.ob .obx.hidden { display: none; }
.ob .obt { cursor: pointer; }
.obdot { width: 7px; height: 7px; margin: 0 5px; background: var(--axis); transform: rotate(45deg); }
.obtog .ico { transition: transform var(--fast); }
.obtog[aria-expanded="true"] { background: none; color: var(--accent-ink); }
.obtog[aria-expanded="true"] .ico { transform: rotate(90deg); }
/* onglet Analyse, aucun run ouvert : la liste prend toute la largeur, runs en colonnes */
body[data-mode="pc"] #tab-analysis:not(.an-open) .an-layout { grid-template-columns: minmax(0, 1fr); }
body[data-mode="pc"] #tab-analysis:not(.an-open) #anMain { display: none; }
@media (min-width: 900px) {
  body[data-mode="pc"] #tab-analysis:not(.an-open) .runlist { --cell: transparent; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  body[data-mode="pc"] #tab-analysis:not(.an-open) .runlist > p { background: var(--cell); padding: 10px 12px; grid-column: 1 / -1; }
  body[data-mode="pc"] #tab-analysis:not(.an-open) .run { background: var(--cell); border-top: 0; box-shadow: inset -1px -1px 0 var(--grid); }
  body[data-mode="pc"] #tab-analysis:not(.an-open) .sblock { --cell: transparent; grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); border-top: 0; box-shadow: inset 3px 0 0 var(--accent), inset 0 -1px 0 var(--grid); }
  body[data-mode="pc"] #tab-analysis:not(.an-open) .sblock .shead { grid-column: 1 / -1; box-shadow: inset 0 -1px 0 var(--grid); }
  body[data-mode="pc"] #tab-analysis:not(.an-open) .sblock .run { padding-left: 12px; border-top: 0; }
}
.progress { height: 6px; background: var(--surface2); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

/* diagnostic : verdict (bloc dominant), liste des actions, détail par réglage */
.verdict { --c2: 0px; --edge: var(--ink); display: grid; gap: 2px; padding: 14px 16px 16px; background: var(--ink); color: var(--surface); }
.verdict .lbl { color: inherit; opacity: .8; }
.verdict strong { font-size: var(--t-xl); line-height: 1.15; font-weight: 600; letter-spacing: .01em; }
.verdict span:last-child { font-size: var(--t-s); font-variant-numeric: tabular-nums; }
.verdict:last-child { --c2: var(--c); }
.verdict.ok { background: var(--good-t); color: var(--good); --edge: var(--good-fill); box-shadow: inset 0 0 0 1px var(--good-fill); }
.verdict.warn { background: var(--warn-t); color: var(--warn-ink); --edge: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.verdict.crit { background: var(--crit-t); color: var(--crit); --edge: var(--crit); box-shadow: inset 0 0 0 1px var(--crit); }
.verdict.ok .lbl, .verdict.warn .lbl, .verdict.crit .lbl { color: var(--ink2); opacity: 1; }
.verdict.ok span:last-child, .verdict.warn span:last-child, .verdict.crit span:last-child { color: var(--ink2); }
.todo { --c1: 0px; list-style: none; margin: 0; padding: 0; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); }
.verdict.warn + .todo { --edge: var(--warn); }
.verdict.crit + .todo { --edge: var(--crit); }
.todo li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 10px 12px 10px 14px; box-shadow: inset 4px 0 0 var(--warn); }
.todo li.crit { box-shadow: inset 4px 0 0 var(--crit); }
.todo li + li { border-top: 1px solid var(--grid); }
.todo .ico { grid-row: span 2; width: 1.5em; height: 1.5em; }
.todo-w { font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.todo-a { font-size: var(--t-l); line-height: 1.2; font-weight: 600; grid-column: 2; }
.todo-c { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: var(--t-xl); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.todo li.warn .todo-a, .todo li.warn .todo-c { color: var(--warn-ink); } .todo li.crit .todo-a, .todo li.crit .todo-c { color: var(--crit); }
.tunehead { display: flex; justify-content: flex-end; margin: 12px 0 8px; }
.ttable { background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); }
.trow { display: grid; grid-template-columns: minmax(150px, 1fr) repeat(2, minmax(0, 1.25fr)); gap: 0 20px; align-items: center; padding: 10px 16px; }
.ttable.cols1 .trow { grid-template-columns: minmax(150px, 1fr) minmax(0, 1.5fr); }
.trow + .trow, .tinfo + .trow { border-top: 1px solid var(--grid); }
.trow.thead { padding-top: 9px; padding-bottom: 9px; border-bottom: 1px solid var(--ink); font-size: var(--t-xs); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.trow.thead > div { display: flex; align-items: center; gap: 6px; }
.tlab b { display: block; font-size: var(--t-s); font-weight: 600; letter-spacing: .02em; }
.tlab span { font-size: var(--t-xs); color: var(--muted); letter-spacing: .04em; }
.tcell { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0 8px; align-items: center; font-size: var(--t-s); }
.tact { display: flex; align-items: center; gap: .4em; font-weight: 600; min-height: 28px; }
.tact .ico { width: 1.1em; height: 1.1em; }
.tact.good { color: var(--good); } .tact.warn { color: var(--warn-ink); } .tact.crit { color: var(--crit); }
.tsub { text-align: right; font-weight: 600; white-space: nowrap; }
.tcell.muted .tact, .tcell.muted .tsub { color: var(--muted); font-weight: 400; }
/* règle d'écart : 7 graduations, centre = bon réglage ; le curseur part du centre et glisse à sa place */
.tscale { grid-column: 1 / -1; position: relative; height: 16px; margin: 0 5px 2px; }
.tscale::before { content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 1px; background: var(--axis); }
.tscale i { position: absolute; bottom: 3px; width: 1px; height: 5px; background: var(--axis); }
.tscale i:nth-child(4) { height: 11px; width: 2px; margin-left: -.5px; background: var(--ink); }
.tscale u { position: absolute; bottom: 2px; height: 3px; background: currentColor; transform-origin: var(--o, left); animation: grow .45s ease-out; }
.tscale b { position: absolute; left: var(--p); bottom: 3px; width: 0; height: 0; margin-left: -5px; border: 5px solid transparent; border-top: 9px solid currentColor; border-bottom: 0; animation: slide .45s ease-out; }
.tscale.good { color: var(--good); } .tscale.warn { color: var(--warn-ink); } .tscale.crit { color: var(--crit); }
.tinfo { padding: 10px 16px 12px 28px; border-top: 1px solid var(--grid); box-shadow: inset 4px 0 0 var(--muted); background: var(--surface2); font-size: var(--t-s); color: var(--ink2); animation: reveal .16s ease-out; }
.tinfo b { color: var(--ink); font-weight: 600; }
.tinfo p { margin: 0; } .tinfo p + p { margin-top: 6px; }
.obs { list-style: none; margin: 0; padding: 0; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); }
.ob { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 7px 8px 7px 14px; font-size: var(--t-s); }
.ob + .ob { border-top: 1px solid var(--grid); }
.ob.warn { background: var(--warn-t); } .ob.crit { background: var(--crit-t); }
.obt b { font-weight: 600; letter-spacing: .02em; }
.obt span { color: var(--muted); }
.ob p { grid-column: 2 / -1; margin: 2px 0 6px; color: var(--ink2); animation: reveal .16s ease-out; }
.diag { display: block; }
.tag { font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--muted); }
.tag.warn { color: var(--warn-ink); } .tag.crit { color: var(--crit); } .tag.ok { color: var(--good); }
@media (max-width: 640px) {
  .trow, .ttable.cols1 .trow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; }
  .ttable.cols1 .trow { grid-template-columns: minmax(0, 1fr); }
  .trow .tlab { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
  .trow.thead > div:first-child { display: none; }
  .tcell { grid-template-columns: minmax(0, 1fr) auto; }
  .tcell .tsub { grid-row: 3; grid-column: 1; text-align: left; }
  .tcell .ibtn { grid-row: 3; grid-column: 2; }
  .tcell.muted .tsub { grid-row: auto; grid-column: auto; text-align: right; }
  .meta div { border-right: 0; margin-right: 0; padding-right: 20px; }
}

/* graphiques */
.ctools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chartcard { padding: 10px 12px 8px; }
.chartcard h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: var(--t-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.chartcard h3 small { font-weight: 400; color: var(--muted); font-size: inherit; text-transform: none; letter-spacing: .02em; }
.cwrap { position: relative; width: 100%; }
.cwrap canvas { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; }
.legend { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: var(--t-xs); color: var(--ink2); margin: 2px 0 6px; letter-spacing: .04em; }
.legend button { border: 0; background: none; padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); transition: opacity var(--fast); }
.legend button.off { opacity: .45; text-decoration: line-through; }
.legend .k { width: 14px; height: 3px; display: inline-block; }
.legend .k.box { height: 10px; width: 10px; }
.legend .k.out { height: 10px; width: 10px; background: none !important; border: 2px solid; }
.tip { position: absolute; z-index: 5; pointer-events: none; padding: 7px 9px; background: var(--surface); border: 1px solid var(--accent); box-shadow: 0 6px 18px rgba(11, 28, 44, .14); font-size: var(--t-xs); white-space: nowrap; line-height: 1.5; }
.tip b { font-weight: 600; }
.tip .r { display: flex; gap: 6px; align-items: center; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
.tbl th, .tbl td { padding: 6px 0 6px 12px; border-bottom: 1px solid var(--grid); text-align: right; vertical-align: baseline; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
.tbl th { font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom-color: var(--ink); }
.tbl td { font-weight: 600; } .tbl td:first-child { font-weight: 400; }
.tbl td.up.good { color: var(--good); } .tbl td.up.bad { color: var(--crit); }
.tbl .dec { display: inline-block; width: 1.7ch; text-align: left; }
.tbl td.un { font-weight: 400; color: var(--muted); text-align: left; padding-left: 6px; font-size: var(--t-xs); }
.tblwrap { overflow-x: auto; }
.tbl-mini { font-size: var(--t-xs); margin-top: 6px; }

/* phases du run : la descente analysée est en orange signal */
.phasewrap { position: relative; margin: 6px 0; }
.phasebar { position: relative; height: 14px; overflow: hidden; background: var(--surface2); }
.phasebar span { position: absolute; top: 0; bottom: 0; cursor: pointer; transition: opacity var(--fast); }
.phasebar span:hover { opacity: .7; }
.phasewin { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--ink); pointer-events: none; transition: left .2s, width .2s; }
.ph-stop { background: repeating-linear-gradient(135deg, var(--axis) 0 1px, transparent 1px 4px); }
.ph-climb { background: var(--muted); } .ph-flat { background: var(--grid); } .ph-descent { background: var(--accent); } .ph-crash { background: var(--crit); }
.phlg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--t-xs); color: var(--ink2); letter-spacing: .03em; }
.phlg i { display: inline-block; width: 12px; height: 8px; margin-right: 5px; vertical-align: -1px; }
.phlg b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* carte, capteurs, niveau à bulle */
.mapwrap canvas, #anMap canvas { touch-action: none; cursor: crosshair; background: var(--surface2); }
.gradlegend { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.gradlegend i { flex: 0 1 180px; height: 6px; background: linear-gradient(90deg, hsl(240 90% var(--heat-l)), hsl(180 90% var(--heat-l)), hsl(120 90% var(--heat-l)), hsl(60 90% var(--heat-l)), hsl(0 90% var(--heat-l))); }
.gradlegend:empty { display: none; }
.chanlist { display: grid; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); }
.chanrow { display: grid; grid-template-columns: 22px 14px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; padding: 8px 12px; background: transparent; cursor: pointer; min-height: 48px; }
.chanrow + .chanrow { border-top: 1px solid var(--grid); }
.chanrow .grow { line-height: 1.25; }
.chanrow .num, .chanrow #ck_gps { text-align: right; max-width: 12rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.levelbox { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.bubble { position: relative; width: 104px; height: 104px; border-radius: 50%; border: 1px solid var(--axis); background: var(--surface2); flex: none; }
.bubble::before, .bubble::after { content: ""; position: absolute; background: var(--axis); }
.bubble::before { left: 50%; top: 8px; bottom: 8px; width: 1px; }
.bubble::after { top: 50%; left: 8px; right: 8px; height: 1px; }
.bubble i { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); transform: translate(-50%, -50%); transition: transform .3s, background-color .2s; z-index: 1; }
.bubble i.ok { background: var(--good-fill); }
.levelbox .kv { flex: 1; min-width: 180px; }
.splitwrap { position: relative; }
.splitwrap canvas { display: block; width: 100%; touch-action: pan-y; cursor: ew-resize; }
.splithandle { position: absolute; top: 0; width: 34px; height: 34px; margin-left: -17px; border-radius: 0; border: 2px solid var(--accent); background: var(--surface); color: var(--ink); font-size: var(--t-xs); font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: ew-resize; padding: 0; }

/* ------------------------------------------------------------ message bref, attente, dialogue */
#toast { position: fixed; left: 50%; transform: translate(-50%, 8px); z-index: 100; bottom: calc(76px + env(safe-area-inset-bottom)); width: max-content; max-width: min(92vw, 520px); padding: 10px 16px; background: var(--ink); color: var(--surface); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; font-size: var(--t-s); letter-spacing: .02em; opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s; text-align: center; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
body[data-mode="pc"] #toast { bottom: 28px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--axis); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
.pulse { animation: beat 1.2s ease-in-out infinite; }
.overlay { position: fixed; inset: 0; background: rgba(6, 14, 22, .62); z-index: 90; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.overlay .box { --c: 16px; background: var(--surface); width: 100%; max-width: 520px; box-shadow: inset 0 2px 0 var(--accent); padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 12px; animation: up .18s ease-out; }
.overlay .box h2 { font-size: var(--t-l); letter-spacing: .02em; text-transform: none; }
.overlay .box p { margin: 0; color: var(--ink2); }
.overlay .box .btn { width: 100%; min-height: 64px; font-size: 1rem; }
@media (min-width: 700px) { .overlay { align-items: center; } .overlay .box { box-shadow: inset 0 0 0 1px var(--line), inset 0 3px 0 var(--accent); } }
.zone { display: grid; gap: 10px; justify-items: start; }
.zone strong { font-size: var(--t-l); font-weight: 600; letter-spacing: .02em; }
.zone p { margin: 0; color: var(--ink2); max-width: 60ch; }
.zone .field, .zone .banner, .zone .progress, .rm .zone .btn { width: 100%; }
.center { text-align: center; justify-items: center; }
.nowrap { flex-wrap: nowrap; }
.rm h2.title { margin: 0; padding: 0; border: 0; }
.rw .grow .small { display: block; }

@keyframes sp { to { transform: rotate(360deg); } }
@keyframes beat { 50% { opacity: .25; } }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
@keyframes slide { from { left: 50%; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes monte { from { opacity: 0; transform: translateY(10px); } }
@keyframes balayage { from { transform: translateY(-10px); } to { transform: translateY(100vh); } }
@keyframes eclat { 0%, 50% { background-position: 160% 0; } 85%, 100% { background-position: -60% 0; } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good-fill) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } body::after { display: none; } }
@media (forced-colors: active) { .track > i, .btn.primary, .state.rec, .verdict { forced-color-adjust: none; } #fond, body::before, body::after { display: none; } }

/* =====================================================================
   Télécommande : cibles de 64 px, onglets en bas (58 px), commande de 96 px
   ===================================================================== */
.rm { --hit: 64px; max-width: 520px; margin: 0 auto; padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; font-size: 1rem; }
.rm .btn { white-space: normal; font-size: 1rem; }
.rm .btn.sm { min-height: 56px; }
.rm .bigbtn { width: 100%; min-height: 96px; font-size: var(--t-xl); letter-spacing: .14em; --c: 14px; }
.rm .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rmb { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.rmb.enter { animation: fade var(--fast) ease-out; }   /* fondu au changement d'onglet seulement (pas quand une réponse reconstruit l'onglet) */
.rmtabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--glass-bar); -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.rm .msg { min-height: 1.4em; }
.rows { background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); }
.rw { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 8px 8px 12px; }
.rw + .rw { border-top: 1px solid var(--grid); }
.rw .grow b { display: block; font-weight: 600; overflow-wrap: anywhere; letter-spacing: .02em; }
.rm .chanrow { min-height: 64px; }
.rm .chanrow .num, .rm .chanrow .small { overflow-wrap: anywhere; }
.rm h2 { margin-top: 4px; padding-top: 8px; border-top: 2px solid var(--ink); }
.rm .card h2, .rm .box h2 { margin: 0; padding: 0; border: 0; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 0; border-top: 1px solid var(--grid); }
.srow .slab { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.srow .shint { font-size: var(--t-s); font-weight: 600; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 6px; }
.srow .shint.good { color: var(--good); } .srow .shint.warn { color: var(--warn-ink); } .srow .shint.crit { color: var(--crit); }
.srow .sctl { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px auto; gap: 8px; align-items: center; }
.srow .sbtn { min-height: 64px; font-size: var(--t-xl); padding: 0; }
.srow .sval { min-height: 64px; text-align: center; font-size: var(--t-l); font-weight: 600; width: 100%; }
.srow .na { min-height: 64px; }
/* télécommande : sur un petit écran, le logo seul */
@media (max-width: 370px) { .brand b { display: none; } }

/* sections secondaires repliables (repliées sur téléphone) */
details.fold { border-top: 2px solid var(--ink); }
details.fold > summary { font-size: var(--t-xs); letter-spacing: .13em; text-transform: uppercase; padding: 12px 0; }
details.fold > summary:hover { color: var(--accent-ink); }
details.fold > summary + * { margin-top: 0; }
details.card > summary { padding: 0; }
.anhead .row { gap: 6px; }

svg[hidden] { display: none; }
.tblwrap .tbl th, .tblwrap .tbl td { white-space: nowrap; }
.tblwrap .tbl td:first-child, .tblwrap .tbl th:first-child { white-space: normal; min-width: 9em; }
.crit { color: var(--crit); }

/* =====================================================================
   Hors norme : bien visible, sans couleur pâle
   - attention : panneaux ambre vif à texte foncé, cadres ambre ;
   - à corriger : rouge plein ou cadre rouge ;
   - les pictogrammes sont des panneaux pleins (triangle ambre, octogone rouge).
   ===================================================================== */
svg.ico:has(use[href="#i-warn"]) { fill: var(--warn); color: var(--on-warn); }
svg.ico:has(use[href="#i-err"]) { fill: var(--crit-fill); color: var(--on-crit); }
.tscale.warn { color: var(--warn-mark); }

/* verdict du diagnostic : bloc plein */
.verdict.ok { background: var(--good-fill); color: var(--on-good); --edge: var(--good-fill); box-shadow: none; }
.verdict.warn { background: var(--warn); color: var(--on-warn); --edge: var(--warn); box-shadow: none; }
.verdict.crit { background: var(--crit-fill); color: var(--on-crit); --edge: var(--crit-fill); box-shadow: none; }
.verdict.ok .lbl, .verdict.warn .lbl, .verdict.crit .lbl, .verdict.ok span:last-child, .verdict.warn span:last-child, .verdict.crit span:last-child { color: inherit; opacity: .85; }
.verdict.warn + .todo, .verdict.crit + .todo { box-shadow: inset 0 0 0 2px var(--edge); }

/* valeur d'un réglage à modifier (nombre de clics, pression…) : pastille pleine */
.todo-c, .tcell:has(.tact.warn) .tsub, .tcell:has(.tact.crit) .tsub { justify-self: end; padding: 3px 9px; line-height: 1.15; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px)); }
.todo li.warn .todo-c, .tcell:has(.tact.warn) .tsub { background: var(--warn); color: var(--on-warn); }
.todo li.crit .todo-c, .tcell:has(.tact.crit) .tsub { background: var(--crit-fill); color: var(--on-crit); }
.todo li.warn { box-shadow: inset 6px 0 0 var(--warn); }
.todo li.crit { box-shadow: inset 6px 0 0 var(--crit-fill); }
.todo li.crit .todo-a { color: var(--crit); }
/* case du tableau des réglages à modifier : cadrée */
.tcell:has(.tact.warn) { outline: 2px solid var(--warn); outline-offset: 5px; }
.tcell:has(.tact.crit) { outline: 2px solid var(--crit-fill); outline-offset: 5px; }
.tact.crit { color: var(--crit); }

/* indicateurs hors norme : cadre ambre (à surveiller) ou rouge (à corriger) */
.stat.warn { background: var(--warn-t); box-shadow: inset 0 0 0 2px var(--warn); }
.stat.crit { background: var(--crit-t); box-shadow: inset 0 0 0 2px var(--crit-fill); }
.stat.crit .v { color: var(--crit); }
.stat.warn .v, .stat.crit .v { align-items: center; }
.stat.warn .v .ico, .stat.crit .v .ico { width: .85em; height: .85em; }
.stat.warn .l, .stat.crit .l { color: var(--ink2); }
/* puces de données (pertes, échelle, batterie) */
.meta div.warn dd, .meta div.crit dd { display: inline-flex; align-items: center; gap: 4px; }
.meta div.crit dd { color: var(--crit); }
.meta div.warn { box-shadow: inset 0 -3px 0 var(--warn); }
.meta div.crit { box-shadow: inset 0 -3px 0 var(--crit-fill); }
.meta div .ico { width: 1em; height: 1em; }
/* tuiles de la télécommande */
.tile.warn { box-shadow: inset 0 0 0 2px var(--warn); }
.tile.crit { box-shadow: inset 0 0 0 2px var(--crit-fill); }
.tile.crit .v { color: var(--crit); }
.ob.warn { box-shadow: inset 4px 0 0 var(--warn); }
.ob.crit { box-shadow: inset 4px 0 0 var(--crit-fill); }

/* =====================================================================
   Analyse : sous-onglets (Synthèse, Suspensions, Freins, Parcours, Courbes,
   Centrale, Distributions, Infos). La barre reste collée sous l'en-tête.
   ===================================================================== */
.subtabs {
  position: sticky; top: 48px; z-index: 15; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  margin-left: -16px; margin-right: -16px; padding: 0 16px;
  background: var(--glass-bar); -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2);
  box-shadow: inset 0 -1px 0 var(--line);
}
.subtabs::-webkit-scrollbar { display: none; }
.subtabs button {
  position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 12px;
  border: 0; background: none; cursor: pointer; color: var(--ink2); font: 600 11.5px/1 var(--font); letter-spacing: .12em; text-transform: uppercase;
  transition: color var(--fast), background-color var(--fast);
}
.subtabs button::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; background: var(--accent); transform: scaleX(0); transition: transform var(--fast) ease-out; }
.subtabs button:hover { color: var(--ink); }
.subtabs button.on { color: var(--accent-ink); }
.subtabs button.on::after { transform: none; }
/* pastille : ce sous-onglet contient une valeur hors norme */
.subtabs .alerte { display: none; width: 8px; height: 8px; flex: none; }
.subtabs button[data-alerte="warn"] .alerte { display: block; background: var(--warn); transform: rotate(45deg); }
.subtabs button[data-alerte="crit"] .alerte { display: block; background: var(--crit-fill); border-radius: 50%; box-shadow: 0 0 0 0 var(--crit-fill); animation: ping-crit 2s ease-out infinite; }
@keyframes ping-crit { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--crit-fill) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
.anpane { display: none; }
.anpane.on { display: block; animation: monte .28s cubic-bezier(.2, .75, .25, 1); }
body[data-mode="pc"] .subtabs { top: 49px; margin-left: 0; margin-right: 0; padding: 0 4px; }
body[data-mode="pc"] .subtabs button { padding: 0 16px; }
@media (prefers-reduced-motion: reduce) { .subtabs button[data-alerte="crit"] .alerte { animation: none; } }
.mcard h2 .muted { text-transform: none; letter-spacing: .02em; }
/* tiret de couleur devant un titre (manuels, cartes) : décollé du texte */
h2 > .sw:first-child, h3 .sw { margin-right: .65em; vertical-align: .2em; }
.mcard h2 > .sw:first-child { margin-right: 0; }

/* =====================================================================
   Retouches (phase 3, suite) : jauges en direct, encarts de la synthèse,
   bandeau des phases accroché en bas, réglages, rail de l'ordinateur
   ===================================================================== */
/* jauges en direct : zone de sag conseillé, pic des 10 dernières secondes, valeur en mm et en % */
.gtools { display: flex; gap: 4px; flex-wrap: wrap; }
.gtools .btn { min-height: 32px; padding: 0 .65em; }
.gauges > .glg { margin-top: -8px; }
.glg { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: var(--t-xs); color: var(--muted); letter-spacing: .03em; }
.glg span { display: inline-flex; align-items: center; gap: 6px; }
.glg i { display: inline-block; flex: none; }
.glg .lg-zone { width: 16px; height: 10px; background: color-mix(in srgb, var(--ink) 10%, transparent); box-shadow: inset 1px 0 0 var(--ink2), inset -1px 0 0 var(--ink2); }
.glg .lg-pic { width: 2px; height: 12px; background: var(--ink); }
.gauge .val small.gmax { margin-left: .8em; font-size: .42em; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
/* réglages : sag visé (deux bornes) */
.sagin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sagin input[type=number] { width: 88px; flex: none; }
.sagin > span { color: var(--ink2); font-weight: 600; }
.sagin small { flex: 1 1 200px; font-size: var(--t-xs); }
.gauge .val { display: inline-flex; align-items: baseline; gap: 0; background: none; padding: 0; }
.gauge .val b { font-weight: 600; padding: 0 2px; }
.gauge:has(.sw.f) .val, .gauge:has(.sw.s) .val { background: none; padding: 0; }
.gauge:has(.sw.f) .val b, .gauge:has(.sw.s) .val b { background: linear-gradient(transparent 60%, color-mix(in srgb, var(--hl) 24%, transparent) 60% 92%, transparent 92%); }
.gauge .val em { display: inline-flex; align-items: center; gap: 3px; margin-left: .55em; font-style: normal; font-size: .55em; font-weight: 600; color: var(--ink); }
.gauge .val em .ico { width: 1em; height: 1em; }
.gauge.inzone .val em { color: var(--good); }
.track > i.zone { position: absolute; z-index: 0; top: -4px; bottom: -4px; height: auto; max-width: none; transition: left .3s, width .3s; background: color-mix(in srgb, var(--hl, var(--ink)) 16%, transparent); box-shadow: inset 1px 0 0 color-mix(in srgb, var(--hl, var(--ink)) 75%, transparent), inset -1px 0 0 color-mix(in srgb, var(--hl, var(--ink)) 75%, transparent); }
.gauge:has(.sw.f) .track { --hl: var(--s1); } .gauge:has(.sw.s) .track { --hl: var(--s2); }
.track > i.pic { position: absolute; z-index: 2; top: -5px; bottom: -5px; width: 2px; height: auto; margin-left: -1px; background: var(--ink); transition: left var(--poll, .25s) linear; }
.track > i.pic[hidden] { display: none; }
.gauge.inzone .track > i.zone { background: color-mix(in srgb, var(--good-fill) 22%, transparent); box-shadow: inset 1px 0 0 var(--good-fill), inset -1px 0 0 var(--good-fill); }

/* synthèse : encarts des indicateurs choisis (chiffre clé en grand, couleur de la suspension) */
.kpiwrap > * + * { margin-top: 10px; }
.kpiwrap + .diag { margin-top: 16px; }
.kpihead h2 { color: var(--ink2); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
body[data-mode="pc"] .kpis { grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 12px; }
body[data-mode="phone"] .kpis > .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile.kpi { padding: 11px 13px 12px; }
.tile.kpi .v { margin-top: 8px; font-size: clamp(1.55rem, 7.4vw, 2.1rem); line-height: 1.05; align-items: center; }
.tile.kpi .v > span { display: inline-flex; align-items: baseline; gap: .12em; min-width: 0; }
.tile.kpi .v small { font-size: .45em; font-weight: 400; color: var(--muted); margin-left: .25em; }
.tile.kpi .v i { font-style: normal; font-weight: 400; color: var(--muted); margin: 0 .12em; font-size: .7em; }
.tile.kpi .v .vf { color: var(--s1-ink); } .tile.kpi .v .vs { color: var(--s2-ink); }
.tile.kpi .v.duo { font-size: clamp(1.3rem, 5.6vw, 1.6rem); }
.tile.kpi .s { margin-top: 5px; font-size: var(--t-xs); color: var(--ink2); }
.tile.kpi.f, .tile.kpi.s { --side: var(--s1); background-image: linear-gradient(90deg, color-mix(in srgb, var(--side) 11%, transparent), transparent 72%); box-shadow: inset 0 0 0 1px var(--edge), inset 3px 0 0 var(--side); }
.tile.kpi.s { --side: var(--s2); }
.tile.kpi.f .l { color: var(--s1-ink); } .tile.kpi.s .l { color: var(--s2-ink); }
.tile.kpi.f .v { color: var(--s1-ink); } .tile.kpi.s .v { color: var(--s2-ink); }
.tile.kpi.cle .v { color: var(--accent-ink); }
.tile.kpi.warn { background-image: none; background-color: var(--warn-t); box-shadow: inset 0 0 0 2px var(--warn); }
.tile.kpi.crit { background-image: none; background-color: var(--crit-t); box-shadow: inset 0 0 0 2px var(--crit-fill); }
.tile.kpi.warn .l, .tile.kpi.crit .l { color: var(--ink2); }
.tile.kpi.warn .v .ico, .tile.kpi.crit .v .ico { width: .6em; height: .6em; margin-right: .2em; }
.kpipick { padding: 12px 14px; }
.kpichoix { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.pick { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 9px; cursor: pointer; font-size: var(--t-s); font-weight: 600; background: var(--surface); box-shadow: inset 0 0 0 1px var(--axis); clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px)); transition: background-color var(--fast), color var(--fast); }
.pick input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.pick:has(input:checked) { background: var(--ink); color: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }

/* phases du run : bandeau compact accroché en bas de l'analyse (au-dessus des onglets sur téléphone) */
.phdock { position: sticky; z-index: 14; bottom: calc(59px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "bar bar" "lg seg"; gap: 7px 10px; align-items: center;
  margin-top: 12px; padding: 9px 12px 8px; --c: 8px; background-color: var(--glass-bar); -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); }
.phdock .phtitle { display: none; }
.phdock .phasewrap { grid-area: bar; margin: 4px 0 0; }
.phdock .phlg { grid-area: lg; gap: 2px 12px; font-size: 11.5px; line-height: 1.35; }
.phdock .phlg span { white-space: nowrap; }
.phdock .phlg i { width: 10px; height: 8px; margin-right: 4px; }
.phdock .seg { grid-area: seg; align-self: start; }
.phdock .seg button { min-height: 30px; padding: 0 .7em; font-size: 10.5px; }
body[data-mode="pc"] .phdock { bottom: 0; grid-template-columns: auto minmax(220px, 1fr) auto auto; grid-template-areas: "t bar lg seg"; gap: 0 18px; padding: 8px 14px; margin-top: 16px; }
body[data-mode="pc"] .phdock .phtitle { display: block; grid-area: t; }
body[data-mode="pc"] .phdock .phasewrap { margin: 0; }
body[data-mode="pc"] .phdock .phlg { flex-wrap: nowrap; }
body[data-mode="pc"] .phdock .seg { align-self: center; }
.phdock .phasebar { height: 12px; }
.phdock .phasewin { top: -3px; bottom: -3px; }

/* réglages : rangées qui passent à la ligne au lieu d'écraser leurs éléments */
.fitrow { align-items: flex-end; }
.fitrow > .inp, .fitrow > select { width: auto; flex: 100 1 220px; min-width: 0; }
.fitrow > .btn { flex: 1 0 auto; }
.fitrow > .field { flex: 0 0 104px; }
body[data-mode="phone"] .fitrow > .inp, body[data-mode="phone"] .fitrow > select { flex-basis: 100%; }
body[data-mode="pc"] .fitrow > .btn { flex-grow: 0; }
/* entrée AUX : même colonne que les cases à cocher, mode dessous, options en retrait */
.chanrow .cbgap { width: 22px; height: 1px; }
.chanrow.aux { cursor: default; }
.chanrow.aux > select { grid-column: 3 / -1; justify-self: start; max-width: 100%; }
#auxOpts { padding: 2px 12px 14px; }
body[data-mode="pc"] #auxOpts { padding-left: 68px; }
#auxOpts .check { align-items: flex-start; min-height: 0; padding-top: 4px; }
#auxOpts .check > span { line-height: 1.35; }
#auxOpts .check .small { display: block; font-weight: 400; }
.check > input + span { min-width: 0; }
/* barre d'enregistrement des réglages : état + bouton, collée en bas, sans masquer la page */
.savebar { position: sticky; bottom: 12px; z-index: 6; display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 9px 9px 9px 16px; --c: 10px; --hud: transparent;
  background-color: var(--glass-bar); -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); }
body[data-mode="phone"] .savebar { bottom: calc(66px + env(safe-area-inset-bottom)); }
.savebar.dirty { --edge: var(--warn); box-shadow: inset 0 0 0 2px var(--warn), inset 5px 0 0 var(--warn); }
.savestate { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; }
.savestate b { display: block; font-size: var(--t-s); font-weight: 600; letter-spacing: .02em; }
.savestate small { display: block; font-size: var(--t-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.savestate .dd { width: 9px; height: 9px; flex: none; background: var(--off); }
.savestate .dd.ok { background: var(--good-fill); border-radius: 50%; }
.savestate .dd.warn { background: var(--warn); transform: rotate(45deg); }
.savebar .btn { flex: none; min-width: 9.5rem; }

/* ordinateur : rail des onglets en panneau, état sous chaque onglet, boîtier en bas, règle graduée */
.nav .nsub { display: none; }
body[data-mode="pc"] .nav { background-color: var(--glass-bar); background-image: linear-gradient(180deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent 220px); padding: 16px 0 14px; gap: 2px; }
body[data-mode="pc"] .nav::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 7px; pointer-events: none;
  background: repeating-linear-gradient(180deg, var(--line) 0 1px, transparent 1px 12px) right top / 4px 100% no-repeat, repeating-linear-gradient(180deg, var(--axis) 0 1px, transparent 1px 60px) right top / 7px 100% no-repeat; }
body[data-mode="pc"] .nav button { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 4px 12px; align-content: center; min-height: 56px; padding: 8px 20px 8px 18px; text-align: left; }
body[data-mode="pc"] .nav button .ico { grid-row: 1 / span 2; grid-column: 1; align-self: center; }
body[data-mode="pc"] .nav button span { grid-row: 1; grid-column: 2; }
body[data-mode="pc"] .nav button::after { grid-row: 1; grid-column: 3; margin-left: 0; }
body[data-mode="pc"] .nav .nsub { display: block; grid-row: 2; grid-column: 2 / -1; font: 400 12px/1.2 var(--font); letter-spacing: .02em; text-transform: none; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body[data-mode="pc"] .nav button.on .nsub { color: inherit; opacity: .85; }
body[data-mode="pc"] .nav button:hover { padding-left: 23px; }
body[data-mode="pc"] .nav button.on:hover { padding-left: 18px; }
.railbox { margin: auto 16px 0 14px; padding: 12px 14px 13px; background-color: var(--glass); box-shadow: inset 0 0 0 1px var(--line);
  background-image: linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--accent), var(--accent)); background-size: 12px 2px, 2px 12px; background-position: 0 0, 0 0; background-repeat: no-repeat;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
.rb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rb-link { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 600; color: var(--good); letter-spacing: .03em; }
.rb-link.off { color: var(--crit); }
.rb { margin: 10px 0 0; display: grid; gap: 5px; font-size: 12.5px; }
.rb div { display: flex; justify-content: space-between; gap: 8px; }
.rb dt { color: var(--muted); }
.rb dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.rb div.warn dd { color: var(--warn-ink); } .rb div.crit dd { color: var(--crit); }
.rb-segs { display: flex; gap: 3px; margin-top: 10px; }
.rb-segs i { flex: 1; height: 5px; background: var(--surface2); }
.rb-segs i.on { background: var(--good-fill); }
@media (max-height: 640px) { body[data-mode="pc"] .railbox { display: none; } }
body[data-mode="phone"] .chanrow.aux > #ck_aux { grid-column: 3 / -1; justify-self: start; text-align: left; max-width: none; }

/* =====================================================================
   Molettes : compression = bleu, détente (rebound) = rouge, comme sur les
   suspensions. Repère rond (molette) : ne se confond pas avec les états
   (coche, losange, octogone).
   ===================================================================== */
.dmp { display: inline; padding: 0; white-space: nowrap; font: 700 .92em/1.25 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--dc-ink); }
.dmp i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: .02em; border-radius: 50%; background: var(--dc); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--dc) 55%, var(--surface)); position: relative; }
.dmp i::after { content: ""; position: absolute; left: 4px; top: 1px; width: 1px; height: 3px; background: var(--surface); }
.dmp.c, .cd.c { --dc: var(--comp); --dc-ink: var(--comp-ink); }
.dmp.r, .cd.r { --dc: var(--reb); --dc-ink: var(--reb-ink); }
.cd { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--dc); vertical-align: .08em; flex: none; }
.tc { color: var(--comp-ink); font-weight: 600; } .tr { color: var(--reb-ink); font-weight: 600; }
.field label .dmp { font-size: 1em; letter-spacing: .1em; }
.tlab .dmp { font-size: .95em; margin-top: 3px; }
.todo-w .dmp { font-size: .95em; margin-left: 4px; }
.tbl td .dmp { font-size: .9em; }
/* tableau des réglages : filet de la couleur de la molette */
.trow[data-key="lsc"], .trow[data-key="hsc"] { box-shadow: inset 3px 0 0 var(--comp); }
.trow[data-key="lsr"], .trow[data-key="hsr"] { box-shadow: inset 3px 0 0 var(--reb); }

/* ordinateur : une carte de réglages par ligne, champs en colonnes serrées (autant que la largeur le permet) */
body[data-mode="pc"] .setgrid .fgrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
body[data-mode="pc"] .modelrow { align-items: start; }
.sagfield .sagin small { flex-basis: 100%; }

/* cases à cocher : trait fin, carré plein orange au centre une fois cochées (style instrument) */
input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin: 0; flex: none; cursor: pointer; vertical-align: -.2em;
  background: var(--surface); border: 0; border-radius: 0; box-shadow: inset 0 0 0 1.5px var(--axis); transition: box-shadow var(--fast); }
