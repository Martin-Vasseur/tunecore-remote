<script>
'use strict';
/* =====================================================================
   GPS (MAX-M10S intégré, PCB V11)
   - lecture des points (blocs GPS1 du fichier .sus v3)
   - trace : projection locale en mètres, distance (intégrée de la vitesse
     Doppler, plus juste que la somme des positions), altitude lissée
   - carte hors ligne (canvas, sans fond de carte : le Wi-Fi du boîtier n'a
     pas internet), colorée par une grandeur, synchronisée avec les courbes
   - chrono de spéciale : portes de départ / arrivée / intermédiaires
   - comparaison de deux runs sur la distance (gain / perte de temps)
   - export GPX
   ===================================================================== */

const GPS_FIX_MIN = 2;                    // points 2D ou 3D
const GATE_HALF_M = 15;                   // demi-largeur d'une porte de chrono (m)

/* ---------------------------------------------------------------- lecture */
function parseGpsRecords(buf, spans, hdr) {
  const dv = new DataView(buf);
  let n = 0;
  for (const [, c] of spans) n += c;
  const G = {
    n, t: new Float64Array(n), lat: new Float64Array(n), lon: new Float64Array(n), alt: new Float32Array(n),
    spd: new Float32Array(n), head: new Float32Array(n), hacc: new Float32Array(n), vacc: new Float32Array(n),
    vdown: new Float32Array(n), sats: new Uint8Array(n), fix: new Uint8Array(n), pps: new Uint8Array(n), tod: new Float64Array(n),
  };
  let i = 0;
  for (const [p, c] of spans) for (let k = 0; k < c; k++, i++) {
    const o = p + 8 + k * 32;
    G.t[i] = dv.getUint32(o, true) / 1e6;
    G.lat[i] = dv.getInt32(o + 4, true) * 1e-7;
    G.lon[i] = dv.getInt32(o + 8, true) * 1e-7;
    G.alt[i] = dv.getInt32(o + 12, true) / 1000;
    G.spd[i] = dv.getUint16(o + 16, true) / 100;
    G.head[i] = dv.getUint16(o + 18, true) / 100;
    const ha = dv.getUint16(o + 20, true), va = dv.getUint16(o + 22, true);
    G.hacc[i] = ha >= 65535 ? NaN : ha / 100;
    G.vacc[i] = va >= 65535 ? NaN : va / 100;
    G.vdown[i] = dv.getInt16(o + 24, true) / 100;
    G.sats[i] = dv.getUint8(o + 26);
    const fl = dv.getUint8(o + 27);
    G.fix[i] = fl & 3;
    G.pps[i] = fl & 0x40 ? 1 : 0;
    G.tod[i] = dv.getUint32(o + 28, true);
  }
  return G;
}

/* ---------------------------------------------------------------- trace */
const geo = {
  /** mètres par degré à la latitude lat0 */
  k(lat0) { return [111320 * Math.cos(lat0 * Math.PI / 180), 110540]; },
};

/** Trace exploitable : points avec fix, positions locales (m), distance, altitude lissée, grille régulière 10 Hz. */
function buildGps(P, run) {
  const R = run.gps;
  if (!R || R.n < 10) return null;
  const idx = [];
  for (let i = 0; i < R.n; i++) if (R.fix[i] >= GPS_FIX_MIN && R.t[i] >= run.t[0] - 1 && R.t[i] <= run.t[run.n - 1] + 1) idx.push(i);
  if (idx.length < 10) return { none: true, total: R.n };
  const t0 = run.t[0], m = idx.length;
  const lat0 = R.lat[idx[0]], lon0 = R.lon[idx[0]], [kx, ky] = geo.k(lat0);
  const pt = { tod: new Float64Array(m), t: new Float64Array(m), x: new Float32Array(m), y: new Float32Array(m), alt: new Float32Array(m), spd: new Float32Array(m), hacc: new Float32Array(m), lat: new Float64Array(m), lon: new Float64Array(m) };
  let pps = 0;
  idx.forEach((i, j) => {
    pt.t[j] = R.t[i] - t0;
    pt.tod[j] = R.tod[i];
    pt.lat[j] = R.lat[i]; pt.lon[j] = R.lon[i];
    pt.x[j] = (R.lon[i] - lon0) * kx; pt.y[j] = (R.lat[i] - lat0) * ky;
    pt.alt[j] = R.alt[i]; pt.spd[j] = R.spd[i]; pt.hacc[j] = R.hacc[i];
    pps += R.pps[i];
  });
  // grille régulière (pas de 0,1 s) sur toute la durée du run, pour les courbes et la synchronisation
  const dt = 0.1, N = Math.max(2, Math.floor(P.duration / dt) + 1);
  const rs = a => resample(pt.t, a, 0, dt, N);
  const spd = rs(pt.spd), x = rs(pt.x), y = rs(pt.y), altRaw = rs(pt.alt);
  const covered = new Uint8Array(N);                    // la grille a-t-elle des points GPS à moins de 1,5 s ?
  for (let k = 0, j = 0; k < N; k++) {
    const tk = k * dt;
    while (j < m - 1 && pt.t[j + 1] <= tk) j++;
    const near = Math.min(Math.abs(pt.t[j] - tk), j + 1 < m ? Math.abs(pt.t[j + 1] - tk) : 1e9);
    covered[k] = near < 1.5 ? 1 : 0;
  }
  for (let k = 0; k < N; k++) if (!covered[k]) spd[k] = 0;
  const alt = movAvg(altRaw, 31);                        // altitude lissée sur 3 s (le GPS est bruité en vertical)
  const dist = new Float32Array(N), kmh = new Float32Array(N);
  for (let k = 1; k < N; k++) dist[k] = dist[k - 1] + (spd[k] + spd[k - 1]) / 2 * dt;
  for (let k = 0; k < N; k++) kmh[k] = spd[k] * 3.6;
  const hz = m > 1 ? (m - 1) / (pt.t[m - 1] - pt.t[0] || 1) : 0;
  const haccMed = median(Array.from(pt.hacc).filter(v => isFinite(v)));
  return { pt, m, dt, N, x, y, alt, spd, kmh, dist, covered, lat0, lon0, kx, ky, hz, ppsShare: pps / m, haccMed, total: R.n, hdr: P.hdr.gps || {} };
}

/** Indicateurs GPS sur une fenêtre de la grille des potentiomètres. */
function computeGps(P, i0, i1) {
  const G = P.gps;
  if (!G || G.none) return null;
  const k0 = clamp(Math.floor(i0 * P.dt / G.dt), 0, G.N - 1), k1 = clamp(Math.ceil(i1 * P.dt / G.dt), k0 + 1, G.N);
  let vmax = 0, mv = 0, nMov = 0, up = 0, down = 0, ref = null;
  for (let k = k0; k < k1; k++) {
    if (!G.covered[k]) continue;
    vmax = Math.max(vmax, G.kmh[k]);
    if (G.spd[k] > 1.5) { mv += G.kmh[k]; nMov++; }
    // dénivelé par paliers de 2 m : sinon le bruit d'altitude s'additionne (des dizaines de mètres sur du plat)
    if (ref == null) ref = G.alt[k];
    const d = G.alt[k] - ref;
    if (d >= 2) { up += d; ref = G.alt[k]; } else if (d <= -2) { down -= d; ref = G.alt[k]; }
  }
  const dist = G.dist[k1 - 1] - G.dist[k0];
  // distribution des vitesses (temps en mouvement, pas de 5 km/h)
  const bin = 5, nb = Math.max(4, Math.ceil(Math.max(vmax, 20) / bin)), h = new Float32Array(nb);
  for (let k = k0; k < k1; k++) if (G.covered[k] && G.spd[k] > 1.5) h[Math.min(nb - 1, Math.floor(G.kmh[k] / bin))]++;
  if (nMov) for (let b = 0; b < nb; b++) h[b] = h[b] / nMov * 100;
  return { k0, k1, dist, vmax, vavg: nMov ? mv / nMov : NaN, up, down, drop: G.alt[k0] - G.alt[k1 - 1], movSec: nMov * G.dt, speedHist: { h, bin, nb } };
}

/* ---------------------------------------------------------------- portes de chrono */
/** Porte (lat, lon, cap du passage en degrés) -> segment local de la trace (m) : perpendiculaire au cap. */
function gateSeg(G, gate) {
  const cx = (gate.lon - G.lon0) * G.kx, cy = (gate.lat - G.lat0) * G.ky, h = gate.head * Math.PI / 180;
  const dx = Math.sin(h), dy = Math.cos(h);                      // direction du passage (nord = cap 0)
  return { a: [cx - dy * GATE_HALF_M, cy + dx * GATE_HALF_M], b: [cx + dy * GATE_HALF_M, cy - dx * GATE_HALF_M], dir: [dx, dy], c: [cx, cy] };
}

/** Instants (s) où la trace franchit la porte dans le bon sens. */
function gateCrossings(G, gate) {
  const s = gateSeg(G, gate), out = [], P = G.pt;
  for (let j = 1; j < G.m; j++) {
    const p = [P.x[j - 1], P.y[j - 1]], q = [P.x[j], P.y[j]];
    const d = [q[0] - p[0], q[1] - p[1]];
    if (d[0] * s.dir[0] + d[1] * s.dir[1] <= 0) continue;          // mauvais sens
    const e = [s.b[0] - s.a[0], s.b[1] - s.a[1]], den = d[0] * e[1] - d[1] * e[0];
    if (Math.abs(den) < 1e-9) continue;
    const w = [s.a[0] - p[0], s.a[1] - p[1]];
    const u = (w[0] * e[1] - w[1] * e[0]) / den, v = (w[0] * d[1] - w[1] * d[0]) / den;
    if (u >= 0 && u <= 1 && v >= 0 && v <= 1) out.push(P.t[j - 1] + u * (P.t[j] - P.t[j - 1]));
  }
  return out;
}

/** Porte au point de la trace le plus proche de l'instant t (cap = direction du déplacement). */
function gateAt(G, t) {
  const P = G.pt;
  let j = 0;
  while (j < G.m - 1 && P.t[j + 1] <= t) j++;
  const a = Math.max(0, j - 3), b = Math.min(G.m - 1, j + 3);
  const dx = P.x[b] - P.x[a], dy = P.y[b] - P.y[a];
  if (Math.hypot(dx, dy) < 2) return null;                       // à l'arrêt : cap indéfini
  return { lat: P.lat[j], lon: P.lon[j], head: (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360 };
}

/** Chrono d'une piste sur un run : départ, intermédiaires et arrivée franchis dans l'ordre. */
function stageTimes(G, track) {
  if (!G || G.none || !track.start || !track.finish) return null;
  const st = gateCrossings(G, track.start), fi = gateCrossings(G, track.finish);
  const sp = (track.splits || []).map(g => gateCrossings(G, g));
  const out = [];
  for (const t0 of st) {
    const t1 = fi.find(t => t > t0);
    if (t1 == null) continue;
    if (st.some(x => x > t0 && x < t1)) continue;                 // seul le dernier passage du départ avant l'arrivée compte (attente près de la porte)
    let prev = t0;
    const splits = sp.map(list => { const t = list.find(x => x > prev && x < t1); if (t != null) prev = t; return t == null ? null : t - t0; });
    out.push({ t0, t1, time: t1 - t0, splits });
  }
  return out.length ? out : null;
}

/* ---------------------------------------------------------------- pistes enregistrées */
const TRACKS = { list: null, loading: null };

async function loadTracks() {
  if (TRACKS.list) return TRACKS.list;
  if (!TRACKS.loading) TRACKS.loading = (async () => {
    let list = null;
    try { list = await api('/api/tracks', { timeout: 6000 }); } catch (e) { /* hors ligne ou démo */ }
    if (!Array.isArray(list)) list = store.get('tracks', []);
    TRACKS.list = Array.isArray(list) ? list : [];
    return TRACKS.list;
  })();
  return TRACKS.loading;
}

async function saveTracks() {
  store.set('tracks', TRACKS.list);
  try { await api('/api/tracks', { method: 'POST', body: JSON.stringify(TRACKS.list), timeout: 8000 }); return true; }
  catch (e) { return false; }                                     // gardé sur cet appareil
}

/* ---------------------------------------------------------------- comparaison sur la distance */
/** Abscisse curviligne de la trace A (m) pour chaque point de B, en avançant le long de A. */
function projectOnTrack(A, B) {
  // trace de A lissée sur 5 points (0,5 s) : le bruit de position allongerait la distance
  const PA = { x: movAvg(A.pt.x, 5), y: movAvg(A.pt.y, 5) }, sA = new Float64Array(A.m);
  for (let j = 1; j < A.m; j++) sA[j] = sA[j - 1] + Math.hypot(PA.x[j] - PA.x[j - 1], PA.y[j] - PA.y[j - 1]);
  const bx = k => (B.pt.lon[k] - A.lon0) * A.kx, by = k => (B.pt.lat[k] - A.lat0) * A.ky;
  const out = new Float64Array(B.m).fill(NaN);
  let j0 = 0, found = false;
  for (let k = 0; k < B.m; k++) {
    const x = bx(k), y = by(k);
    let best = Infinity, bs = NaN, bj = j0;
    const lo = found ? Math.max(0, j0 - 20) : 0, hi = found ? Math.min(A.m - 1, j0 + 120) : A.m - 1;
    for (let j = Math.max(1, lo); j <= hi; j++) {
      const ax = PA.x[j - 1], ay = PA.y[j - 1], ex = PA.x[j] - ax, ey = PA.y[j] - ay, L2 = ex * ex + ey * ey;
      const u = L2 > 0 ? clamp(((x - ax) * ex + (y - ay) * ey) / L2, 0, 1) : 0;
      const d = Math.hypot(x - ax - u * ex, y - ay - u * ey);
      if (d < best) { best = d; bs = sA[j - 1] + u * Math.sqrt(L2); bj = j; }
    }
    if (best < 25) { out[k] = bs; j0 = bj; found = true; }
  }
  return { sB: out, sA };
}

/** Instant où une courbe monotone s(t) atteint la valeur s (interpolation). */
function tAtS(t, s, target, from) {
  for (let j = Math.max(1, from || 1); j < s.length; j++) {
    if (!(s[j] >= target)) continue;
    if (!isFinite(s[j - 1])) return t[j];
    const f = s[j] > s[j - 1] ? (target - s[j - 1]) / (s[j] - s[j - 1]) : 0;
    return t[j - 1] + clamp(f, 0, 1) * (t[j] - t[j - 1]);
  }
  return NaN;
}

/**
 * Deux runs de la même piste recalés sur la distance de A : temps de chacun depuis le début de la portion
 * commune, écart B − A, et indices de chaque run pour échantillonner leurs courbes au même endroit.
 * win = [[tA0, tA1], [tB0, tB1]] : portions à comparer (descentes ou spéciale).
 */
function alignByDistance(PA, PB, win, step = 2) {
  const A = PA.gps, B = PB.gps;
  if (!A || !B || A.none || B.none) return null;
  const { sB, sA } = projectOnTrack(A, B);
  // s(t) de A (abscisse de A sur sa propre trace) et de B (projeté), rendus croissants
  const mono = s => { const o = Float64Array.from(s); let m = -Infinity; for (let i = 0; i < o.length; i++) { if (isFinite(o[i])) { m = Math.max(m, o[i]); o[i] = m; } } return o; };
  const sAt = mono(sA), sBt = mono(sB);
  const sOf = (t, tt, ss) => { let j = 0; while (j < tt.length - 1 && tt[j + 1] <= t) j++; return ss[j]; };
  const s0 = Math.max(sOf(win[0][0], A.pt.t, sAt), sOf(win[1][0], B.pt.t, sBt));
  const s1 = Math.min(sOf(win[0][1], A.pt.t, sAt), sOf(win[1][1], B.pt.t, sBt));
  if (!(s1 - s0 > 50)) return null;
  const K = Math.floor((s1 - s0) / step) + 1;
  const tA = new Float64Array(K), tB = new Float64Array(K);
  for (let k = 0; k < K; k++) {
    const s = s0 + k * step;
    tA[k] = tAtS(A.pt.t, sAt, s);
    tB[k] = tAtS(B.pt.t, sBt, s);
  }
  for (const arr of [tA, tB]) for (let k = 1; k < K; k++) if (!isFinite(arr[k])) arr[k] = arr[k - 1];
  const delta = new Float32Array(K);
  for (let k = 0; k < K; k++) delta[k] = (tB[k] - tB[0]) - (tA[k] - tA[0]);
  return { s0, s1, step, K, tA, tB, delta, total: [tA[K - 1] - tA[0], tB[K - 1] - tB[0]] };
}

/** Valeur d'une grille régulière (dt) à l'instant t. */
const gridAt = (arr, dt, t) => arr[clamp(Math.round(t / dt), 0, arr.length - 1)];

/* ---------------------------------------------------------------- export GPX */
function gpxOf(P, name) {
  const G = P.gps, R = G.pt, hdr = P.hdr;
  let day = null;
  if (hdr.epoch) {
    const utc = (hdr.epoch - (hdr.tz_min || 0) * 60) * 1000;
    const d = new Date(utc);
    day = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const tod = R.tod;
  const pts = [];
  for (let j = 0; j < G.m; j++) {
    let time = '';
    if (day != null && tod) time = `<time>${new Date(day + tod[j]).toISOString()}</time>`;
    pts.push(`<trkpt lat="${R.lat[j].toFixed(7)}" lon="${R.lon[j].toFixed(7)}"><ele>${R.alt[j].toFixed(1)}</ele>${time}<extensions><speed>${R.spd[j].toFixed(2)}</speed></extensions></trkpt>`);
  }
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="SuspLogger V11" xmlns="http://www.topografix.com/GPX/1/1">
<trk><name>${esc(name)}</name><trkseg>
${pts.join('\n')}
</trkseg></trk></gpx>
`;
}

/* ---------------------------------------------------------------- carte (canvas) */
const MAP_COLOR_KEYS = [['kmh', 'Vitesse'], ['brake', 'Freinage'], ['fork', 'Course fourche'], ['shock', 'Course amortisseur'], ['alt', 'Altitude']];

class MapChart {
  /** o : { G, sync, values: Float32Array sur la grille G (ou null), lo, hi, unit, gates:[{seg,label,color}], onPick(t) } */
  constructor(host, o) {
    this.o = Object.assign({ height: 340 }, o);
    host.classList.add('cwrap', 'mapwrap');
    host.innerHTML = '';
    this.cv = document.createElement('canvas');
    host.appendChild(this.cv);
    this.tip = document.createElement('div');
    this.tip.className = 'tip hidden';
    host.appendChild(this.tip);
    this.view = null;                                               // zoom / déplacement de la carte
    if (o.sync) o.sync.charts.push(this);
    this.bind();
  }

  frame(w, h) {
    const G = this.o.G;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let j = 0; j < G.m; j++) { const x = G.pt.x[j], y = G.pt.y[j]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const pad = 16, sc = Math.min((w - 2 * pad) / Math.max(10, x1 - x0), (h - 2 * pad) / Math.max(10, y1 - y0));
    const base = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, sc };
    const v = this.view || base;
    return { X: x => w / 2 + (x - v.cx) * v.sc, Y: y => h / 2 - (y - v.cy) * v.sc, base, v };
  }

  colorAt(k) {
    const o = this.o, col = chartColors();
    if (!o.values) return col.s3;
    const f = clamp((o.values[k] - o.lo) / ((o.hi - o.lo) || 1), 0, 1);
    // dégradé multicolore : bleu (bas) -> cyan -> vert -> jaune -> rouge (haut), comme la légende (--heat0 à --heat4 de style.css)
    const hue = 240 - 240 * f, L = isDarkUI() ? 60 : 47;
    return `hsl(${hue.toFixed(0)},90%,${L}%)`;
  }

  draw() {
    const o = this.o, G = o.G, s = o.sync, col = chartColors();
    if (!this.cv.clientWidth) return;
    const { ctx, w, h } = fitCanvas(this.cv, o.height);
    ctx.clearRect(0, 0, w, h);
    const { X, Y, v } = this.frame(w, h);
    this.fr = { X, Y, v, w, h };
    // échelle
    const m = niceTicks(0, 120 / v.sc, 1).step || 50;
    ctx.strokeStyle = col.muted; ctx.lineWidth = 2; ctx.font = '11px system-ui, sans-serif'; ctx.fillStyle = col.muted;
    ctx.beginPath(); ctx.moveTo(12, h - 12); ctx.lineTo(12 + m * v.sc, h - 12); ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(fmt(m, 0) + ' m', 12, h - 16);
    ctx.textAlign = 'right'; ctx.fillText('N ↑', w - 10, 18);
    // trace complète (fine), puis portion de la fenêtre des courbes (épaisse, colorée)
    const tA = s ? s.t0 : 0, tB = s ? s.t1 : Infinity;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = col.grid; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k < G.N; k++) { if (!G.covered[k]) continue; const x = X(G.x[k]), y = Y(G.y[k]); if (k && G.covered[k - 1]) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
    ctx.stroke();
    ctx.lineWidth = 4;
    const ka = clamp(Math.floor(tA / G.dt), 1, G.N - 1), kb = clamp(Math.ceil(tB / G.dt), 1, G.N - 1);
    for (let k = ka; k <= kb; k++) {
      if (!G.covered[k] || !G.covered[k - 1]) continue;
      ctx.strokeStyle = this.colorAt(k);
      ctx.beginPath(); ctx.moveTo(X(G.x[k - 1]), Y(G.y[k - 1])); ctx.lineTo(X(G.x[k]), Y(G.y[k])); ctx.stroke();
    }
    // portes de chrono
    for (const g of o.gates || []) {
      const sg = g.seg;
      ctx.strokeStyle = col[g.color] || g.color || col.ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(X(sg.a[0]), Y(sg.a[1])); ctx.lineTo(X(sg.b[0]), Y(sg.b[1])); ctx.stroke();
      ctx.fillStyle = col.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(g.label, X(sg.b[0]) + 4, Y(sg.b[1]) - 2);
    }
    // départ / fin de la trace
    const dot = (k, c) => { ctx.beginPath(); ctx.arc(X(G.x[k]), Y(G.y[k]), 5, 0, 6.2832); ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = col.surface; ctx.stroke(); };
    let kFirst = 0, kLast = G.N - 1;
    while (kFirst < G.N - 1 && !G.covered[kFirst]) kFirst++;
    while (kLast > 0 && !G.covered[kLast]) kLast--;
    dot(kFirst, col.ok || '#2a9d5c'); dot(kLast, col.crit);
    // curseur
    if (s && s.hoverT != null) {
      const k = clamp(Math.round(s.hoverT / G.dt), 0, G.N - 1);
      if (G.covered[k]) {
        ctx.beginPath(); ctx.arc(X(G.x[k]), Y(G.y[k]), 7, 0, 6.2832);
        ctx.fillStyle = col.ink; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = col.surface; ctx.stroke();
      }
    }
  }

  nearestT(cx, cy) {
    const fr = this.fr, G = this.o.G;
    if (!fr) return null;
    const r = this.cv.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
    let best = Infinity, bk = -1;
    for (let k = 0; k < G.N; k++) {
      if (!G.covered[k]) continue;
      const d = Math.hypot(fr.X(G.x[k]) - px, fr.Y(G.y[k]) - py);
      if (d < best) { best = d; bk = k; }
    }
    return best < 30 ? bk * G.dt : null;
  }

  bind() {
    const cv = this.cv;
    let drag = null;
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, moved: false, v: this.fr ? Object.assign({}, this.fr.v) : null }; });
    cv.addEventListener('pointermove', e => {
      if (drag && drag.v && (e.pointerType !== 'mouse' || e.buttons)) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.hypot(dx, dy) > 4) drag.moved = true;
        if (drag.moved) { this.view = { cx: drag.v.cx - dx / drag.v.sc, cy: drag.v.cy + dy / drag.v.sc, sc: drag.v.sc }; this.draw(); return; }
      }
      const t = this.nearestT(e.clientX, e.clientY);
      if (this.o.sync && t != null) this.o.sync.hover(t, this);
    });
    cv.addEventListener('pointerup', e => {
      if (drag && !drag.moved) { const t = this.nearestT(e.clientX, e.clientY); if (t != null && this.o.onPick) this.o.onPick(t); }
      drag = null;
    });
    cv.addEventListener('wheel', e => {
      if (!(e.ctrlKey || e.metaKey) || !this.fr) return;
      e.preventDefault();
      const v = this.fr.v, f = e.deltaY > 0 ? 0.8 : 1.25;
      this.view = { cx: v.cx, cy: v.cy, sc: clamp(v.sc * f, this.fr.v.sc / 50, this.fr.v.sc * 50) };
      this.draw();
    }, { passive: false });
    cv.addEventListener('dblclick', () => { this.view = null; this.draw(); });
  }

  zoom(f) {
    if (!this.fr) return;
    const v = this.fr.v;
    this.view = { cx: v.cx, cy: v.cy, sc: v.sc * f };
    this.draw();
  }
}

/** Valeurs de la carte (sur la grille G) pour la grandeur choisie : { values, lo, hi, unit }. */
function mapValues(P, key) {
  const G = P.gps, out = new Float32Array(G.N);
  const at = (arr, dt) => { for (let k = 0; k < G.N; k++) out[k] = gridAt(arr, dt, k * G.dt); };
  if (key === 'kmh') {
    // échelle sur les vitesses en mouvement (5 % → 98 %) : le dégradé couvre toute la plage roulée, pas les arrêts
    out.set(G.kmh);
    const mv = [];
    for (let k = 0; k < G.N; k++) if (G.covered[k] && G.kmh[k] > 4) mv.push(G.kmh[k]);
    mv.sort((a, b) => a - b);
    const q = f => mv.length ? mv[Math.min(mv.length - 1, Math.floor(f * mv.length))] : 0;
    const hi = Math.max(20, q(0.98)), lo = Math.max(0, Math.min(Math.floor(q(0.05)), hi - 10));
    return { values: out, lo, hi, unit: 'km/h' };
  }
  if (key === 'alt') { out.set(G.alt); let lo = Infinity, hi = -Infinity; for (let k = 0; k < G.N; k++) if (G.covered[k]) { lo = Math.min(lo, G.alt[k]); hi = Math.max(hi, G.alt[k]); } return { values: out, lo, hi, unit: 'm' }; }
  if (key === 'brake' && P.brake && P.brake.any) {
    const B = P.brake;
    for (let k = 0; k < G.N; k++) { const i = clamp(Math.round(k * G.dt / P.dt), 0, P.N - 1); out[k] = Math.max(B.has[0] ? B.pct[0][i] : 0, B.has[1] ? B.pct[1][i] : 0); }
    return { values: out, lo: 0, hi: 100, unit: '% levier' };
  }
  const c = key === 'shock' ? 1 : 0;
  if ((key === 'fork' || key === 'shock') && P.has[c]) { at(P.pct[c], P.dt); return { values: out, lo: 0, hi: 100, unit: '% course' }; }
  return { values: null, lo: 0, hi: 1, unit: '' };
}

<script>
'use strict';
/* =====================================================================
   Capteurs de frein (effet Hall analogique)
   - conversion en % de levier : calibration « relâché / serré » faite dans
     l'onglet Réglages, sinon automatique sur le run (position la plus
     fréquente = relâché, extrême opposé = serré)
   - freinages, répartition avant / arrière, freinage dans les chocs et en
     l'air, plongée de la fourche et efficacité (avec la centrale et le GPS)
   - diagnostic : recommandations de réglage (LSC, progressivité) et
     observations de pilotage
   ===================================================================== */
const BRAKE_LABEL = ['Frein avant', 'Frein arrière'];
const BRAKE_COLOR = ['s4', 's5'];
const BRAKE_ON = 10, BRAKE_OFF = 5;            // seuils d'un freinage (% de levier, hystérésis)

/** Signaux de frein sur la grille des potentiomètres (P.dt). */
function buildBrakes(P, run) {
  const fl = chanFlags(P.hdr), has = [false, false], pct = [null, null], cal = [null, null], note = [null, null];
  for (let b = 0; b < 2; b++) {
    if (!fl.brake[b] || !run.raw[2 + b]) continue;
    const r = run.raw[2 + b], n = run.n, ch = P.hdr.ch[2 + b] || {};
    let rel = ch.rel, pull = ch.pull, how = 'calibrée';
    // rel ou pull à null (« relâché » calibré seul) : isFinite(null) vaut true, d'où le test explicite
    if (!(rel != null && pull != null && isFinite(rel) && isFinite(pull) && Math.abs(pull - rel) > 60)) {
      const s = sortedSample(r, 0, n, 100000);
      const lo = quant(s, 0.003), hi = quant(s, 0.997);
      // levier relâché = position la plus fréquente (mode d'un histogramme de 40 classes), pas la médiane :
      // un frein traîné plus de la moitié du run décalerait le zéro dans la zone serrée
      const w = (hi - lo) / 40 || 1, hst = new Uint32Array(40), sum = new Float64Array(40);
      for (let i = 0; i < s.length; i++) { const k = clamp(Math.floor((s[i] - lo) / w), 0, 39); hst[k]++; sum[k] += s[i]; }
      let bi = 0;
      for (let k = 1; k < 40; k++) if (hst[k] > hst[bi]) bi = k;
      rel = sum[bi] / hst[bi];
      pull = hi - rel > rel - lo ? hi : lo;
      how = 'auto';
      if (Math.abs(pull - rel) < 60) { note[b] = 'aucun mouvement de levier détecté (aimant, câble ?)'; continue; }
    }
    const k = 100 / (pull - rel), y = new Float32Array(n);
    for (let i = 0; i < n; i++) y[i] = clamp((r[i] - rel) * k, -5, 120);
    pct[b] = resample(run.t, y, run.t[0], P.dt, P.N);
    has[b] = true;
    cal[b] = how;
  }
  if (!fl.brake[0] && !fl.brake[1]) return null;
  return { has, pct, cal, note, any: has[0] || has[1] };
}

/** Intervalles de freinage [i0, i1) d'un signal en % (hystérésis), durée minimale 0,1 s. */
function brakeEvents(x, i0, i1, dt) {
  const ev = [];
  let st = -1;
  for (let i = i0; i <= i1; i++) {
    const v = i < i1 ? x[i] : 0;
    if (st < 0 && v >= BRAKE_ON) st = i;
    else if (st >= 0 && v < BRAKE_OFF) { if ((i - st) * dt >= 0.1) ev.push([st, i]); st = -1; }
  }
  return ev;
}

/** Indicateurs de freinage sur une fenêtre [i0, i1) de la grille des potentiomètres. */
function computeBrakes(P, prm, i0, i1, M) {
  const B = P.brake;
  if (!B || !B.any) return null;
  const dt = P.dt, n = i1 - i0, I = P.imu;
  const mask = I ? ridingMaskPot(P) : null;
  let nRide = 0;
  for (let i = i0; i < i1; i++) if (!mask || mask[i]) nRide++;
  const R = { per: [null, null], nRide };
  const airAt = new Uint8Array(P.N);
  if (I) I.air.forEach(([a, b]) => { for (let k = Math.floor(a * I.dt / dt); k <= Math.min(P.N - 1, Math.ceil(b * I.dt / dt)); k++) airAt[k] = 1; });
  const forkVel = P.has[0] ? P.vel[0] : null;
  const stopAt = t => !!I && I.seg.segs.some(s => (s.type === 'stop' || s.type === 'crash') && t >= s.t0 && t < s.t1);

  for (let b = 0; b < 2; b++) {
    if (!B.has[b]) continue;
    const x = B.pct[b];
    const ev = brakeEvents(x, i0, i1, dt).filter(([a]) => !stopAt(a * dt));   // temps roulé : pas le levier tenu à l'arrêt (les vols restent comptés)
    let on = 0, sum = 0, mx = 0;
    const hist = new Float32Array(10);
    for (let i = i0; i < i1; i++) {
      if (mask && !mask[i]) continue;
      if (x[i] >= BRAKE_ON) { on++; sum += x[i]; hist[Math.min(9, Math.floor(x[i] / 10))]++; }
      if (x[i] > mx) mx = x[i];
    }
    if (on) for (let k = 0; k < 10; k++) hist[k] = hist[k] / on * 100;
    let air = 0, drag = 0;
    const events = ev.map(([a, c]) => {
      let pk = 0, m = 0, inAir = false;
      for (let i = a; i < c; i++) { pk = Math.max(pk, x[i]); m += x[i]; if (airAt[i]) inAir = true; }
      const e = { t: a * dt, dur: (c - a) * dt, peak: pk, mean: m / (c - a), air: inAir };
      if (inAir) air++;
      if (e.dur > 2 && e.mean < 30) drag++;
      return e;
    });
    R.per[b] = {
      events, n: events.length, perMin: nRide ? events.length / (nRide * dt / 60) : NaN,
      share: nRide ? on / nRide * 100 : 0, meanOn: on ? sum / on : NaN, max: mx, hist, air, drag,
      longest: events.reduce((m, e) => Math.max(m, e.dur), 0),
    };
  }

  // répartition avant / arrière (« travail » de freinage : somme des % de levier)
  if (B.has[0] && B.has[1]) {
    let f = 0, r = 0, both = 0, onlyF = 0, onlyR = 0, any = 0;
    for (let i = i0; i < i1; i++) {
      if (mask && !mask[i]) continue;
      const a = B.pct[0][i], c = B.pct[1][i], fa = a >= BRAKE_ON, ra = c >= BRAKE_ON;
      if (fa) f += a;
      if (ra) r += c;
      if (fa || ra) { any++; if (fa && ra) both++; else if (fa) onlyF++; else onlyR++; }
    }
    R.frontShare = f + r > 0 ? f / (f + r) * 100 : NaN;
    R.bothShare = any ? both / any * 100 : NaN;
    R.onlyFront = any ? onlyF / any * 100 : NaN;
    R.onlyRear = any ? onlyR / any * 100 : NaN;
    // qui freine en premier : écart moyen des débuts de freinage proches (< 0,6 s)
    const ef = R.per[0].events, er = R.per[1].events, lags = [];
    ef.forEach(e => { const q = er.find(r2 => Math.abs(r2.t - e.t) < 0.6); if (q) lags.push(q.t - e.t); });
    R.leadMs = lags.length >= 3 ? median(lags) * 1000 : NaN;
  }

  // freinage dans les chocs : part des gros impacts de la fourche qui arrivent frein avant serré
  if (B.has[0] && forkVel) {
    let hits = 0, hitsOn = 0, armed = true;
    for (let i = i0; i < i1; i++) {
      const v = forkVel[i];
      if (armed && v >= prm.hitVel) { hits++; if (B.pct[0][i] >= BRAKE_ON) hitsOn++; armed = false; }
      else if (!armed && v < prm.hitVel * 0.4) armed = true;
    }
    R.hitsOnBrake = hits >= 5 ? hitsOn / hits * 100 : NaN;
    R.hits = hits;
  }

  // plongée de la fourche sous freinage avant (pts de course) et efficacité (avec la centrale)
  if (B.has[0] && P.has[0]) {
    const fe = R.per[0].events.filter(e => e.dur >= 0.3 && !e.air), dives = [], decels = [], effs = [], divesG = [];
    const pm = (ta, tb) => { const a = clamp(Math.round(ta / dt), 0, P.N - 1), c = clamp(Math.round(tb / dt), a + 1, P.N); let s = 0; for (let k = a; k < c; k++) s += P.pct[0][k]; return s / (c - a); };
    fe.forEach(e => {
      const d = pm(e.t + 0.1, e.t + e.dur) - pm(Math.max(0, e.t - 0.5), Math.max(0.05, e.t - 0.05));
      dives.push(d);
      if (I) {
        const ka = Math.floor((e.t + 0.1) / I.dt), kb = Math.min(I.N, Math.ceil((e.t + e.dur) / I.dt));
        let mn = 0;
        for (let k = ka; k < kb; k++) mn = Math.min(mn, I.aLongLp[k]);
        if (mn < -0.05) { decels.push(-mn); effs.push(-mn / Math.max(10, e.peak) * 100); divesG.push(d); }   // plongée et décélération du même freinage
      }
    });
    R.dives = dives;
    R.diveMed = median(dives);
    R.decelMed = median(decels);
    R.divePer01 = decels.length >= 3 ? (divesG.reduce((s, v) => s + v, 0) / decels.reduce((s, v) => s + v, 0)) * 0.1 : NaN;
    R.effMed = median(effs);                               // g de décélération pour 100 % de levier
    R.nDive = dives.length;
  }

  // amortisseur pendant le freinage arrière seul (anti-cabrage / affaissement)
  if (B.has[1] && P.has[1]) {
    const re = R.per[1].events.filter(e => e.dur >= 0.4 && !e.air && (!B.has[0] || maxIn(B.pct[0], e.t, e.dur, dt) < BRAKE_ON)), dd = [];
    const pm = (ta, tb) => { const a = clamp(Math.round(ta / dt), 0, P.N - 1), c = clamp(Math.round(tb / dt), a + 1, P.N); let s = 0; for (let k = a; k < c; k++) s += P.pct[1][k]; return s / (c - a); };
    re.forEach(e => dd.push(pm(e.t + 0.1, e.t + e.dur) - pm(Math.max(0, e.t - 0.5), Math.max(0.05, e.t - 0.05))));
    R.rearShockMed = median(dd);
    R.nRearOnly = dd.length;
  }

  // vitesse perdue par freinage (GPS)
  if (P.gps && !P.gps.none) {
    const G = P.gps, lost = [];
    const evs = [].concat(B.has[0] ? R.per[0].events : [], B.has[1] ? R.per[1].events : []).sort((a, b2) => a.t - b2.t);
    let last = -1;
    evs.forEach(e => {
      if (e.t < last) return;
      last = e.t + e.dur;
      const v0 = gridAt(G.kmh, G.dt, Math.max(0, e.t - 0.2)), v1 = gridAt(G.kmh, G.dt, e.t + e.dur);
      if (!gridAt(G.covered, G.dt, Math.max(0, e.t - 0.2)) || !gridAt(G.covered, G.dt, e.t + e.dur)) return;   // sans réception, la vitesse vaut 0
      if (v0 > 5) lost.push(v0 - v1);
    });
    R.speedLostMed = median(lost.filter(v => v > 0));
    R.nSpeed = lost.length;
  }
  return R;
}

function maxIn(x, t, dur, dt) {
  let m = 0;
  for (let i = Math.round(t / dt), e = Math.round((t + dur) / dt); i < e && i < x.length; i++) m = Math.max(m, x[i]);
  return m;
}

/* ---------------------------------------------------------------- diagnostic */
function diagnoseBrakes(P, M) {
  const out = [], R = M.brake, B = P.brake;
  if (!B) return out;
  const add = (sev, who, title, text, row) => out.push({ sev, who, title, text, row });
  const f = P.cfg.fork || {}, forkExt = f.chamber === 'ext';
  let autoSaid = false;
  for (let b = 0; b < 2; b++) {
    if (B.note && B.note[b]) add('warn', BRAKE_LABEL[b], 'Capteur sans signal', 'Le ' + BRAKE_LABEL[b].toLowerCase() + ' est déclaré utilisé mais ' + B.note[b] + '. Vérifier dans l\'onglet Réglages que la tension change quand le levier est serré.');
    if (B.has[b] && B.cal[b] === 'auto' && !autoSaid) { autoSaid = true; add('info', BRAKE_LABEL[b], 'Calibration automatique', 'Sans calibration « relâché / serré » (onglet Réglages), le levier relâché est la position la plus fréquente et le levier serré la plus extrême du run : sans serrage à fond pendant le run, les % sont surestimés.'); }
  }
  if (!R) return out;                                     // aucun frein exploitable : seulement les avertissements ci-dessus
  // observations seulement : un éventuel conseil (plongée au-delà de ce que donne le ressort) vient d'advice.js
  const AD = M.adviceDive;
  if (isFinite(R.divePer01) && R.nDive >= 3)
    add('info', 'Freinage', 'Plongée de la fourche au freinage : ' + fmt(R.divePer01, 1) + ' pts par 0,1 g', 'Mesuré sur ' + R.nDive + ' freinages avant (capteur de frein + centrale) : plongée médiane ' + fmt(R.diveMed, 0) + ' pts pour ' + fmt(R.decelMed, 2) + ' g.' + (AD ? ' Plongée attendue du seul ressort, d\'après le sag statique : ~' + fmt(AD.expct, 1) + ' pts par 0,1 g.' : '') + ' La LSC agit sur la vitesse de plongée ; la profondeur finale dépend du ressort.');
  else if (isFinite(R.diveMed) && R.nDive >= 3 && !P.imu)
    add('info', 'Freinage', 'Plongée médiane de ' + fmt(R.diveMed, 0) + ' pts au freinage avant', 'Sans centrale, la décélération n\'est pas connue : valeur à comparer entre deux runs seulement.');
  if (isFinite(R.hitsOnBrake) && R.hitsOnBrake > 45) add('info', 'Freinage', fmt(R.hitsOnBrake, 0) + ' % des gros chocs encaissés frein avant serré', 'Sur ' + R.hits + ' gros impacts de la fourche, la plupart arrivent pendant un freinage : la fourche est déjà enfoncée et encaisse moins bien. Freiner plus tôt, avant les zones cassantes, laisse la fourche travailler (conseil de pilotage, pas de réglage).');
  if (isFinite(R.rearShockMed) && R.nRearOnly >= 3 && R.rearShockMed < -8) add('info', 'Freinage', 'L\'arrière se détend au freinage arrière (' + fmt(R.rearShockMed, 0) + ' pts)', 'Sur ' + R.nRearOnly + ' freinages à l\'arrière seul, l\'amortisseur sort de sa course : effet normal de la cinématique (anti-cabrage), pas un défaut de réglage.');
  for (let b = 0; b < 2; b++) {
    const p = R.per[b];
    if (!p) continue;
    if (p.drag >= 3) add('info', BRAKE_LABEL[b], p.drag + ' freinages « traînants »', 'Plus de 2 s à moins de 30 % de levier : la suspension travaille alors en permanence enfoncée et les freins chauffent. Mieux vaut des freinages plus courts et plus francs.');
    if (b === 1 && p.air >= 2) add('info', 'Frein arrière', 'Freinage arrière en l\'air (' + p.air + ' fois)', 'Freiner l\'arrière en vol fait plonger le nez du vélo à la réception.');
  }
  if (isFinite(R.frontShare)) {
    if (R.frontShare < 40) add('info', 'Freinage', 'Freinage surtout à l\'arrière (avant ' + fmt(R.frontShare, 0) + ' %)', 'Le frein avant fait l\'essentiel de la décélération sur un vélo : l\'utiliser davantage raccourcit les freinages (et charge la fourche : la plongée au freinage devient alors un critère de réglage).');
    else add('ok', 'Freinage', 'Répartition avant / arrière : ' + fmt(R.frontShare, 0) + ' / ' + fmt(100 - R.frontShare, 0), 'Part de chaque frein dans le freinage (somme des % de levier).');
  }
  return out;
}

/* ---------------------------------------------------------------- carte de l'onglet Analyse */
function brakesCardHTML(P, M) {
  const R = M.brake;
  if (!R) return '';
  const cols = [0, 1].filter(b => R.per[b]);
  const row = (l, f, u, d = 0) => `<tr><td>${l}${u ? ' <span class="muted small">' + u + '</span>' : ''}</td>${cols.map(b => `<td>${f(R.per[b])}</td>`).join('')}</tr>`;
  const n = (v, d = 0) => isFinite(v) ? fmt(v, d) : '—';
  const tbl = `<div class="tblwrap" style="margin-top:8px"><table class="tbl tbl-mini"><tr><th></th>${cols.map(b => `<th><span class="sw ${b ? 'br' : 'bf'}"></span> ${BRAKE_LABEL[b]}</th>`).join('')}</tr>
    ${row('Freinages', p => p.n + (isFinite(p.perMin) ? ' <span class="muted small">(' + fmt(p.perMin, 1) + '/min)</span>' : ''))}
    ${row('Temps freiné', p => n(p.share) + ' %', '% du temps roulé')}
    ${row('Levier moyen / max', p => n(p.meanOn) + ' / ' + n(p.max) + ' %')}
    ${row('Plus long freinage', p => n(p.longest, 1) + ' s')}
    ${row('Freinages traînants', p => p.drag, '> 2 s à < 30 %')}
    ${row('En l\'air', p => p.air)}
    <tr><td>Calibration</td>${cols.map(b => `<td>${P.brake.cal[b] === 'calibrée' ? 'calibrée' : 'auto (sur le run)'}</td>`).join('')}</tr>
  </table></div>`;
  const m = [];
  if (isFinite(R.frontShare)) m.push(stat('Répartition avant / arrière', fmt(R.frontShare, 0) + ' / ' + fmt(100 - R.frontShare, 0), 'part du freinage'));
  if (isFinite(R.bothShare)) m.push(stat('Les deux freins ensemble', U(R.bothShare, '%'), 'du temps freiné'));
  if (isFinite(R.leadMs)) m.push(stat('Premier frein serré', Math.abs(R.leadMs) < 40 ? 'ensemble' : R.leadMs > 0 ? 'avant' : 'arrière', fmt(Math.abs(R.leadMs), 0) + ' ms d\'écart médian'));
  if (isFinite(R.diveMed)) m.push(stat('Plongée fourche au freinage', (R.diveMed > 0 ? '+' : '') + fmt(R.diveMed, 0) + '<small> pts</small>', 'médiane, ' + R.nDive + ' freinages avant'));
  if (isFinite(R.divePer01)) m.push(stat('Plongée par 0,1 g', fmt(R.divePer01, 1) + '<small> pts</small>', 'décélération médiane ' + fmt(R.decelMed, 2) + ' g'));
  if (isFinite(R.effMed)) m.push(stat('Efficacité du frein avant', fmt(R.effMed, 2) + '<small> g</small>', 'décélération à 100 % de levier'));
  if (isFinite(R.hitsOnBrake)) m.push(stat('Gros chocs frein avant serré', U(R.hitsOnBrake, '%'), R.hits + ' impacts > ' + App.prm.hitVel + ' mm/s'));
  if (isFinite(R.rearShockMed)) m.push(stat('Amortisseur au freinage arrière', (R.rearShockMed > 0 ? '+' : '') + fmt(R.rearShockMed, 0) + '<small> pts</small>', R.nRearOnly + ' freinages arrière seul'));
  if (isFinite(R.speedLostMed)) m.push(stat('Vitesse perdue par freinage', U(R.speedLostMed, 'km/h'), 'médiane (GPS)'));
  return `<h2>Freinage</h2>${tbl}<div class="metrics" style="margin-top:10px">${m.join('')}</div>
    <p class="muted small" style="margin:10px 0 0">Un freinage = levier au-delà de ${BRAKE_ON} % pendant au moins 0,1 s. Plongée = écart de course de la fourche entre le freinage et la demi-seconde qui le précède.</p>`;
}

const BRAKE_CMP_ROWS = [
  ['Freinages avant', R => R.per[0] ? R.per[0].n : NaN, '', 0], ['Freinages arrière', R => R.per[1] ? R.per[1].n : NaN, '', 0],
  ['Temps freiné (avant)', R => R.per[0] ? R.per[0].share : NaN, '%', 0], ['Temps freiné (arrière)', R => R.per[1] ? R.per[1].share : NaN, '%', 0],
  ['Part du frein avant', R => R.frontShare, '%', 0], ['Plongée fourche au freinage', R => R.diveMed, 'pts', 0],
  ['Plongée par 0,1 g', R => R.divePer01, 'pts', 1], ['Gros chocs frein avant serré', R => R.hitsOnBrake, '%', 0],
];
</script>
<script>
'use strict';
/* =====================================================================
   Moteur de conseils de réglage
   Un run donne AU PLUS un conseil principal (un seul réglage, avec son sens, son ampleur, son niveau de confiance
   et la mesure qui le justifie) et un réglage « à surveiller » (sens seulement). Quand les données ne suffisent
   pas, le moteur ne conseille rien et dit pourquoi.

   Étapes :
   1. adviceGate()    : données exploitables ? (course saisie, zéro, échelle, durée de descente, bruit, centrale)
   2. règles          : chaque règle produit un « constat » (finding) : symptôme, mesure, seuil, nombre
                        d'événements, écart au seuil rapporté à l'incertitude (z), leviers possibles dans l'ordre ;
   3. confiance       : min(qualité des données, nombre d'événements, écart au seuil) ; indices contradictoires
                        sur une même molette → confiance basse ; indices indépendants concordants → haute ;
   4. choix           : ordre fixe ressort → détente → compression → progressivité (RockShox, ShockWiz), puis
                        confiance et écart ; le premier levier réglable et sans danger donne le conseil.
   Références entre crochets : docs/audit_conseils_reglage.md §6. [H] = repère de départ à valider sur données
   réelles (voir le protocole du même document, §5).
   ===================================================================== */

const ADV = {
  minDescentS: 60,                       // descente analysée minimale (s) [H]
  conf: ['aucune', 'basse', 'moyenne', 'haute'],
  stage: { spring: 1, lsr: 2, hsr: 2, lsc: 3, hsc: 3, prog: 4 },
  stageName: ['', 'ressort', 'détente', 'compression', 'progressivité'],
  rate: { bottom: 0.75, top: 1.0, pack: 0.5 },   // événements par minute de descente au-delà desquels on conclut [H]
  minEvents: { bottom: 3, top: 3, pack: 3, landings: 4, brakes: 6 },
  maxUse: [75, 80],                      // course max sous laquelle la course est sous-utilisée (fourche, amortisseur) [P1]
  dynSag: [[10, 30], [20, 35]],          // sags dynamiques courants (praticiens, indicatif) [P1]
};
const KNOB_KEYS = ['spring', 'prog', 'hsc', 'lsc', 'hsr', 'lsr'];
const KNOB_DAMP = { hsc: ['Compression haute vitesse', 'HSC'], lsc: ['Compression basse vitesse', 'LSC'], hsr: ['Détente haute vitesse', 'HSR'], lsr: ['Détente basse vitesse', 'LSR'] };

const zLevel = z => z >= 2 ? 3 : z >= 1 ? 2 : 1;
const nLevel = (n, nMin) => n >= 2 * nMin ? 3 : n >= nMin ? 2 : 1;
const poissonZ = (n, lam) => (n - lam) / Math.sqrt(Math.max(1, lam));
const binomZ = (p, p0, n) => n > 0 ? (p - p0) / Math.sqrt(p0 * (1 - p0) / n) : 0;

/* ---------------------------------------------------------------- réglages disponibles et unités */
/** Molettes, unités et limites d'une suspension : d'après le modèle (SUS_MODELS) et les réglages saisis. */
function knobMeta(cfg, c, key) {
  cfg = cfg || {};
  const f = cfg.fork || {}, s = cfg.shock || {}, x = c === 0 ? f : s, m = modelOf(cfg, c);
  const pu = cfg.pressure_unit || 'psi', su = cfg.spring_unit || 'lb/in';
  const ext = c === 0 && f.chamber === 'ext', coil = c === 1 && s.type === 'coil';
  const rng = (x.rng || {});
  const base = { key, c, pu, su, model: m };
  if (key === 'spring') {
    if (ext) return Object.assign(base, { name: 'Chambre +', sub: 'soutien général, sag', kind: 'pressure', field: 'pressure_plus', cur: f.pressure_plus, avail: f.pressure_plus !== null, more: 'Gonfler la chambre +', less: 'Dégonfler la chambre +' });
    if (coil) return Object.assign(base, { name: 'Ressort', sub: 'soutien général, sag', kind: 'spring', field: 'spring_rate', cur: s.spring_rate, avail: s.spring_rate !== null, more: 'Ressort plus raide', less: 'Ressort plus souple' });
    return Object.assign(base, { name: 'Pression', sub: 'soutien général, sag', kind: 'pressure', field: 'pressure', cur: x.pressure, avail: x.pressure !== null, more: 'Augmenter la pression', less: 'Baisser la pression' });
  }
  if (key === 'prog') {
    const kind = progKind(cfg, c);
    if (kind === 'plusplus') return Object.assign(base, { name: 'Chambre ++', sub: 'milieu et fin de course', kind: 'pressure', field: 'pressure_plusplus', cur: f.pressure_plusplus, avail: f.pressure_plusplus !== null, more: 'Gonfler la chambre ++', less: 'Dégonfler la chambre ++' });
    if (kind === 'tokens') return Object.assign(base, { name: 'Tokens', sub: 'progressivité, fin de course', kind: 'tokens', field: 'tokens', cur: f.tokens, avail: f.tokens !== null, max: f.tmax, more: 'Ajouter un token', less: 'Retirer un token' });
    if (kind === 'hbc') return Object.assign(base, { name: 'HBC', abbr: 'HBC', sub: 'fin de course hydraulique', kind: 'clicks', field: 'hbc', cur: s.hbc, avail: s.hbc !== null, range: rng.hbc, more: 'Fermer le HBC', less: 'Ouvrir le HBC' });
    if (kind === 'spacer') return Object.assign(base, { name: 'Spacers de volume', sub: 'progressivité, fin de course', kind: 'spacer', avail: true, more: 'Ajouter un spacer de volume', less: 'Retirer un spacer de volume' });
    return Object.assign(base, { name: 'Fin de course', sub: 'pas de réglage de progressivité', kind: 'none', avail: false, why: 'ressort acier sans réglage de fin de course' });
  }
  const [name, abbr] = KNOB_DAMP[key];
  const allowed = !(m && Array.isArray(m.adj)) || m.adj.includes(key);
  const pos = key === 'hsc' && m && m.hscPositions;
  return Object.assign(base, {
    name, abbr, sub: abbr, kind: pos ? 'positions' : 'clicks', field: key, cur: x[key], positions: pos || null,
    range: pos ? pos.length : rng[key], avail: allowed && x[key] !== null, why: allowed ? '' : 'absent sur ' + (m ? m.label : 'cette suspension'),
    more: 'Fermer', less: 'Ouvrir', damping: true,
  });
}

/** Réglage de progressivité de la suspension : chambre ++ (EXT Era), tokens, HBC (Storia/Arma), spacers (amortisseur à air). */
function progKind(cfg, c) {
  const f = (cfg && cfg.fork) || {}, s = (cfg && cfg.shock) || {}, m = modelOf(cfg || {}, c);
  if (m && m.progKind !== undefined) return m.progKind;
  if (c === 0) return f.chamber === 'ext' ? 'plusplus' : 'tokens';
  if (m && m.hasHbc) return 'hbc';
  return s.type === 'coil' ? null : 'spacer';
}

/** Pression maximale autorisée : saisie dans le profil, sinon celle du manuel du modèle (null : inconnue). */
function pressureMax(cfg, c) {
  const x = (cfg && (c === 0 ? cfg.fork : cfg.shock)) || {}, m = modelOf(cfg || {}, c);
  if (isFinite(x.pmax) && x.pmax > 0) return +x.pmax;
  const u = (cfg && cfg.pressure_unit) || 'psi';
  if (m && m.pmax) return u === 'bar' ? m.pmax / 14.5038 : m.pmax;
  return null;
}

/* ---------------------------------------------------------------- ampleur d'un changement */
const round = (v, q) => +(Math.round(v / q) * q).toFixed(q < 1 ? 1 : 0);
/** Pas de clics : environ 1/4 de la plage (4 clics sur 16, 2 sur 7), plus franc que les 1 à 3 clics des manuels
 *  [M5][M3] : la méthode par encadrement trouve plus vite le bon réglage, quitte à revenir d'un demi-pas au run
 *  suivant si le symptôme inverse apparaît (session.js). Plage inconnue : 3 clics. */
const clickStep = R => R > 0 ? Math.max(1, Math.round(R / 4)) : 3;
/** Pas de pression sans mesure du sag : 10 % (au moins 5 psi / 0,3 bar) ; depuis le sag : au plus 20 %. */
const ADV_PRESS = { rel: 0.10, max: 0.20, minPsi: 5, minBar: 0.3 };

/**
 * Ampleur concrète d'un changement de réglage, dans l'unité de la suspension, avec ses garde-fous :
 * plage de la molette, positions de la HSC Öhlins (III réservée aux montées), pression maximale, écart des
 * chambres EXT (++ toujours au-dessus de +), nombre de tokens, raideur de ressort calculée depuis le sag.
 * Retourne { ok, text, from, to, unit, note } ou { ok: false, why }.
 */
function adviceAmount(cfg, c, key, dir, ctx = {}) {
  const k = knobMeta(cfg, c, key);
  if (!k.avail) return { ok: false, why: k.why || 'réglage absent ou noté N/A' };
  const verb = dir > 0 ? k.more : k.less;
  const cur = isFinite(k.cur) && k.cur !== null && k.cur !== '' ? +k.cur : null;
  const out = (text, from, to, unit, note) => ({ ok: true, text, from, to, unit, note: note || '', verb });

  if (k.kind === 'clicks') {                              // clics comptés depuis fermé : fermer = moins de clics
    const R = k.range > 0 ? +k.range : null;
    let st = clickStep(R);
    if (cur != null) {
      const to = cur - dir * st;
      if (to < 0) { if (cur === 0) return { ok: false, why: k.name + ' déjà fermé à fond' }; st = cur; }
      if (R && to > R) { if (cur >= R) return { ok: false, why: k.name + ' déjà ouvert à fond (' + R + ' clics)' }; st = R - cur; }
    }
    const to = cur != null ? cur - dir * st : null;
    const txt = verb + ' ' + st + ' clic' + (st > 1 ? 's' : '') + (to != null ? ' (de ' + cur + ' à ' + to + ' depuis fermé)' : '');
    return out(txt, cur, to, 'clics', R ? '' : 'Nombre de clics de la molette non renseigné dans le profil du vélo : pas de 3 clics par défaut.');
  }
  if (k.kind === 'positions') {                           // HSC à 3 positions (Öhlins TTX22m.2)
    const p = cur != null ? Math.round(cur) : 2, to = p + dir;
    if (to >= k.positions.length) return { ok: false, why: 'la position ' + k.positions[k.positions.length - 1] + ' est réservée aux longues montées [M3]' };
    if (to < 1) return { ok: false, why: 'HSC déjà en position ' + k.positions[0] };
    return out((dir > 0 ? 'Passer la HSC en position ' : 'Passer la HSC en position ') + k.positions[to - 1], p, to, 'position');
  }
  if (k.kind === 'pressure') {
    const bar = k.pu === 'bar', q = bar ? 0.1 : 1, stMin = bar ? ADV_PRESS.minBar : ADV_PRESS.minPsi;
    // sans sag : 10 % (RockShox 5 psi par pas [M5], ShockWiz ~5 % [O4], doublés pour l'encadrement) ;
    // avec le sag mesuré et visé : ressort linéaire, raideur ∝ pression → p2 = p1 × sag1 / sag2 (un ressort
    // progressif bouge moins : le pas ne dépasse pas la cible), borné à 20 % de la pression actuelle
    let st = stMin;
    if (cur != null) {
      st = Math.max(stMin, round(cur * ADV_PRESS.rel, q));
      if (k.field !== 'pressure_plusplus' && ctx.sagNow > 0 && ctx.sagGoal > 0) st = Math.min(round(cur * ADV_PRESS.max, q), Math.max(stMin, round(Math.abs(cur * ctx.sagNow / ctx.sagGoal - cur), q)));
    }
    let to = cur != null ? round(cur + dir * st, q) : null;
    let note = '';
    if (dir > 0) {
      const pm = pressureMax(cfg, c);
      if (pm != null && cur != null) {
        if (cur >= pm) return { ok: false, why: 'pression déjà au maximum autorisé (' + fmt(pm, bar ? 1 : 0) + ' ' + k.pu + ')' };
        if (to > pm) { to = round(pm, q); st = to - cur; }
      } else note = 'Pression maximale du constructeur non renseignée dans le profil : la vérifier avant de gonfler.';
    } else if (to != null && to <= 0) return { ok: false, why: 'pression déjà très basse' };
    if (c === 0 && cfg.fork && cfg.fork.chamber === 'ext' && cur != null) {   // ++ toujours au-dessus de + [M1]
      const p = +cfg.fork.pressure_plus, pp = +cfg.fork.pressure_plusplus, gapMin = bar ? 0.3 : 5;
      if (k.field === 'pressure_plus' && dir > 0 && isFinite(pp) && pp - to < gapMin) return { ok: false, why: 'la chambre ++ (' + fmt(pp, bar ? 1 : 0) + ' ' + k.pu + ') doit rester au-dessus de la + [M1]' };
      if (k.field === 'pressure_plusplus' && dir < 0 && isFinite(p) && to - p < gapMin) return { ok: false, why: 'la chambre ++ doit rester au-dessus de la + (' + fmt(p, bar ? 1 : 0) + ' ' + k.pu + ') [M1]' };
    }
    const d = bar ? 1 : 0, txt = verb + ' de ' + fmt(Math.abs(to != null ? to - cur : st), d) + ' ' + k.pu + (to != null ? ' (de ' + fmt(cur, d) + ' à ' + fmt(to, d) + ')' : '');
    return out(txt, cur, to, k.pu, note + (c === 0 && cfg.fork && cfg.fork.chamber === 'ext' ? (note ? ' ' : '') + 'Gonflage : toujours la ++ avant la + [M1].' : ''));
  }
  if (k.kind === 'spring') {                              // ressort linéaire sans précharge : k2 = k1 × sag1 / sag2
    const q = k.su === 'N/mm' ? 5 : 25, s1 = ctx.sagNow, s2 = ctx.sagGoal;
    let to = null;
    if (cur != null && s1 > 0 && s2 > 0) to = Math.max(q, round(cur * s1 / s2, q));
    if (cur != null && (to == null || to === cur)) to = round(cur * (1 + 0.10 * dir), q) || cur + dir * q;
    if (to != null && Math.sign(to - cur) !== dir) to = cur + dir * q;
    return out(verb + (to != null ? ' : ' + fmt(to, 0) + ' ' + k.su + ' au lieu de ' + fmt(cur, 0) : ' (raideur actuelle non renseignée)'), cur, to, k.su,
      'Ne pas corriger le sag par la précharge : au plus 2 tours (EXT, Öhlins) [M2][M3].');
  }
  if (k.kind === 'tokens') {
    if (cur != null) {
      if (dir < 0 && cur <= 0) return { ok: false, why: 'aucun token à retirer' };
      if (dir > 0 && isFinite(k.max) && k.max > 0 && cur >= k.max) return { ok: false, why: 'déjà au nombre maximal de tokens (' + k.max + ')' };
    }
    return out(verb + (cur != null ? ' (de ' + cur + ' à ' + (cur + dir) + ')' : ''), cur, cur != null ? cur + dir : null, 'token',
      isFinite(k.max) && k.max > 0 ? '' : 'Nombre maximal de tokens non renseigné : ne pas dépasser celui du manuel (ex. Fox 36 en 160 mm : 6) [M4].');
  }
  if (k.kind === 'spacer') return out(verb, null, null, 'spacer', 'Ne pas dépasser le nombre de spacers prévu par le constructeur.');
  return { ok: false, why: 'pas de réglage disponible' };
}

/* ---------------------------------------------------------------- 1. données exploitables */
/**
 * Ce que les données permettent de conclure. cap = confiance maximale possible (3 haute … 0 aucune) ;
 * ch[c] : course connue, fin de course exploitable (échelle calibrée), vitesses exploitables (bruit).
 */
function adviceGate(P, M) {
  const g = { cap: 3, why: [], warn: [], ch: [null, null], imu: !!(M.imu && P.imu), descent: false };
  const q = M.q, nom = q.nominalRate || 1000;
  if (!P.hasAny) { g.cap = 0; g.why.push('aucune suspension enregistrée'); return g; }
  const I = P.imu, main = I && I.seg && I.seg.main;
  g.descent = !!(main && Math.abs(main.t0 - M.i0 * P.dt) < 0.6 && Math.abs(main.t1 - M.i1 * P.dt) < 0.6) || !M.full;
  if (M.dur < ADV.minDescentS) { g.cap = 0; g.why.push('descente analysée trop courte (' + fmtDur(M.dur) + ' ; au moins ' + ADV.minDescentS + ' s)'); }
  const pres = [0, 1].filter(c => P.has[c]);
  if (pres.length && pres.every(c => M.ch[c].movingShare < 0.25)) { g.cap = 0; g.why.push('suspensions presque immobiles pendant la fenêtre analysée'); }
  if (!g.descent) { g.cap = Math.min(g.cap, 2); g.warn.push('sans centrale (ou sans descente détectée), le run entier est analysé, montées et arrêts compris'); }
  if (!q.complete) { g.cap = Math.min(g.cap, 2); g.warn.push('enregistrement interrompu'); }
  if (q.dropped > 0.005 * q.n) { g.cap = Math.min(g.cap, 2); g.warn.push('échantillons perdus'); }
  if (q.meanRate < 0.9 * nom) { g.cap = Math.min(g.cap, 2); g.warn.push('cadence réelle faible'); }
  for (const c of pres) {
    const m = M.ch[c], ch = { ok: true, end: true, vel: true, sagU: 0, why: [] };
    if (!P.travelKnown[c]) { ch.ok = false; ch.why.push('course non renseignée'); }
    if (m.min < -Math.max(3, 0.03 * m.travel)) { ch.ok = false; ch.why.push('zéro décalé'); }
    if (P.ambiguousDir) { ch.ok = false; ch.why.push('sens du capteur incertain'); }
    if (P.noise[c] > 0.6) { ch.vel = false; ch.why.push('capteur bruité'); }
    if (!P.hdr.ch[c].cpm_user) { ch.end = false; ch.sagU = 1; ch.why.push('course du capteur non calibrée (fin de course incertaine)'); }
    const se = P.sensorEnd && P.sensorEnd[c];
    if (se && se.nClip >= 3) { ch.end = false; ch.clip = true; ch.why.push('capteur en butée pendant le run (fin de course réelle inconnue)'); g.warn.push(CH_LABEL[c].toLowerCase() + ' : le capteur a talonné, vérifier son montage'); }
    g.ch[c] = ch;
  }
  if (pres.length && pres.every(c => !g.ch[c].ok)) { g.cap = 0; g.why.push(pres.map(c => CH_LABEL[c].toLowerCase() + ' : ' + g.ch[c].why.join(', ')).join(' ; ')); }
  return g;
}

/* ---------------------------------------------------------------- 2. constats */
const tOf = (P, i) => i * P.dt;

/** Moindres carrés y = b0 + b1·x1 (+ b2·x2) ; retourne [b0, b1, b2] ou null. */
function linFit(rows, two) {
  const m = two ? 3 : 2, A = Array.from({ length: m }, () => new Float64Array(m)), v = new Float64Array(m);
  for (const r of rows) {
    const x = two ? [1, r[0], r[1]] : [1, r[0]];
    for (let a = 0; a < m; a++) { v[a] += x[a] * r[2]; for (let b = 0; b < m; b++) A[a][b] += x[a] * x[b]; }
  }
  try {
    const inv = invertMatrix(A.map(r => Array.from(r)));
    const b = inv.map(row => row.reduce((s, w, k) => s + w * v[k], 0));
    return b.every(isFinite) ? b : null;
  } catch (e) { return null; }
}

/**
 * Enfoncement dû aux passages cassants (points de course) : de combien la suspension roule plus bas quand la piste
 * secoue (quart le plus agité des fenêtres de 0,5 s) que quand elle est calme, à pente égale (régression sur la
 * vitesse RMS de la suspension et, avec la centrale, sur la pente ; vols et freinages écartés).
 * Une détente lente devant la compression fait « s'enfoncer » la suspension sous les chocs répétés (packing) ;
 * une détente rapide la fait rouler plus haut. Retourne { shift, sd, n } ou null.
 */
function roughShift(P, M, c, air) {
  const W = Math.round(0.5 / P.dt), I = P.imu, rows = [];
  for (let a = M.i0; a + W <= M.i1; a += W) {
    let s = 0, s2 = 0, bad = false;
    for (let i = a; i < a + W; i++) { if (air && air[i]) { bad = true; break; } s += P.pct[c][i]; s2 += P.vel[c][i] * P.vel[c][i]; }
    if (bad) continue;
    let sl = 0;
    if (I) {
      const k0 = Math.round(a * P.dt / I.dt), k1 = Math.min(I.N, Math.round((a + W) * P.dt / I.dt));
      let ss = 0, dec = 0;
      for (let k = k0; k < k1; k++) { ss += I.slope[k]; dec = Math.min(dec, I.aLongLp[k]); }
      if (dec < -0.2) continue;                                // freinage : le transfert de charge n'est pas du packing
      sl = ss / Math.max(1, k1 - k0);
    }
    rows.push([Math.sqrt(s2 / W) / P.travel[c] * 100, sl, s / W]);
  }
  if (rows.length < 40) return null;
  const fit = rs => linFit(rs, !!I);
  const spread = rs => { const r = rs.map(x => x[0]).sort((p, q) => p - q), q = Math.max(1, Math.floor(r.length / 4)); return r.slice(-q).reduce((s, x) => s + x, 0) / q - r.slice(0, q).reduce((s, x) => s + x, 0) / q; };
  const all = fit(rows);
  if (!all) return null;
  const half = rows.length >> 1, h = [rows.slice(0, half), rows.slice(half)].map(rs => { const b = fit(rs); return b ? b[1] * spread(rs) : NaN; });
  const shift = all[1] * spread(rows), sd = isFinite(h[0]) && isFinite(h[1]) ? Math.max(1, Math.abs(h[0] - h[1]) / 2) : 1.5;
  return { shift, sd, n: rows.length };
}

/** Fins de course : à la réception d'un saut, après une suite de bosses qui fait s'enfoncer la suspension
 *  (packing → détente trop lente, EXT [M2]) ou sur un impact isolé. */
function classifyBottoms(P, M, c) {
  const m = M.ch[c], T = P.travel[c], pos = P.pos[c], J = M.imu ? M.imu.jumps : [];
  return m.bottom.map(i => {
    const t = tOf(P, i);
    if (J.some(j => t >= j.tl - 0.1 && t <= j.tl + 0.6)) return { i, t, kind: 'landing' };
    const a = Math.max(0, i - Math.round(1.6 / P.dt)), b = Math.max(0, i - Math.round(0.9 / P.dt)), e = Math.max(0, i - Math.round(0.05 / P.dt));
    let lo1 = Infinity, lo2 = Infinity;
    for (let k = a; k < b; k++) lo1 = Math.min(lo1, pos[k]);
    for (let k = b + Math.round(0.3 / P.dt); k < e; k++) lo2 = Math.min(lo2, pos[k]);
    return { i, t, kind: isFinite(lo1) && isFinite(lo2) && lo2 - lo1 >= 0.10 * T ? 'packing' : 'impact' };
  });
}

/**
 * Butées hautes « qui claquent », roues au sol : la suspension arrive en fin de détente encore vite (≥ la moitié de sa
 * vitesse de détente P95, et ≥ 100 mm/s, sur les 30 ms qui précèdent). C'est la définition Fox de la butée haute
 * (arrêt brutal en fin de détente [M4]) ; une roue délestée qui revient doucement en butée n'est pas un défaut de détente.
 */
function harshTopouts(P, M, c, air) {
  const m = M.ch[c], vel = P.vel[c], lim = Math.max(100, 0.5 * m.vP95R), w = Math.round(0.03 / P.dt);
  return m.topout.filter(i => {
    if (air && air[i]) return false;
    let v = 0;
    for (let k = Math.max(0, i - w); k <= i; k++) v = Math.max(v, -vel[k]);
    return v >= lim;
  });
}

/** Vols (centrale) : du décollage (0,15 s avant la chute libre : la suspension se détend en quittant la bosse) à la
 *  réception (+ 0,05 s). Une suspension restée détendue en l'air ne crée pas de nouvelle butée haute ; une butée haute
 *  qui suit de près la réception (après une compression) est au contraire un vrai signe de détente rapide. */
function airMaskPot(P) {
  const I = P.imu;
  if (!I) return null;
  const m = new Uint8Array(P.N);
  I.air.forEach(([a, b]) => { for (let k = Math.max(0, Math.floor((a * I.dt - 0.15) / P.dt)); k < Math.min(P.N, Math.ceil(((b + 1) * I.dt + 0.05) / P.dt)); k++) m[k] = 1; });
  return m;
}

/** Leviers pour plus (dir +1) ou moins (−1) de soutien en fin de course, selon le modèle. */
function endLevers(cfg, c, dir) {
  const m = modelOf(cfg || {}, c), pk = progKind(cfg, c), L = [];
  if (m && m.bottomLever) L.push({ key: m.bottomLever, dir });          // Öhlins TTX : LSC et ressort [M3]
  if (pk === 'hbc') L.push({ key: 'prog', dir });                       // Storia/Arma : HBC [M2]
  if (pk === 'plusplus') L.push({ key: 'prog', dir });                  // EXT Era : chambre ++ [M1]
  L.push({ key: 'hsc', dir });                                          // RockShox : HSC d'abord, tokens ensuite [M5]
  if (pk === 'tokens' || pk === 'spacer') L.push({ key: 'prog', dir });
  if (dir > 0 && c === 1 && cfg.shock && cfg.shock.type === 'coil') L.push({ key: 'spring', dir });
  const seen = new Set();
  return L.filter(l => { const id = l.key + l.dir; if (seen.has(id)) return false; seen.add(id); return true; });
}

function adviceFindings(P, M, g) {
  const F = [], ok = [], cfg = P.cfg || {}, D = Math.max(1, M.dur) / 60, I = M.imu;
  const add = f => F.push(Object.assign({ conf: 1, z: 0, n: null, stage: ADV.stage[f.levers[0].key] }, f));
  const air = airMaskPot(P);
  for (let c = 0; c < 2; c++) {
    if (!P.has[c] || !g.ch[c] || !g.ch[c].ok) continue;
    const m = M.ch[c], ch = g.ch[c], lab = CH_LABEL[c], T = P.travel[c];

    // ---- sag statique vs repère (manuel ou saisi) : seul critère de ressort [M1][M2][M3][M4]
    const tgt = sagTarget(cfg, c), tilt = m.restTilt && (Math.abs(m.restTilt.pitch) > 3 || Math.abs(m.restTilt.roll) > 4);
    if (tgt && m.rest && !tilt) {
      const [lo, hi] = tgt.range, sag = m.staticPct, u = 1.5 + 100 * m.rest.sd / T + ch.sagU;
      const dev = sag > hi ? sag - hi : sag < lo ? lo - sag : 0, dir = sag > hi ? 1 : -1;
      if (dev > 0) add({ id: 'sag', c, levers: [{ key: 'spring', dir }], z: dev / u, conf: Math.min(3, zLevel(dev / u)), sagNow: sag, sagGoal: (lo + hi) / 2,
        title: lab + ' : sag statique ' + (dir > 0 ? 'trop élevé' : 'trop bas') + ' (' + fmt(sag, 0) + ' %)',
        metric: { label: 'Sag statique', value: sag, unit: '%', ref: lo + '–' + hi + ' % (' + tgt.label + ')' },
        why: 'Sag mesuré pilote immobile au départ du run (incertitude ±' + fmt(u, 1) + ' pt). Le ressort se règle d\'abord sur le sag statique ; l\'amortissement ne le change pas.', src: '[M1][M2][M3][M4]' });
      else ok.push({ c, key: 'spring', what: 'sag statique ' + fmt(sag, 0) + ' % dans le repère ' + lo + '–' + hi + ' %' });
    } else ok.push({ c, key: 'spring', nodata: !tgt ? 'aucun sag visé (choisir le modèle ou saisir le sag visé)' : !m.rest ? 'pas d\'immobilité au départ pour mesurer le sag statique' : 'sag mesuré vélo incliné' });

    // ---- fins de course : réception, suite de bosses (packing) ou impact
    if (ch.end) {
      const bo = classifyBottoms(P, M, c), n = bo.length, lam = ADV.rate.bottom * D;
      const pk = bo.filter(b => b.kind === 'packing').length, land = bo.filter(b => b.kind === 'landing').length;
      if (n >= ADV.minEvents.bottom && n > lam) {
        const z = poissonZ(n, lam), half = M.i0 + (M.i1 - M.i0) / 2, h1 = bo.filter(b => b.i < half).length;
        const local = n <= 4 && (h1 === 0 || h1 === n);
        const conf = Math.min(local ? 2 : 3, zLevel(z), nLevel(n, ADV.minEvents.bottom));
        const metric = { label: 'Fins de course', value: n, unit: '', ref: '≤ ' + fmt(lam, 1) + ' sur ' + fmtDur(M.dur) + ' (' + fmt(ADV.rate.bottom, 2) + ' par minute)' };
        if (pk >= Math.max(2, n / 2)) add({ id: 'bottom-packing', c, levers: [{ key: 'lsr', dir: -1 }, { key: 'hsr', dir: -1 }], z, conf, n, metric,
          title: lab + ' : ' + pk + ' fins de course sur ' + n + ' arrivent après une suite de bosses',
          why: 'La suspension s\'enfonce d\'une bosse à l\'autre puis touche le fond : elle ne revient pas assez vite entre les chocs. EXT conseille alors une détente plus rapide [M2].', src: '[M2][M5]' });
        else add({ id: 'bottom', c, levers: endLevers(cfg, c, 1), z, conf, n, metric,
          title: lab + ' : ' + n + ' fins de course' + (land ? ' (dont ' + land + ' à la réception de sauts)' : ''),
          why: 'Plus de fins de course que des passages occasionnels sur les gros impacts. Levier dans l\'ordre du constructeur : HBC (Storia/Arma), chambre ++ (EXT Era), LSC puis ressort (Öhlins TTX), sinon HSC puis tokens [M1][M2][M3][M5].', src: '[M1][M2][M3][M5]' });
      } else if (n === 0 && m.maxPct < ADV.maxUse[c]) {
        const big = m.hits, jumps = I ? I.jumps.length : 0, severe = big >= 10 || jumps >= 2;
        if (severe) add({ id: 'underuse', c, levers: endLevers(cfg, c, -1).filter(l => l.key !== 'spring'), z: (ADV.maxUse[c] - m.maxPct) / 3, conf: Math.min(2, zLevel((ADV.maxUse[c] - m.maxPct) / 3)), n: big,
          title: lab + ' : course max ' + fmt(m.maxPct, 0) + ' % malgré ' + big + ' gros impacts' + (jumps ? ' et ' + jumps + ' sauts' : ''),
          metric: { label: 'Course max', value: m.maxPct, unit: '%', ref: '≥ ' + ADV.maxUse[c] + ' % sur une piste engagée' },
          why: 'Sur une piste engagée, la fin de course reste inutilisée : un peu moins de soutien en fin de course rend de la course disponible, sans toucher au sag.', src: '[P1][M4][M5]' });
        else ok.push({ c, key: 'prog', what: 'course max ' + fmt(m.maxPct, 0) + ' %, piste peu engagée : rien à conclure' });
      } else ok.push({ c, key: 'prog', what: n + ' fin' + (n > 1 ? 's' : '') + ' de course, course max ' + fmt(m.maxPct, 0) + ' %' });
    } else ok.push({ c, key: 'prog', nodata: ch.clip ? 'capteur en butée pendant le run : fins de course non mesurables (vérifier le montage du capteur)' : 'course du capteur non calibrée : fins de course incertaines (faire la calibration de la course du capteur)' });

    // ---- équilibre détente / compression sous les chocs répétés (indice commun aux deux règles suivantes)
    const rs = ch.vel ? roughShift(P, M, c, air) : null;
    M.adviceShift = M.adviceShift || [null, null];
    M.adviceShift[c] = rs;

    // ---- détente trop rapide : butées hautes roues au sol (indice principal) ; dépassement après les réceptions,
    // butée haute après réception et suspension qui roule haut dans les passages cassants en indices d'appoint
    let rebFast = null;
    if (g.imu) {
      const tops = harshTopouts(P, M, c, air), nT = tops.length, lam = ADV.rate.top * D;
      if (nT >= ADV.minEvents.top && nT > lam) {
        const z = poissonZ(nT, lam), extra = [];
        const S = I.stab.filter(s => s[c] && isFinite(s[c].over)), nS = S.length;
        if (nS >= ADV.minEvents.landings && S.filter(s => s[c].over > 8).length / nS > 0.5) extra.push(fmt(S.filter(s => s[c].over > 8).length / nS * 100, 0) + ' % des réceptions dépassent la position d\'avant le saut');
        if (rs && rs.shift < -3) extra.push('la suspension roule ' + fmt(-rs.shift, 1) + ' pts plus haut dans les passages cassants');
        const springSeen = ok.some(o => o.c === c && o.key === 'spring' && !o.nodata) || F.some(f => f.c === c && f.id === 'sag');
        rebFast = { id: 'rebound-fast', c, levers: [{ key: 'lsr', dir: 1 }, { key: 'hsr', dir: 1 }], z, n: nT,
          conf: Math.min(springSeen ? 3 : 2, zLevel(z), nLevel(nT, ADV.minEvents.top)),      // ressort non évalué : moyenne au plus
          title: lab + ' : détente trop rapide (' + nT + ' butées hautes qui claquent, roues au sol' + (extra.length ? ' ; ' + extra.join(' ; ') : '') + ')',
          metric: { label: 'Butées hautes rapides au sol', value: nT, unit: '', ref: '≤ ' + fmt(lam, 1) + ' sur ' + fmtDur(M.dur) + ' (1 par minute)' },
          why: 'La suspension revient trop vite et arrive en butée haute encore lancée (claquement), hors des sauts : plus de détente (clics vers fermé) [M2][M3][M4][M5]. Si le sag statique est bas, c\'est le ressort qu\'il faut d\'abord assouplir : un ressort trop ferme renvoie aussi en butée.', src: '[M2][M3][M4][M5]' };
      }
    }
    // ---- détente trop lente : la suspension s'enfonce dans les passages cassants (packing) ; retour lent après les
    // réceptions en indice d'appoint. Seuil de 4 pts : repère simulé [H], confiance au plus moyenne.
    // Un ressort trop souple fait aussi s'enfoncer la suspension sous les chocs : ce constat n'est retenu (confiance
    // moyenne au plus) que si le sag statique a été évalué et se trouve dans le repère (ressort d'abord).
    const springOk = ok.some(o => o.c === c && o.key === 'spring' && !o.nodata);
    let rebSlow = null;
    if (rs && rs.shift > 4) {
      const z = (rs.shift - 4) / rs.sd, extra = [];
      if (I) { const st = I.stabStats, r = st['ret' + c]; if (st.n >= ADV.minEvents.landings && isFinite(r) && r > 0.45) extra.push('retour lent après les réceptions (' + fmt(r * 1000, 0) + ' ms)'); }
      rebSlow = { id: 'rebound-slow', c, levers: [{ key: 'lsr', dir: -1 }, { key: 'hsr', dir: -1 }], z, n: null,
        conf: springOk ? Math.min(2, zLevel(z)) : 1,
        title: lab + ' : détente trop lente (s\'enfonce de ' + fmt(rs.shift, 1) + ' pts dans les passages cassants' + (extra.length ? ' ; ' + extra.join(' ; ') : '') + ')',
        metric: { label: 'Enfoncement dans les passages cassants', value: rs.shift, unit: 'pts', ref: '≤ 4 pts (à pente égale, hors freinages, ' + rs.n + ' fenêtres de 0,5 s)' },
        why: 'Sous des chocs rapprochés, la suspension ne revient pas entre deux bosses et roule de plus en plus bas (packing) : moins de détente (clics vers ouvert) [M2][M3][M5].' +
          (springOk ? '' : ' Pas de conseil tant que le sag statique n\'est pas évalué et bon : un ressort trop souple donne le même symptôme.'), src: '[M2][M3][M5][P4]' };
    }
    if (rebFast) add(rebFast);
    if (rebSlow) add(rebSlow);
    if (!rebFast && !rebSlow) ok.push({ c, key: 'lsr', what: (g.imu ? 'pas de butées hautes répétées qui claquent, roues au sol' : 'butées hautes non évaluées sans centrale') + (rs ? ', pas d\'enfoncement dans les passages cassants (' + (rs.shift > 0 ? '+' : '') + fmt(rs.shift, 1) + ' pt)' : ''), nodata: !g.imu && !rs ? 'centrale absente et capteur bruité' : '' });

    // ---- plongée au freinage (fourche) : plateau comparé à la plongée due au seul ressort [H, audit §2]
    if (c === 0 && m.rest) {
      const B = M.brake, useB = B && isFinite(B.divePer01) && B.nDive >= ADV.minEvents.brakes;
      const dive = useB ? B.divePer01 : I && I.brakes.length >= ADV.minEvents.brakes ? I.brakeDivePer01 : NaN, nB = useB ? B.nDive : I ? I.brakes.length : 0;
      if (isFinite(dive)) {
        const th = (90 - (isFinite(cfg.head_angle) && cfg.head_angle > 0 ? cfg.head_angle : 65)) * Math.PI / 180;
        const beta = B && isFinite(B.frontShare) ? clamp(B.frontShare / 100, 0.4, 1) : 0.7;
        const expct = m.staticPct * 0.1 * (0.8 + beta * Math.tan(th)) / (1.3 * 0.45);
        M.adviceDive = { dive, expct, n: nB };
        if (dive > 1.6 * expct) add({ id: 'brake-dive', c, levers: [{ key: 'prog', dir: 1 }], z: (dive - 1.6 * expct) / (0.3 * expct), conf: Math.min(2, zLevel((dive - 1.6 * expct) / (0.3 * expct)), nLevel(nB, ADV.minEvents.brakes)), n: nB,
          title: lab + ' : plonge plus que prévu au freinage (' + fmt(dive, 1) + ' pts par 0,1 g, ~' + fmt(expct, 1) + ' attendus)',
          metric: { label: 'Plongée au freinage', value: dive, unit: 'pts / 0,1 g', ref: '≤ ' + fmt(1.6 * expct, 1) + ' (1,6 × la plongée due au seul ressort)' },
          why: 'En freinage soutenu, la plongée finale dépend du ressort : au-delà de ce que donne le sag mesuré, la fourche manque de soutien en milieu de course (tokens ou chambre ++). La LSC, elle, règle la vitesse à laquelle la fourche plonge.', src: '[M4][M5][H]' });
      }
    }
  }
  return { F, ok };
}

/* ---------------------------------------------------------------- 3 et 4. confiance, choix du conseil */
function adviseRun(P, M) {
  const g = adviceGate(P, M), A = { gate: g, findings: [], ok: [], main: null, watch: null, notes: [], abstain: false, why: [] };
  if (g.cap === 0) { A.abstain = true; A.why = g.why.slice(); return A; }
  const { F, ok } = adviceFindings(P, M, g);
  A.ok = ok;
  F.forEach(f => { f.conf = Math.max(1, Math.min(f.conf, g.cap)); });
  // même molette, sens opposés : indices contradictoires → pas de conseil sur cette molette
  F.forEach(f => {
    const opp = F.filter(o => o !== f && o.c === f.c && o.levers[0].key === f.levers[0].key && o.levers[0].dir === -f.levers[0].dir && o.conf >= 2);
    if (opp.length && f.conf >= 2) { f.conflict = true; opp.forEach(o => { o.conflict = true; }); }
  });
  F.filter(f => f.conflict).forEach(f => { f.conf = 1; });
  if (F.some(f => f.conflict)) A.notes.push('Indices contradictoires sur une même molette : pas de conseil sur celle-ci tant qu\'un run de plus ne tranche pas.');
  F.sort((a, b) => a.stage - b.stage || b.conf - a.conf || b.z - a.z);
  A.findings = F;
  for (const f of F) {
    if (f.conf < 2) continue;
    for (const l of f.levers) {
      const amt = adviceAmount(P.cfg || {}, f.c, l.key, l.dir, f);
      if (amt.ok) { A.main = { f, lever: l, amt }; break; }
      (f.blocked = f.blocked || []).push(knobMeta(P.cfg, f.c, l.key).name + ' : ' + amt.why);
    }
    if (A.main) break;
  }
  const w = F.find(f => !A.main || f !== A.main.f);
  if (w) A.watch = { f: w, lever: w.levers.find(l => knobMeta(P.cfg, w.c, l.key).avail) || w.levers[0] };
  if (!A.main) {
    A.abstain = true;
    A.why = F.length ? ['aucun constat assez sûr (confiance moyenne au moins) avec un réglage disponible'] : [];
    F.filter(f => f.blocked).forEach(f => A.why.push(f.title + ' — ' + f.blocked.join(' ; ')));
  }
  if (g.warn.length) A.notes.push('Confiance limitée : ' + g.warn.join(', ') + '.');
  return A;
}

/** Statut de chaque réglage pour le tableau : conseil, à surveiller, bon, non évalué, sans objet. */
function adviceStatus(P, A, c, key) {
  const k = knobMeta(P.cfg || {}, c, key);
  if (A.main && A.main.f.c === c && A.main.lever.key === key) return { st: 'main', k };
  if (A.watch && A.watch.f.c === c && A.watch.lever.key === key) return { st: 'watch', k, dir: A.watch.lever.dir };
  if (!k.avail) return { st: 'na', k };
  const f = A.findings.find(x => x.c === c && x.levers.some(l => l.key === key));
  if (f) return { st: 'low', k, f, dir: f.levers.find(l => l.key === key).dir };
  const o = (A.ok || []).find(x => x.c === c && (x.key === key || (key === 'hsr' && x.key === 'lsr') || (key === 'hsc' && x.key === 'prog')));
  if (o && !o.nodata) return { st: 'ok', k, what: o.what };
  return { st: 'none', k, what: o && o.nodata };
}
