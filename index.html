    bn: 'Enduro 29', x: 0, n: 'SuspLogger-Demo', m: 'Mode démo : boîtier simulé', q: 1 };
  const bikes = [{ id: 'b1', name: 'Enduro 29', cfg: JSON.parse(JSON.stringify(DEMO_CFG)) },
    { id: 'b2', name: 'Trail 27,5', cfg: Object.assign(JSON.parse(JSON.stringify(DEMO_CFG)), { bike: 'Trail 27,5', rev: 1, fork: Object.assign({}, DEMO_CFG.fork, { travel_mm: 140, pressure: 62, tokens: 1 }), shock: Object.assign({}, DEMO_CFG.shock, { travel_mm: 55, pressure: 180 }) }) }];
  const info = { r: 'info', ok: true, pv: 3, fw: '11.0.4', board: 'V11', n: st.n, chm: 15, gps: 1, imu: 1, aux: 2, auxpu: 1, auxcfg: { label: '', unit: '', a: 1, b: 0, ppr: 1, circ: 2300 },
    zm: 3, bk: 15, cpmu: [1, 1], gr: 1, travel: [170, 60], pot: [200, 75], mg: [9.0, 9.9], cfg: 1, code: 0, bike: { id: 'b1', name: 'Enduro 29' }, nb: 2,
    opt: { astop: 0, apause: 2, wfboot: true, wfidle: 10, wfafter: false, led: 20, buzz: 2, name: 'Demo', ssid: st.n, da: '', theme: '', blecode: '' } };
  RM.demo = { st, info, bikes, cur: 'b1', t0, recAt: 0, calEnd: 0, live: false, files: null, cfgRx: '' };
  const emit = o => setTimeout(() => rmOnLine(JSON.stringify(o)), 120);
  RM.demo.emit = emit;
  RM.hasData = true;
  RM.demo.timer = setInterval(() => {
    const d = RM.demo, s = d.st, el = (Date.now() - t0) / 1000;
    if (el > 8 && s.g === 'search') { s.g = '3d'; s.gs = 11; s.m = 'GPS : position trouvée'; s.q++; }
    if (s.s === 'starting' && Date.now() - d.recAt > 700) { s.s = 'recording'; s.w = 0; s.m = 'Run démarré'; s.q++; d.recAt = Date.now(); }
    if (s.s === 'recording') {
      s.t = Math.floor((Date.now() - d.recAt) / 1000);
      s.gk = 18 + 14 * Math.abs(Math.sin(s.t / 7));
      s.b = Math.max(5, 86 - Math.floor(s.t / 40)); s.bm = Math.round(s.b / 86 * 290);
    }
    if (s.s === 'countdown') { s.cd = Math.ceil((d.calEnd - Date.now()) / 1000); if (s.cd <= 0) { s.s = 'capture'; d.capT0 = Date.now(); d.calEnd = Date.now() + (s.ck === 'stroke' ? 6500 : 600); } }
    else if (s.s === 'capture' && Date.now() > d.calEnd) demoCalDone();
    else if (s.s === 'capture' && s.ck === 'stroke') s.cy = [0, 1].map(c => d.sreq && d.sreq[c] > 0 ? Math.min(3, Math.floor((Date.now() - d.capT0) / 2000)) : 0);
    if (s.s === 'stopping' && Date.now() - d.recAt > 900) { s.s = 'idle'; s.m = 'Run enregistré'; s.q++; }
    rmOnLine(JSON.stringify(s));
  }, 1000);
  RM.demo.liveTimer = setInterval(() => { if (RM.demo && RM.demo.live) rmOnLine(JSON.stringify(demoLive())); }, 150);
  rmSetConn(true);
  emit({ r: 'hello', ok: true, pv: 3, fw: '11.0.4', n: st.n, auth: 0 });
}

function demoLive() {
  const t = Date.now() / 1000, d = RM.demo, s = d.st, i = d.info, cal = s.s === 'countdown' || s.s === 'capture';
  const mm = cal && s.ck === 'zero' ? [0.3, 0.2] : cal && s.ck === 'stroke' ? [100 + 95 * Math.sin(t * Math.PI), 37 + 35 * Math.sin(t * Math.PI)] : [42 + 25 * Math.sin(t * 1.3), 17 + 9 * Math.sin(t * 1.1 + 1)];
  const bk = cal && s.ck === 'brake_rel' ? [0, 0] : cal && s.ck === 'brake_pull' ? [100, 100] : [Math.max(0, 70 * Math.sin(t * 0.8) - 20), Math.max(0, 60 * Math.sin(t * 0.8 + 0.4) - 25)];
  const kmh = s.s === 'recording' ? 24 + 6 * Math.sin(t * 0.4) : 0;
  return { l: 1, ch: i.chm, raw: [3610 - mm[0] * 20.5, 3780 - mm[1] * 54.6, 2050 + bk[0] * 9, 2040 - bk[1] * 8.2], mv: [2920 - Math.round(mm[0] * 16), 3050 - Math.round(mm[1] * 44), 1650 + Math.round(bk[0] * 7), 1640 - Math.round(bk[1] * 6.6)],
    mm, bk: [0, 1].map(b => (i.bk & (5 << b)) === (5 << b) ? Math.round(bk[b]) : null), ax: i.aux === 2 ? { n: Math.floor((Date.now() - d.t0) / 1000 * (s.s === 'recording' ? 3 : 0.2)), hz: kmh / 3.6 / 2.3 } : i.aux === 1 ? { mv: 720 } : null,
    g: [-0.574, 0.01, 0.819], gy: cal ? 0.3 : 2.5 };
}

function demoCalDone() {
  const d = RM.demo, s = d.st, i = d.info, msgs = { zero: 'Zéro enregistré', stroke: 'Course du capteur enregistrée', level: 'Vélo à plat enregistré', brake_rel: 'Freins relâchés enregistrés : mesure maintenant les leviers serrés', brake_pull: 'Freins serrés enregistrés : calibration des freins terminée' };
  if (s.ck === 'zero') i.zm = i.chm & 3;
  if (s.ck === 'stroke') { [0, 1].forEach(c => { if (d.sreq && d.sreq[c] > 0) { i.cpmu[c] = 1; i.pot[c] = d.sreq[c]; } }); s.cy = [0, 0]; }
  if (s.ck === 'level') i.gr = 1;
  if (s.ck === 'brake_rel') i.bk |= (i.chm >> 2) & 3;
  if (s.ck === 'brake_pull') i.bk |= ((i.chm >> 2) & 3) << 2;
  s.s = 'idle'; s.m = msgs[s.ck]; s.q++; s.cs++;
  s.zm = i.zm; s.bk = i.bk; s.gr = i.gr; s.z = (i.zm & i.chm & 3) === (i.chm & 3) ? 1 : 0;
  d.emit(Object.assign({}, i));
}

/** Transfert simulé : le fichier embarqué est « envoyé » par paquets de 240 octets, ~250 Ko/s. */
function demoXfer(name, u8) {
  const d = RM.demo;
  let off = 0;
  d.emit({ r: 'get', ok: true, n: name, size: u8.length, off: 0, pl: 240, win: 24576 });
  clearInterval(d.xferTimer);
  setTimeout(() => {
    d.xferTimer = setInterval(() => {
      if (!RM.xfer) { clearInterval(d.xferTimer); return; }
      for (let k = 0; k < 50 && off < u8.length; k++) {
        const n = Math.min(240, u8.length - off), ab = new ArrayBuffer(n + 4), dv = new DataView(ab);
        dv.setUint32(0, off, true);
        new Uint8Array(ab, 4).set(u8.subarray(off, off + n));
        rmOnData(dv);
        off += n;
      }
      if (off >= u8.length) { clearInterval(d.xferTimer); d.emit({ r: 'got', ok: true, n: name, size: u8.length }); }
    }, 50);
  }, 300);
}

async function demoCommand(line) {
  const d = RM.demo, s = d.st, i = d.info, w = line.trim().split(/\s+/), cmd = w[0].toLowerCase();
  const reply = (ok, m) => d.emit({ r: cmd, ok, m: m || '' });
  const sendInfo = () => d.emit(Object.assign({}, i));
  const idle = s.s === 'idle';
  const curBike = () => d.bikes.find(b => b.id === d.cur);
  if (cmd === 'hello') return d.emit({ r: 'hello', ok: true, pv: 3, fw: '11.0.4', n: s.n, auth: 0 });
  if (cmd === 'auth' || cmd === 'time' || cmd === 'ping' || cmd === 'ack') return cmd === 'ack' ? undefined : reply(true, '');
  if (cmd === 'info') return sendInfo();
  if (cmd === 'status') return d.emit(Object.assign({}, s));
  if (cmd === 'live') { d.live = w[1] !== 'off'; s.lv = d.live ? 1 : 0; return reply(true, d.live ? 'on' : 'off'); }
  if (cmd === 'bikes') return d.emit({ r: 'bikes', ok: true, cur: d.cur, bikes: d.bikes.map(b => ({ id: b.id, name: b.name })) });
  if (cmd === 'bike') {
    const b = d.bikes.find(x => x.id === w[1]);
    if (!b || !idle) return reply(false, !b ? 'Vélo inconnu' : 'Arrête d\'abord l\'enregistrement ou la calibration en cours');
    d.cur = b.id; i.bike = { id: b.id, name: b.name }; s.bn = b.name; i.travel = [b.cfg.fork.travel_mm || 0, b.cfg.shock.travel_mm || 0];
    s.m = 'Vélo « ' + b.name + ' » : réglages, capteurs et calibrations chargés'; s.q++;
    reply(true, s.m); return sendInfo();
  }
  if (cmd === 'cfg') return d.emit({ r: 'cfg', ok: true, cfg: curBike().cfg });
  if (cmd === 'cfgw') { if (w[1] === '0') d.cfgRx = ''; d.cfgRx += w[2] || ''; return; }
  if (cmd === 'cfgend') {
    try {
      const bin = atob(d.cfgRx), u = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
      curBike().cfg = JSON.parse(new TextDecoder().decode(u));
      i.travel = [curBike().cfg.fork.travel_mm || 0, curBike().cfg.shock.travel_mm || 0];
      s.m = 'Réglages enregistrés depuis le téléphone'; s.q++;
      return d.emit({ r: 'cfg', ok: true, m: s.m });
    } catch (e) { return d.emit({ r: 'cfg', ok: false, m: 'Réglages illisibles' }); }
  }
  if (cmd === 'files') {
    const f = await demoFiles();
    if (!f.size) return d.emit({ r: 'files', ok: true, files: [] });
    return d.emit({ r: 'files', ok: true, files: Array.from(f.entries()).map(([n, u]) => ({ n, s: u.length })) });
  }
  if (cmd === 'get') { const f = await demoFiles(), u = f.get(w[1]); if (!u) return reply(false, 'Fichier introuvable'); return demoXfer(w[1], u); }
  if (cmd === 'abort') { clearInterval(d.xferTimer); return reply(true, ''); }
  if (cmd === 'start') {
    if (!idle) return reply(false, 'Occupé : une action est déjà en cours');
    if (!s.z) return reply(false, 'Zéro non calibré pour une suspension utilisée : faire d\'abord la calibration');
    s.s = 'starting'; s.run++; s.f = 'R' + String(s.run).padStart(4, '0') + '_demo.sus'; s.mk = 0; s.np = 0; s.t = 0; d.recAt = Date.now(); return reply(true, '');
  }
  if (cmd === 'stop') {
    if (s.s === 'countdown') { s.s = 'idle'; return reply(true, ''); }
    if (s.s !== 'recording') return reply(false, 'Aucun run en cours');
    s.s = 'stopping'; d.recAt = Date.now(); return reply(true, '');
  }
  if (cmd === 'comment') { if (!idle) return reply(false, 'Carte SD occupée : réessaie à l\'arrêt'); return reply(true, 'Commentaire enregistré'); }
  if (cmd === 'mark') { if (s.s !== 'recording') return reply(false, 'Repère possible seulement pendant un run'); s.mk++; return reply(true, 'Repère ' + s.mk); }
  if (cmd === 'find') return reply(true, '');
  if (cmd === 'wifi') { if (!idle) return reply(false, 'Wi-Fi indisponible pendant un run : arrête d\'abord l\'enregistrement'); s.w = w[1] === 'on' ? 1 : w[1] === 'off' ? 0 : 1 - s.w; return reply(true, s.w ? s.n : ''); }
  if (cmd === 'chan') {
    if (!idle) return reply(false, 'Arrête d\'abord l\'enregistrement ou la calibration en cours');
    const m = parseInt(w[1], 10);
    if (m >= 0) i.chm = m & 15;
    for (let k = 2; k + 1 < w.length; k += 2) { if (w[k] === 'gps') { i.gps = +w[k + 1] ? 1 : 0; s.g = i.gps ? '3d' : 'off'; } if (w[k] === 'aux') { i.aux = +w[k + 1]; s.ax = i.aux; } }
    s.ch = i.chm; s.z = (i.zm & i.chm & 3) === (i.chm & 3) ? 1 : 0; s.m = 'Capteurs utilisés enregistrés'; s.q++;
    reply(true, ''); return sendInfo();
  }
  if (cmd === 'cal' || cmd === 'zero' || cmd === 'cancel') {
    const k = cmd === 'cal' ? w[1] : cmd;
    if (k === 'cancel') { if (s.s !== 'countdown' && !(s.s === 'capture' && s.ck === 'stroke')) return reply(false, 'Aucun compte à rebours en cours'); s.m = s.s === 'countdown' ? 'Compte à rebours annulé' : 'Calibration de la course du capteur annulée'; s.s = 'idle'; s.q++; return reply(true, ''); }
    if (k === 'brake_reset') { i.bk = 0; s.bk = 0; reply(true, 'Calibration des freins effacée'); return sendInfo(); }
    if (k === 'level_reset') { i.gr = 0; s.gr = 0; reply(true, 'Verticale de la centrale effacée'); return sendInfo(); }
    if (k === 'reset') { i.cpmu = [0, 0]; reply(true, 'Échelle des capteurs réinitialisée'); return sendInfo(); }
    if (!['zero', 'stroke', 'level', 'brake_rel', 'brake_pull'].includes(k)) return reply(false, 'Calibration inconnue');
    if (k === 'stroke') d.sreq = [parseFloat(w[3]) || 0, parseFloat(w[4]) || 0];
    if (!idle) return reply(false, 'Occupé : termine l\'action en cours');
    s.s = 'countdown'; s.ck = k; s.cd = parseInt(w[2], 10) || 10; d.calEnd = Date.now() + s.cd * 1000; reply(true, k);
    return d.emit(Object.assign({}, s));
  }
  if (cmd === 'opt') {
    const k = w[1], v = w[2];
    if (!(k in i.opt)) return reply(false, 'Option inconnue');
    i.opt[k] = ['wfboot', 'wfafter'].includes(k) ? v === '1' : +v; reply(true, k); return sendInfo();
  }
  if (cmd === 'code') { i.code = w[1] && w[1] !== 'off' ? 1 : 0; reply(true, i.code ? 'Code d\'appairage enregistré' : 'Code d\'appairage supprimé'); return sendInfo(); }
  if (cmd === 'sleep') return reply(false, 'Indisponible dans la démo : la veille éteindrait le boîtier');
  return reply(false, 'Commande inconnue');
}

$('#rmTabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) rmSetTab(b.dataset.tab); };
rmRender();
/* Lien direct vers la démo : #demo, ou #demo=sens (onglet run | set | ana | sens | opt), ou #demo=run,rec (run en cours). */
if (/^#demo/.test(location.hash)) {
  const [tab, st] = location.hash.slice(6).split(',');
  if (TABS.some(t => t[0] === tab)) RM.tab = tab;
  demoStart();
  if (st === 'rec') setTimeout(() => demoCommand('start'), 600);
}
</script>
<script>
'use strict';
/* =====================================================================
   Fond « Relief » : courbes de niveau qui dérivent lentement derrière
   l'interface, comme une carte topographique vivante.
   - un canvas fixe sous le contenu, 12 images par seconde au plus ;
   - le navigateur suspend l'animation quand la page est cachée (écran éteint) ;
   - une seule image si l'appareil demande de réduire les animations ;
   - couleurs lues dans --cv-1 (courbes), --cv-2 (courbes maîtresses),
     --cv-3 (une courbe orange), relues au changement de thème.
   ===================================================================== */
(function () {
  const cv = document.createElement('canvas');
  cv.id = 'fond';
  cv.setAttribute('aria-hidden', 'true');
  document.body.prepend(cv);
  const ctx = cv.getContext('2d');

  // bruit de valeur 2D, reproductible
  function bruit(seed) {
    let a = seed >>> 0;
    const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const p = new Uint8Array(512);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = p[i]; p[i] = p[j]; p[j] = x; }
    for (let i = 0; i < 256; i++) p[i + 256] = p[i];
    const f = t => t * t * (3 - 2 * t);
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), X = xi & 255, Y = yi & 255, u = f(x - xi), v = f(y - yi);
      const a0 = p[p[X] + Y] / 255, b0 = p[p[X + 1] + Y] / 255, c0 = p[p[X] + Y + 1] / 255, d0 = p[p[X + 1] + Y + 1] / 255;
      return a0 + (b0 - a0) * u + (c0 - a0) * v + (a0 - b0 - c0 + d0) * u * v;
    };
  }
  const n1 = bruit(11), n2 = bruit(29);
  // carrés qui avancent : segments par configuration (T haut, R droite, B bas, L gauche)
  const MS = [null, 'LB', 'BR', 'LR', 'TR', 'TRLB', 'TB', 'TL', 'TL', 'TB', 'TLBR', 'TR', 'LR', 'BR', 'LB', null];
  const CELL = 10, NIV = 17;
  let W = 0, H = 0, g = null, nx = 0, ny = 0, col = ['', '', ''], s0 = 20;

  function lire() {
    const st = getComputedStyle(document.documentElement);
    col = ['--cv-1', '--cv-2', '--cv-3'].map(k => st.getPropertyValue(k).trim() || 'transparent');
  }
  function taille() {
    const w = document.documentElement.clientWidth, h = Math.max(innerHeight, document.documentElement.clientHeight);
    if (w === W && h <= H) return;                       // la barre d'adresse du téléphone qui se replie ne redessine pas tout
    W = w; H = h;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nx = Math.ceil(W / CELL) + 1; ny = Math.ceil(H / CELL) + 1;
    g = new Float32Array(nx * ny);
    dessiner(s0);
  }
  function dessiner(s) {
    if (!g) return;
    const sc = 1 / 170, t = s * .045;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const x = i * CELL * sc, y = j * CELL * sc;
      g[j * nx + i] = .62 * n1(x + t, y + t * .4) + .28 * n2(x * 2.1 - t * .7, y * 2.1 + 3.3) + .1 * n1(x * 4.3 + 9, y * 4.3 - t);
    }
    ctx.clearRect(0, 0, W, H);
    for (let k = 1; k < NIV; k++) {
      const L = .2 + k * (.6 / NIV), maitre = k % 4 === 0, vif = k === 11;
      ctx.beginPath();
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const a = g[j * nx + i], b = g[j * nx + i + 1], c = g[(j + 1) * nx + i + 1], d = g[(j + 1) * nx + i];
        const seg = MS[(a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0)];
        if (!seg) continue;
        const x0 = i * CELL, y0 = j * CELL;
        for (let q = 0; q < seg.length; q += 2) {
          for (let e = 0; e < 2; e++) {
            const k2 = seg[q + e];
            const px = k2 === 'T' ? x0 + CELL * (L - a) / (b - a) : k2 === 'R' ? x0 + CELL : k2 === 'B' ? x0 + CELL * (L - d) / (c - d) : x0;
            const py = k2 === 'T' ? y0 : k2 === 'R' ? y0 + CELL * (L - b) / (c - b) : k2 === 'B' ? y0 + CELL : y0 + CELL * (L - a) / (d - a);
            e ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
        }
      }
      ctx.strokeStyle = vif ? col[2] : maitre ? col[1] : col[0];
      ctx.lineWidth = vif ? 1.5 : maitre ? 1.25 : .8;
      ctx.stroke();
    }
  }

  const calme = matchMedia('(prefers-reduced-motion: reduce)');
  let avant = 0, tourne = false;
  function boucle(t) {
    if (calme.matches) { tourne = false; return; }
    requestAnimationFrame(boucle);
    if (t - avant < 80) return;
    avant = t;
    s0 = 20 + t / 1000;
    dessiner(s0);
  }
  function lancer() { if (!tourne && !calme.matches) { tourne = true; requestAnimationFrame(boucle); } }

  lire();
  taille();
  addEventListener('resize', taille);
  const relire = () => { lire(); dessiner(s0); };
  new MutationObserver(relire).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const sombre = matchMedia('(prefers-color-scheme: dark)');
  if (sombre.addEventListener) { sombre.addEventListener('change', relire); calme.addEventListener('change', lancer); }
  lancer();

  // halo orange qui suit la souris (ordinateur seulement : pas de survol au doigt)
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    document.body.style.setProperty('--mx', e.clientX + 'px');
    document.body.style.setProperty('--my', e.clientY + 'px');
  }, { passive: true });
})();
</script>
